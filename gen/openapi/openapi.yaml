# Generated with protoc-gen-openapi
# https://github.com/google/gnostic/tree/master/cmd/protoc-gen-openapi

openapi: 3.0.3
info:
    title: Kindlast Core API
    version: 1.0.0
paths:
    /api/v1/dashboard:
        get:
            tags:
                - DashboardService
            description: |-
                Posture, open counts, and when the agents last ran.

                 `dashboard:read` rather than `findings:read`: the posture is a summary a
                 viewer may see without being entitled to the individual findings behind it,
                 and keeping them separate leaves room for that.
            operationId: DashboardService_GetDashboard
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetDashboardResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/findings:
        get:
            tags:
                - FindingsService
            description: |-
                The feed: findings for the active organisation, newest first.

                 Ordered and paginated over the `(org_id, created_at desc)` index that
                 00002 created for exactly this query. Keyset rather than offset, because
                 the feed is written to while it is read: an offset page 2 silently skips a
                 finding whenever one arrives between requests, which in this product means
                 a compliance gap the customer never saw.
            operationId: FindingsService_ListFindings
            parameters:
                - name: pageToken
                  in: query
                  description: |-
                    Opaque. Clients must treat it as a token and never parse or construct one;
                     it encodes the keyset position and its format is free to change.
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: |-
                    Server-clamped. Zero means "the server decides", which is what a first
                     request should send.
                  schema:
                    type: integer
                    format: int32
                - name: status
                  in: query
                  description: |-
                    Optional filter: pending, approved, rejected, snoozed. Empty means every
                     status, which is what the feed's default view wants, because a finding a
                     human already dealt with is still part of the record.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListFindingsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/findings/{findingId}:
        get:
            tags:
                - FindingsService
            description: |-
                One finding, with the quoted regulatory text behind it.

                 The supporting text comes from `finding_supporting_chunks`, which is
                 org-gated in the database as well as here and returns no rows rather than
                 raising when the finding belongs to someone else.
            operationId: FindingsService_GetFinding
            parameters:
                - name: findingId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetFindingResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/findings/{findingId}:approve:
        post:
            tags:
                - FindingsService
            description: |-
                Approves a finding: the act path.

                 Writes exactly one audit row naming the acting human and the role they
                 held at the time (00006). The actor is never a request field: it is read
                 from the session GUC that the tenancy interceptor set, so a caller cannot
                 name someone else as the approver.

                 Idempotent. Approving an already-approved finding returns `applied: false`
                 and writes nothing, rather than erroring: the common cause is a double
                 submit or a retry, and neither is a problem the customer should be shown.

                 `:approve` rather than `/approve`, per AIP-136 and §12: a custom verb on a
                 resource, not a subresource that does not exist.
            operationId: FindingsService_ApproveFinding
            parameters:
                - name: findingId
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ApproveFindingRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApproveFindingResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/findings/{findingId}:reject:
        post:
            tags:
                - FindingsService
            description: |-
                Rejects a finding, optionally saying why.

                 The reason is not decoration. Three rejections of the same obligation on
                 the same profile raise a product review flag, which is how a bad rule gets
                 noticed rather than quietly ignored by every customer in turn.
            operationId: FindingsService_RejectFinding
            parameters:
                - name: findingId
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RejectFindingRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RejectFindingResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/findings/{findingId}:snooze:
        post:
            tags:
                - FindingsService
            description: |-
                Defers a finding for a number of days.

                 Deliberately NOT idempotent, unlike approve and reject. Deferring an
                 already-deferred finding is a second decision with a new date, and each one
                 is recorded, because a trail saying a finding was deferred once when a
                 human deferred it four times is exactly what an auditor is looking for.
            operationId: FindingsService_SnoozeFinding
            parameters:
                - name: findingId
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SnoozeFindingRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SnoozeFindingResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/invitations:
        post:
            tags:
                - OrgService
            description: |-
                Invites someone to the active organisation by email address.

                 The token is generated here, delivered by email, and stored only as a
                 hash: an invitation token is a bearer capability, so a database dump must
                 not contain anything that can be redeemed (00003).
            operationId: OrgService_InviteMember
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InviteMemberRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InviteMemberResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/invitations/{token}:accept:
        post:
            tags:
                - OrgService
            description: |-
                Joins the organisation named by an invitation token.

                 Scope is `openid` rather than `org:manage`: the caller is not managing an
                 organisation, they are redeeming a capability they were sent, and they
                 hold no role anywhere until this succeeds. Requiring an organisation scope
                 would mean an invitee could never accept their first invitation.
            operationId: OrgService_AcceptInvitation
            parameters:
                - name: token
                  in: path
                  description: |-
                    The raw token from the invitation link. Stored hashed, never in the
                     clear, so this value never matches anything a database dump contains.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AcceptInvitationResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/me:
        get:
            tags:
                - SessionService
            description: |-
                Returns the caller, their memberships with roles, and the active
                 organisation. On a subject it has never seen, it provisions a personal
                 organisation and an owner membership in one transaction before returning
                 (ENT-196), which is why this is a plain unary call rather than a read.
            operationId: SessionService_GetCurrentUser
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetCurrentUserResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/members:
        get:
            tags:
                - OrgService
            description: |-
                Lists the members of the active organisation.

                 `org:read` rather than `org:manage`: seeing who your colleagues are is not
                 an administrative act, and requiring the management scope would mean a
                 viewer could not render the page they are entitled to see.
            operationId: OrgService_ListMembers
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListMembersResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/members/{userId}:
        delete:
            tags:
                - OrgService
            description: |-
                Removes a member from the active organisation.

                 Removing the last owner is refused. An organisation with no owner has no
                 one who can invite, change roles or manage billing, and no path back short
                 of operator intervention.
            operationId: OrgService_RemoveMember
            parameters:
                - name: userId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RemoveMemberResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        patch:
            tags:
                - OrgService
            description: |-
                Changes a member's role.

                 Owner-only, enforced in the database as well as here: memberships_update_owner
                 requires app_org_role(org_id) = 'owner'. The handler check exists so the
                 caller gets a 403 that says what happened rather than an empty result set.
            operationId: OrgService_UpdateMemberRole
            parameters:
                - name: userId
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateMemberRoleRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateMemberRoleResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/organisation:
        patch:
            tags:
                - OrgService
            description: |-
                Renames the active organisation.

                 Singular `/organisation`, because it addresses the one the header names
                 rather than a collection member. The slug does NOT follow the rename, and
                 that is a product decision rather than an oversight: slugs live in
                 bookmarks and in emailed capability-token links, which are exactly the
                 links a compliance product has to keep working (§20.1, ENT-198).
            operationId: OrgService_UpdateOrganisation
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateOrganisationRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateOrganisationResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/organisations:
        post:
            tags:
                - OrgService
            description: |-
                Creates an organisation and makes the caller its owner.

                 No active organisation, so no header (see above). The slug is derived from
                 the name by org_slug() at insert time and is immutable afterwards.
            operationId: OrgService_CreateOrganisation
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateOrganisationRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateOrganisationResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
components:
    schemas:
        AcceptInvitationResponse:
            type: object
            properties:
                orgId:
                    type: string
                    description: |-
                        The organisation just joined, so the client can make it active without a
                         second round trip.
                orgName:
                    type: string
                role:
                    type: string
                    description: 'The role the invitation granted: owner, member or viewer.'
                orgSlug:
                    type: string
                    description: |-
                        The URL segment to redirect into, so an accepted invitation lands the
                         person inside the organisation they just joined rather than at a page
                         that has to look it up again (§20.1, ENT-198).
        ApproveFindingRequest:
            type: object
            properties:
                findingId:
                    type: string
                reviewed:
                    type: boolean
                    description: |-
                        Whether a human actually read the supporting text before approving, as
                         opposed to approving from the feed card. Recorded on the finding and
                         carried into the audit row: "approved" and "approved having read the
                         regulation" are different claims and the record should be able to tell
                         them apart.
        ApproveFindingResponse:
            type: object
            properties:
                applied:
                    type: boolean
                    description: |-
                        False when the finding was already approved, unknown, or belongs to another
                         organisation. All three are the same answer on purpose: a caller must not
                         be able to tell an unknown finding from one in another tenant, because that
                         difference is exactly what probing for tenancy leaks looks like.
                createdRecordId:
                    type: string
                    description: |-
                        The record the Executor created, when it created one. Empty today, because
                         `action_type` is always `review` (ENT-165) and no executor trigger fires.
                         A client sends the founder to this record when it is set and stays on the
                         finding when it is not.
                createdRecordTable:
                    type: string
                    description: |-
                        Which table `created_record_id` names, e.g. processing_activities. Present
                         so a client can route without hard-coding the action-to-table mapping.
        Citation:
            type: object
            properties:
                obligationSlug:
                    type: string
                    description: |-
                        The obligation this finding was raised against. Stable across rewordings
                         of the obligation text, so it is the right key for "show me every finding
                         about Article 30".
                title:
                    type: string
                    description: The obligation's own title, as stored.
                celex:
                    type: string
                    description: |-
                        The CELEX number of the instrument, e.g. 32016R0679 for the GDPR. The
                         natural key the corpus is indexed by.
                kind:
                    type: string
                    description: |-
                        article, recital or annex. Exactly one of the three fields below is set,
                         and the database enforces that with a check constraint rather than trusting
                         whoever writes the next producer.
                article:
                    type: integer
                    format: int32
                recital:
                    type: integer
                    format: int32
                annex:
                    type: string
                paragraph:
                    type: string
                    description: e.g. "1(b)". Present when the finding cites a sub-paragraph.
                label:
                    type: string
                    description: |-
                        The rendered citation, e.g. "GDPR Art. 30(1)(b)", assembled by
                         `analyst_citation_label` when the finding was created. Render this. Do not
                         rebuild it.
                url:
                    type: string
                    description: |-
                        Deep link to the provision on EUR-Lex, assembled by
                         `analyst_citation_url`. May be empty when the corpus has no anchor for the
                         provision; a client shows the label unlinked rather than guessing a URL.
            description: |-
                The regulatory basis for a finding, exactly as stored.

                 See the service comment: every field is a value the database already holds.
                 A client renders `label` and links `url`; the structured parts are present so
                 a client can filter or group by regulation, not so it can rebuild the label.
        CreateOrganisationRequest:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Free text as the customer writes it, including punctuation and non-ASCII.
                         The slug derived from it is the constrained value, not this.
        CreateOrganisationResponse:
            type: object
            properties:
                orgId:
                    type: string
                name:
                    type: string
                slug:
                    type: string
                    description: Derived from the name at insert time and immutable from then on.
                role:
                    type: string
                    description: |-
                        Always `owner`: whoever creates an organisation owns it. Returned rather
                         than assumed so a client never has to encode that rule.
        Finding:
            type: object
            properties:
                findingId:
                    type: string
                status:
                    type: string
                    description: pending, approved, rejected or snoozed.
                severity:
                    type: string
                    description: |-
                        low, medium, high or critical. Derived by `analyst_severity` when the
                         finding was created, not re-derived here, so the feed shows the severity
                         that was assessed rather than one recomputed against today's rules.
                detected:
                    type: string
                    description: What the Watcher observed, in the customer's terms.
                proposedAction:
                    type: string
                    description: |-
                        The one specific thing to do about it.

                         Today this is the SQL baseline sentence for every finding, because the
                         narrative layer was deleted with the console and has not been rebuilt
                         (ENT-162). The field is not new or provisional; what is missing is a
                         better value in it, and that is a producer concern rather than a contract
                         one.
                effortEstimate:
                    type: string
                    description: 'minutes, hours, days or weeks: how much work this is likely to be.'
                actionType:
                    type: string
                    description: |-
                        review, create_ropa, create_dsar or create_ai_system. Always `review`
                         today (ENT-165), which is why approving a finding creates no record yet.
                         Carried so a client can say what approving will do rather than promising
                         something generic.
                citation:
                    $ref: '#/components/schemas/Citation'
                createdAt:
                    type: string
                    format: date-time
                snoozedUntil:
                    type: string
                    description: Set only when status is `snoozed`.
                    format: date-time
                approvedBy:
                    type: string
                    description: |-
                        Set only when status is `approved`. The human who approved it, for "who
                         decided this", which is a question the feed should answer without a trip
                         to the audit log.
                rejectionReason:
                    type: string
                    description: Set only when status is `rejected`, and only when one was given.
            description: |-
                A finding as the feed renders it.

                 Everything here is stored. Nothing is computed at render time, and nothing
                 requires a client to combine two fields to produce a third.
        GetCurrentUserResponse:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: |-
                        The verified identity. Sourced from the token's claims rather than from
                         our database: the IdP owns users, this system owns memberships (§20.1).
                memberships:
                    type: array
                    items:
                        $ref: '#/components/schemas/Membership'
                    description: |-
                        Every organisation the caller belongs to, with the role they hold in it.
                         A consultant serving several client companies is a realistic user here,
                         so this is a list rather than a single value.
                activeOrgId:
                    type: string
                    description: |-
                        The organisation this request resolved to, which travels per request
                         rather than living in the token, so switching needs no re-minting.
                plan:
                    type: string
                    description: |-
                        The active organisation's plan, so the console can gate features without
                         a second call. Billing keys on the organisation, not the user.
        GetDashboardResponse:
            type: object
            properties:
                posture:
                    type: string
                    description: |-
                        green, amber, red, or not_assessed.

                         `not_assessed` is the important one and it is why this is not a boolean or
                         a score. Before the Watcher has ever run there are no findings, and a
                         posture derived from counting them reports green, which tells a customer
                         they are on track when the product has not looked (ENT-161). "We have not
                         assessed this yet" is the only honest answer at that point, and a compliance
                         product that says green instead is worse than one that says nothing.
                postureHeadline:
                    type: string
                    description: |-
                        A plain-language sentence for the band, e.g. "Two critical gaps need
                         attention". Server-side so that the wording is one thing rather than one
                         per client.
                openBySeverity:
                    $ref: '#/components/schemas/SeverityCounts'
                openTotal:
                    type: integer
                    description: Open findings across every severity.
                    format: int32
                pipeline:
                    $ref: '#/components/schemas/PipelineStatus'
        GetFindingResponse:
            type: object
            properties:
                finding:
                    $ref: '#/components/schemas/Finding'
                supporting:
                    type: array
                    items:
                        $ref: '#/components/schemas/SupportingChunk'
                    description: |-
                        The quoted regulatory text behind the finding, in reading order.

                         May be empty, and a client must cope: the corpus does not cover every
                         instrument an obligation can cite. An empty list means "we cannot show you
                         the text here", which is honest, and is not the same as the citation being
                         absent.
        GoogleProtobufAny:
            type: object
            properties:
                '@type':
                    type: string
                    description: The type of the serialized message.
            additionalProperties: true
            description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
        InviteMemberRequest:
            type: object
            properties:
                email:
                    type: string
                role:
                    type: string
                    description: The role the invitation grants on acceptance.
        InviteMemberResponse:
            type: object
            properties:
                invitationId:
                    type: string
                expiresAt:
                    type: string
                    description: |-
                        When the capability stops working. Returned so the console can tell the
                         inviter what they just created rather than describing it vaguely.
                    format: date-time
        ListFindingsResponse:
            type: object
            properties:
                findings:
                    type: array
                    items:
                        $ref: '#/components/schemas/Finding'
                nextPageToken:
                    type: string
                    description: |-
                        Empty when this is the last page. A client must key "there is more" off
                         this being non-empty rather than off the page being full: a full last page
                         is ordinary and would otherwise read as another page waiting.
        ListMembersResponse:
            type: object
            properties:
                members:
                    type: array
                    items:
                        $ref: '#/components/schemas/Member'
        Member:
            type: object
            properties:
                userId:
                    type: string
                    description: |-
                        The derived uuid, not the IdP subject. This is what UpdateMemberRole and
                         RemoveMember take.
                role:
                    type: string
                    description: One of owner, member, viewer.
                displayName:
                    type: string
                    description: |-
                        Both may be empty, and a client must cope. display_name is absent when the
                         authorization server returned no name claim, and both are absent for a
                         member who has never signed in since user_identities gained a row.

                         Visible to every member of the organisation regardless of role, which is a
                         decision the product owner took explicitly on 2026-08-15 rather than a
                         default nobody examined. See 00005_co_member_identity.sql.
                email:
                    type: string
                joinedAt:
                    type: string
                    format: date-time
        Membership:
            type: object
            properties:
                orgId:
                    type: string
                orgName:
                    type: string
                role:
                    type: string
                    description: |-
                        One of owner, member, viewer. Approval authority is a regulatory-relevant
                         fact, so it earns a role boundary (§20.1).
                orgSlug:
                    type: string
                    description: |-
                        The URL segment every console route for this organisation hangs off, as in
                         `/o/{org_slug}/feed` (§20.1, ENT-198).

                         Derived from the name when the organisation is created and immutable
                         afterwards, so it does not follow a rename: slugs live in bookmarks and in
                         emailed capability-token links, which are exactly the links a compliance
                         product has to keep working. A client that wants a label shows org_name; a
                         client that wants a link uses this.
        PipelineStatus:
            type: object
            properties:
                watcherLastRunAt:
                    type: string
                    description: |-
                        Absent when the Watcher has never run for this organisation, which is the
                         same condition that makes posture `not_assessed`. Read from
                         `compliance_profiles.watcher_last_run_at`.
                    format: date-time
                profileExists:
                    type: boolean
                    description: |-
                        False when no compliance profile exists yet, i.e. onboarding is not done.
                         Distinguishes "the agents have not run" from "there is nothing for them to
                         run against", which are different problems with different fixes.
            description: |-
                Whether the agents have actually run, which is the question the console
                 currently cannot answer.

                 The agent rail (ENT-222) exists to tell a human what The Watcher and The
                 Analyst are doing. Its first honest content is this: when they last ran, and
                 whether they ever have. Everything conversational comes later; this is the
                 part that stops the console implying work that has not happened.
        RejectFindingRequest:
            type: object
            properties:
                findingId:
                    type: string
                reason:
                    type: string
                    description: Optional, and worth asking for. See RejectFinding.
        RejectFindingResponse:
            type: object
            properties:
                applied:
                    type: boolean
        RemoveMemberResponse:
            type: object
            properties: {}
        SeverityCounts:
            type: object
            properties:
                critical:
                    type: integer
                    format: int32
                high:
                    type: integer
                    format: int32
                medium:
                    type: integer
                    format: int32
                low:
                    type: integer
                    format: int32
        SnoozeFindingRequest:
            type: object
            properties:
                findingId:
                    type: string
                days:
                    type: integer
                    description: Clamped to 1..365 by the database. Zero means the default of 7 days.
                    format: int32
        SnoozeFindingResponse:
            type: object
            properties:
                applied:
                    type: boolean
                snoozedUntil:
                    type: string
                    format: date-time
        Status:
            type: object
            properties:
                code:
                    type: integer
                    description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
                    format: int32
                message:
                    type: string
                    description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/GoogleProtobufAny'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
        SupportingChunk:
            type: object
            properties:
                ordinal:
                    type: integer
                    description: 'Reading order, starting at 1: the article first, then its sub-paragraphs.'
                    format: int32
                label:
                    type: string
                    description: |-
                        The citation label for this specific passage, which is more precise than
                         the finding's own label when the passage is a sub-paragraph.
                quotedText:
                    type: string
                    description: The regulatory text itself. Quoted from the corpus, never generated.
                sourceUrl:
                    type: string
            description: One quoted passage supporting a finding, from `finding_supporting_chunks`.
        UpdateMemberRoleRequest:
            type: object
            properties:
                userId:
                    type: string
                role:
                    type: string
                    description: |-
                        owner, member or viewer. Rejected with InvalidArgument otherwise rather
                         than left to the database's check constraint, so the caller gets a message
                         naming the valid values.
        UpdateMemberRoleResponse:
            type: object
            properties:
                member:
                    $ref: '#/components/schemas/Member'
        UpdateOrganisationRequest:
            type: object
            properties:
                name:
                    type: string
        UpdateOrganisationResponse:
            type: object
            properties:
                orgId:
                    type: string
                name:
                    type: string
                slug:
                    type: string
                    description: |-
                        Returned deliberately, and unchanged by the rename. A client that assumed
                         otherwise finds out here rather than by building a broken link.
        User:
            type: object
            properties:
                id:
                    type: string
                    description: |-
                        The IdP subject claim. The tenancy key is org_id; this identifies the
                         human, and is what created_by and approved_by record.
                email:
                    type: string
                displayName:
                    type: string
                emailVerified:
                    type: boolean
                    description: |-
                        Gates finding approval: an unverified address must not be able to sign
                         off a regulatory decision (§1.7).
tags:
    - name: DashboardService
      description: The dashboard's posture and the pipeline's honesty (§5).
    - name: FindingsService
      description: |-
        Findings, the feed, and the dashboard (core-api-surface §3 and §5).

         THE ORGANISATION IS NEVER IN THE PATH

         Same rule as OrgService and for the same reasons: every method here acts on
         the organisation named by the `Kindlast-Org-Id` header, resolved once per
         request before any handler runs. `{finding_id}` in a path names the thing
         being acted on, not the tenant, and is meaningless without the header.

         READ AND ACT ARE DIFFERENT SCOPES, DELIBERATELY

         `findings:read` and `findings:act` are separate because they are separately
         dangerous. Reading the feed discloses a customer's compliance gaps; acting on
         it changes the compliance record and writes an audit row attributed to a
         human. A token that can render the console is not thereby a token that can
         approve on someone's behalf, and an integration that only needs to display
         findings should not be one credential leak away from approving them.

         CITATIONS ARE CARRIED, NEVER ASSEMBLED BY A CLIENT

         This is the contract's most important property and the reason for the shape
         of `Citation` below. Kindlast's value is that a human can check a claim
         against the law, so a fabricated citation is worse than no finding at all.

         Every citation field here is a value the database already stored, assembled
         by `analyst_citation_label` and `analyst_citation_url` at the time the
         finding was created. There is no field a client is expected to combine, and
         no field from which a client could derive a different citation than the one
         the Analyst recorded. A renderer that wants "GDPR Art. 30(1)(b)" reads
         `label`; it must not build that string from `celex` and `article`, because a
         second assembler is a second thing that can be wrong, and the one that is
         wrong will be the one nobody tested.
    - name: OrgService
      description: |-
        Organisations and membership (core-api-surface §20.1).

         THE ORGANISATION IS NEVER IN THE PATH.

         Every method below acts on the organisation named by the `Kindlast-Org-Id`
         request header, which the interceptor resolves and verifies once per request
         before any handler runs. No RPC takes an org_id, and the REST aliases carry
         no `{org_id}` segment.

         This is worth stating loudly because conventional REST would write
         `/organisations/{org_id}/members/{user_id}` and it would be wrong here. The
         header exists so that membership has exactly one source of truth and so a
         consultant can switch active organisation without re-minting a token
         (interceptor/tenancy.go). A path parameter would give the same fact a second
         source, and a caller sending one organisation in the header and another in
         the path would have to be either an error nobody remembered to write or a
         silent winner. Neither is a good answer to a question that should not exist.

         The pattern is precedented rather than eccentric: Stripe scopes with the
         `Stripe-Account` header, and Slack with workspace-scoped tokens.

         `{user_id}` in a path is a different matter and is fine. It names the person
         being acted on, not the tenant, and it is meaningless without the header.

         TWO CALLS DELIBERATELY CARRY NO ORGANISATION

         CreateOrganisation and AcceptInvitation. In both the caller is establishing
         membership rather than exercising it, so there is no active organisation to
         name. Per §1.8 the header is OMITTED on these, not sent empty: an empty
         value is a client bug that should be refused, while its absence is a
         statement.

         THERE IS NO ListMyOrganisations, ON PURPOSE

         GetCurrentUser already returns every membership with its org id, name, slug
         and role, and it is the call the console bootstraps on. A second endpoint
         answering the same question would be a second thing to keep correct, and the
         two would drift the first time one grew a field. Revisit if a single user
         ever belongs to enough organisations to need pagination, which the sizing in
         §19.1 puts a long way off.
    - name: SessionService
      description: |-
        The console bootstrap call, and the first authenticated endpoint in the
         system (core-api-surface §1.5, §20.1).

         Only GetCurrentUser is defined here. The rest of the public surface arrives
         with the issues that implement it; defining it early would mean a contract
         nobody has verified against a handler.
