# Generated with protoc-gen-openapi
# https://github.com/google/gnostic/tree/master/cmd/protoc-gen-openapi

openapi: 3.0.3
info:
    title: Kindlast Core API
    version: 1.0.0
paths:
    /api/v1/audit:
        get:
            tags:
                - AuditService
            description: |-
                The decisions, filtered and paged.

                 Keyset over `(occurred_at desc, id desc)`, matching the
                 `audit_log_org_occurred_idx` index. Offset pagination would let a row
                 written between two page requests shift the window, and this is the one
                 register where a skipped row is a compliance problem rather than a
                 cosmetic one.
            operationId: AuditService_ListAuditEntries
            parameters:
                - name: filter.since
                  in: query
                  description: Inclusive lower bound on `occurred_at`. Absent means from the beginning.
                  schema:
                    type: string
                    format: date-time
                - name: filter.until
                  in: query
                  description: |-
                    Exclusive upper bound on `occurred_at`. Absent means up to now.

                     Exclusive rather than inclusive so that consecutive ranges tile without
                     overlapping. An auditor pulling January and then February with inclusive
                     bounds gets any row on the boundary twice, and a duplicated decision in an
                     audit file is a question nobody wants to answer.
                  schema:
                    type: string
                    format: date-time
                - name: filter.actionTypes
                  in: query
                  description: |-
                    Restrict to these action types, e.g. `approve_finding`. Empty means all.

                     Repeated rather than singular because the useful question is almost always
                     a group: "every decision a human made" is three action types, and making a
                     client issue three requests and merge them would also break the ordering.
                  schema:
                    type: array
                    items:
                        type: string
                - name: filter.actorUserIds
                  in: query
                  description: Restrict to these actors, by user id. Empty means all.
                  schema:
                    type: array
                    items:
                        type: string
                - name: filter.query
                  in: query
                  description: |-
                    Free text over the action type, the target table, and the actor's name and
                     email.

                     Deliberately NOT over the `before` and `after` payloads. Those are jsonb
                     holding whatever the acted-on row contained, which for a DSAR includes a
                     data subject's name. A substring search across them would turn the audit
                     log into a search engine over personal data that the surface exists to
                     account for, which is the wrong direction for a GDPR product to be pointing
                     its own tooling.
                  schema:
                    type: string
                - name: pageToken
                  in: query
                  description: |-
                    Opaque. Do not parse or construct one; a token from another list is
                     refused rather than misread.
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: Defaults to 50, capped at 200.
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListAuditEntriesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/audit:export:
        post:
            tags:
                - AuditService
            description: |-
                The same filtered set, as a file an auditor can attach to a report.

                 WHY THIS IS A SEPARATE RPC RATHER THAN A FLAG ON THE LIST

                 Because the two answer different questions. The list answers "what is on
                 this page", and is paged by construction. An export answers "everything
                 that matched", and an export that silently stopped at a page boundary is
                 worse than no export: the auditor cannot see the truncation, and the file
                 is the artefact that leaves the building.

                 WHY THE RESPONSE IS A ONEOF

                 §7 designs the export as a request that returns a signed download URL, and
                 §25 leaves synchronous-versus-job open. At today's volumes a synchronous
                 body is right and a job queue would be machinery for nobody. But the shape
                 that grows into a URL and the shape that does not are decided now, so the
                 response carries a `oneof`: today it is always `content`, and the day a
                 customer's log outgrows one response it becomes `download`, with no
                 contract break and no second RPC.
            operationId: AuditService_ExportAuditEntries
            parameters:
                - name: filter.since
                  in: query
                  description: Inclusive lower bound on `occurred_at`. Absent means from the beginning.
                  schema:
                    type: string
                    format: date-time
                - name: filter.until
                  in: query
                  description: |-
                    Exclusive upper bound on `occurred_at`. Absent means up to now.

                     Exclusive rather than inclusive so that consecutive ranges tile without
                     overlapping. An auditor pulling January and then February with inclusive
                     bounds gets any row on the boundary twice, and a duplicated decision in an
                     audit file is a question nobody wants to answer.
                  schema:
                    type: string
                    format: date-time
                - name: filter.actionTypes
                  in: query
                  description: |-
                    Restrict to these action types, e.g. `approve_finding`. Empty means all.

                     Repeated rather than singular because the useful question is almost always
                     a group: "every decision a human made" is three action types, and making a
                     client issue three requests and merge them would also break the ordering.
                  schema:
                    type: array
                    items:
                        type: string
                - name: filter.actorUserIds
                  in: query
                  description: Restrict to these actors, by user id. Empty means all.
                  schema:
                    type: array
                    items:
                        type: string
                - name: filter.query
                  in: query
                  description: |-
                    Free text over the action type, the target table, and the actor's name and
                     email.

                     Deliberately NOT over the `before` and `after` payloads. Those are jsonb
                     holding whatever the acted-on row contained, which for a DSAR includes a
                     data subject's name. A substring search across them would turn the audit
                     log into a search engine over personal data that the surface exists to
                     account for, which is the wrong direction for a GDPR product to be pointing
                     its own tooling.
                  schema:
                    type: string
                - name: format
                  in: query
                  description: |-
                    The only format for now. Named rather than assumed so adding one later is
                     an enum value rather than a new RPC.
                  schema:
                    enum:
                        - EXPORT_FORMAT_UNSPECIFIED
                        - EXPORT_FORMAT_CSV
                    type: string
                    format: enum
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ExportAuditEntriesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/billing:
        get:
            tags:
                - BillingService
            description: |-
                What this organisation is on, and what the console may offer.

                 Owner-only, per §20.1. A member cannot see it: billing is not secret from
                 colleagues in a moral sense, but a plan and a renewal date are commercial
                 facts about the company, and the role that manages them is the one that
                 signed for them.
            operationId: BillingService_GetBilling
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetBillingResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/dashboard:
        get:
            tags:
                - DashboardService
            description: |-
                Posture, open counts, and when the agents last ran.

                 `dashboard:read` rather than `findings:read`: the posture is a summary a
                 viewer may see without being entitled to the individual findings behind it,
                 and keeping them separate leaves room for that.
            operationId: DashboardService_GetDashboard
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetDashboardResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/findings:
        get:
            tags:
                - FindingsService
            description: |-
                The feed: findings for the active organisation, newest first.

                 Ordered and paginated over the `(org_id, created_at desc)` index that
                 00002 created for exactly this query. Keyset rather than offset, because
                 the feed is written to while it is read: an offset page 2 silently skips a
                 finding whenever one arrives between requests, which in this product means
                 a compliance gap the customer never saw.
            operationId: FindingsService_ListFindings
            parameters:
                - name: pageToken
                  in: query
                  description: |-
                    Opaque. Clients must treat it as a token and never parse or construct one;
                     it encodes the keyset position and its format is free to change.
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: |-
                    Server-clamped. Zero means "the server decides", which is what a first
                     request should send.
                  schema:
                    type: integer
                    format: int32
                - name: status
                  in: query
                  description: |-
                    Optional filter: pending, approved, rejected, snoozed. Empty means every
                     status, which is what the feed's default view wants, because a finding a
                     human already dealt with is still part of the record.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListFindingsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/findings/{findingId}:
        get:
            tags:
                - FindingsService
            description: |-
                One finding, with the quoted regulatory text behind it.

                 The supporting text comes from `finding_supporting_chunks`, which is
                 org-gated in the database as well as here and returns no rows rather than
                 raising when the finding belongs to someone else.
            operationId: FindingsService_GetFinding
            parameters:
                - name: findingId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetFindingResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/findings/{findingId}:approve:
        post:
            tags:
                - FindingsService
            description: |-
                Approves a finding: the act path.

                 Writes exactly one audit row naming the acting human and the role they
                 held at the time (00006). The actor is never a request field: it is read
                 from the session GUC that the tenancy interceptor set, so a caller cannot
                 name someone else as the approver.

                 Idempotent. Approving an already-approved finding returns `applied: false`
                 and writes nothing, rather than erroring: the common cause is a double
                 submit or a retry, and neither is a problem the customer should be shown.

                 `:approve` rather than `/approve`, per AIP-136 and §12: a custom verb on a
                 resource, not a subresource that does not exist.
            operationId: FindingsService_ApproveFinding
            parameters:
                - name: findingId
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ApproveFindingRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApproveFindingResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/findings/{findingId}:reject:
        post:
            tags:
                - FindingsService
            description: |-
                Rejects a finding, optionally saying why.

                 The reason is not decoration. Three rejections of the same obligation on
                 the same profile raise a product review flag, which is how a bad rule gets
                 noticed rather than quietly ignored by every customer in turn.
            operationId: FindingsService_RejectFinding
            parameters:
                - name: findingId
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RejectFindingRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RejectFindingResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/findings/{findingId}:snooze:
        post:
            tags:
                - FindingsService
            description: |-
                Defers a finding for a number of days.

                 Deliberately NOT idempotent, unlike approve and reject. Deferring an
                 already-deferred finding is a second decision with a new date, and each one
                 is recorded, because a trail saying a finding was deferred once when a
                 human deferred it four times is exactly what an auditor is looking for.
            operationId: FindingsService_SnoozeFinding
            parameters:
                - name: findingId
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SnoozeFindingRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SnoozeFindingResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/invitations:
        post:
            tags:
                - OrgService
            description: |-
                Invites someone to the active organisation by email address.

                 The token is generated here, delivered by email, and stored only as a
                 hash: an invitation token is a bearer capability, so a database dump must
                 not contain anything that can be redeemed (00003).
            operationId: OrgService_InviteMember
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InviteMemberRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InviteMemberResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/invitations/{token}:accept:
        post:
            tags:
                - OrgService
            description: |-
                Joins the organisation named by an invitation token.

                 Scope is `openid` rather than `org:manage`: the caller is not managing an
                 organisation, they are redeeming a capability they were sent, and they
                 hold no role anywhere until this succeeds. Requiring an organisation scope
                 would mean an invitee could never accept their first invitation.
            operationId: OrgService_AcceptInvitation
            parameters:
                - name: token
                  in: path
                  description: |-
                    The raw token from the invitation link. Stored hashed, never in the
                     clear, so this value never matches anything a database dump contains.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AcceptInvitationResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/me:
        get:
            tags:
                - SessionService
            description: |-
                Returns the caller, their memberships with roles, and the active
                 organisation. On a subject it has never seen, it provisions a personal
                 organisation and an owner membership in one transaction before returning
                 (ENT-196), which is why this is a plain unary call rather than a read.
            operationId: SessionService_GetCurrentUser
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetCurrentUserResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/members:
        get:
            tags:
                - OrgService
            description: |-
                Lists the members of the active organisation.

                 `org:read` rather than `org:manage`: seeing who your colleagues are is not
                 an administrative act, and requiring the management scope would mean a
                 viewer could not render the page they are entitled to see.
            operationId: OrgService_ListMembers
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListMembersResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/members/{userId}:
        delete:
            tags:
                - OrgService
            description: |-
                Removes a member from the active organisation.

                 Removing the last owner is refused. An organisation with no owner has no
                 one who can invite, change roles or manage billing, and no path back short
                 of operator intervention.
            operationId: OrgService_RemoveMember
            parameters:
                - name: userId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RemoveMemberResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        patch:
            tags:
                - OrgService
            description: |-
                Changes a member's role.

                 Owner-only, enforced in the database as well as here: memberships_update_owner
                 requires app_org_role(org_id) = 'owner'. The handler check exists so the
                 caller gets a 403 that says what happened rather than an empty result set.
            operationId: OrgService_UpdateMemberRole
            parameters:
                - name: userId
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateMemberRoleRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateMemberRoleResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/notification-capabilities:
        get:
            tags:
                - NotificationService
            description: |-
                Which notification channels this deployment can actually use (§18.3).

                 Exists so a console never renders a channel it cannot deliver on. Telegram,
                 Slack and WhatsApp are in the design and are not built, and the failure
                 this prevents is a settings page offering a switch that silently does
                 nothing, which is indistinguishable from a broken integration and generates
                 support instead of value.

                 Read from configuration rather than from a hard-coded array, because
                 "email" is only available on a deployment that has told core-api where to
                 submit mail. A self-hoster with no SMTP has no channels at all, and saying
                 so plainly is better than listing one that will queue forever.
            operationId: NotificationService_GetNotificationCapabilities
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetNotificationCapabilitiesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/notification-preferences:
        get:
            tags:
                - NotificationService
            description: |-
                The caller's own preferences for the active organisation.

                 Returns defaults rather than an error when no row exists, because somebody
                 who has never opened the settings page has no row and is nonetheless
                 subscribed: the product default is that a member is told. An error here
                 would make "I have not changed anything" indistinguishable from a fault.
            operationId: NotificationService_GetNotificationPreferences
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetNotificationPreferencesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        put:
            tags:
                - NotificationService
            description: |-
                Replace the caller's preferences for the active organisation.

                 A whole-object write rather than a patch. The settings surface renders every
                 field at once, so a partial update would mean deciding what an absent field
                 means, and "unset" and "set to false" are different intentions that a proto3
                 scalar cannot tell apart.
            operationId: NotificationService_UpdateNotificationPreferences
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateNotificationPreferencesRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateNotificationPreferencesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/organisation:
        patch:
            tags:
                - OrgService
            description: |-
                Renames the active organisation.

                 Singular `/organisation`, because it addresses the one the header names
                 rather than a collection member. The slug does NOT follow the rename, and
                 that is a product decision rather than an oversight: slugs live in
                 bookmarks and in emailed capability-token links, which are exactly the
                 links a compliance product has to keep working (§20.1, ENT-198).
            operationId: OrgService_UpdateOrganisation
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateOrganisationRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateOrganisationResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/organisations:
        post:
            tags:
                - OrgService
            description: |-
                Creates an organisation and makes the caller its owner.

                 No active organisation, so no header (see above). The slug is derived from
                 the name by org_slug() at insert time and is immutable afterwards.
            operationId: OrgService_CreateOrganisation
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateOrganisationRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateOrganisationResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/records/ai-systems:
        get:
            tags:
                - RecordsService
            description: |-
                The AI system register, which the AI Act calls for and the GDPR does not.

                 Paginated the same way, but note that `ai_systems` is indexed on `(org_id)`
                 alone rather than `(org_id, created_at desc)` like the other two. The
                 migration accompanying this surface adds the composite, because a keyset
                 page over an unsupported ordering sorts the whole tenant's rows on every
                 request: correct, and quietly quadratic.
            operationId: RecordsService_ListAiSystems
            parameters:
                - name: pageToken
                  in: query
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListAiSystemsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        post:
            tags:
                - RecordsService
            description: |-
                Registers a system nobody has approved a finding about.

                 Useful mostly for shadow AI: the system somebody adopted without telling
                 anyone is exactly the one no finding will ever raise.

                 Classifying a new system as `high` requires `reviewed`. See UpdateAiSystem.
            operationId: RecordsService_CreateAiSystem
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateAiSystemRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateAiSystemResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/records/ai-systems/{aiSystemId}:
        get:
            tags:
                - RecordsService
            operationId: RecordsService_GetAiSystem
            parameters:
                - name: aiSystemId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetAiSystemResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        patch:
            tags:
                - RecordsService
            description: |-
                Replaces a system's fields.

                 CHANGING A CLASSIFICATION REQUIRES `reviewed`, AND THAT IS THE POINT

                 Any change to `risk_classification` is refused unless the request carries
                 `reviewed: true`, and so is classifying a new system as `high`. The database
                 enforces it, not this layer.

                 The reason is that an Article 6 classification is the determination the
                 whole high-risk obligation stack hangs off. Moving a system out of `high` in
                 a form somebody was tabbing through would quietly retire Articles 9 to 17
                 for it, and the record would show a change with nobody's deliberate decision
                 behind it. A caller sends `reviewed` to say a human meant it, and the audit
                 row records that they did.

                 Refused answers `failed_precondition`: the caller may do this, and must
                 confirm first. That is not `permission_denied` and not `resource_exhausted`,
                 and a client shows a confirm step rather than an upgrade prompt.
            operationId: RecordsService_UpdateAiSystem
            parameters:
                - name: aiSystemId
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateAiSystemRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateAiSystemResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/records/dsars:
        get:
            tags:
                - RecordsService
            description: |-
                Data-subject access requests, and the statutory clock on each.

                 Ordered by `response_due_at` ascending rather than by creation, because the
                 only question anyone asks of this list is which one runs out first. That is
                 a different ordering from the other two lists on purpose, and it means a
                 page token from this list is not interchangeable with theirs.

                 Unlike the other two registers, nothing in this one arrives from an
                 approval. 00009 classified three obligations and deliberately mapped none of
                 them to `create_dsar`, and 00010 asserts that, so every row here was logged
                 by a human. `source_finding_id` is therefore always empty today; it is
                 carried rather than omitted because the executor path exists and the field
                 going from always-empty to sometimes-set must not be a contract change.
            operationId: RecordsService_ListDsars
            parameters:
                - name: pageToken
                  in: query
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: status
                  in: query
                  description: |-
                    Optional filter: open, in_progress, responded, closed. Empty means every
                     status, including the answered ones, because a closed request is still part
                     of the record an auditor asks to see.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListDsarsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        post:
            tags:
                - RecordsService
            description: |-
                Logs a request that arrived.

                 The only way a DSAR enters the register: nothing creates one from an
                 approval, because a request comes from a person and an obligation that
                 manufactured one would be inventing the requester.
            operationId: RecordsService_LogDsar
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LogDsarRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LogDsarResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/records/dsars/{dsarId}:
        get:
            tags:
                - RecordsService
            operationId: RecordsService_GetDsar
            parameters:
                - name: dsarId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetDsarResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/records/dsars/{dsarId}:respond:
        post:
            tags:
                - RecordsService
            description: |-
                Records that a response went out, which stops the statutory clock.

                 Requires `reviewed`, for the same class of reason UpdateAiSystem does: this
                 is the assertion that the organisation met an Article 12(3) deadline, and it
                 is the single most consequential row in this register to get wrong. A
                 regulator reading the log later is reading this field.

                 Idempotent. Marking an already-answered request returns `applied: false` and
                 writes nothing, rather than overwriting the date a response actually went
                 out with the date somebody clicked the button twice.

                 `:respond` rather than a status field on an update, per AIP-136: it is one
                 transition with a gate, not an arbitrary field change.
            operationId: RecordsService_MarkDsarResponded
            parameters:
                - name: dsarId
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/MarkDsarRespondedRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MarkDsarRespondedResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/records/processing-activities:
        get:
            tags:
                - RecordsService
            description: |-
                The Article 30 record of processing activities.

                 Ordered and paginated over the `(org_id, created_at desc)` index that 00001
                 created. Keyset rather than offset, for the reason ListFindings gives: the
                 list is written to while it is read, and an offset page 2 silently skips a
                 row whenever one arrives between requests.

                 Note this orders by creation, where the legacy register ordered by
                 `updated_at desc`. That was the better ordering for a register someone is
                 actively editing and it is the wrong one to paginate: a row edited between
                 two page requests moves position, so a keyset over `updated_at` can both
                 skip rows and return them twice. Creation order is stable, and "what did I
                 touch last" is a sort a client can offer within a page.
            operationId: RecordsService_ListProcessingActivities
            parameters:
                - name: pageToken
                  in: query
                  description: Opaque. Clients must treat it as a token and never parse or construct one.
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: Server-clamped. Zero means "the server decides".
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListProcessingActivitiesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        post:
            tags:
                - RecordsService
            description: |-
                Adds an activity the Executor has not seen.

                 Capped on the free plan, and the cap counts only manually-created rows: a
                 record created from an approved finding is part of the compliance record and
                 is never withheld behind a plan. Over the cap answers `resource_exhausted`
                 rather than `permission_denied`, because the caller is entitled to do this
                 and simply cannot right now, which is a distinction with a button under it.
            operationId: RecordsService_CreateProcessingActivity
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateProcessingActivityRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateProcessingActivityResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/records/processing-activities/{processingActivityId}:
        get:
            tags:
                - RecordsService
            operationId: RecordsService_GetProcessingActivity
            parameters:
                - name: processingActivityId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetProcessingActivityResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        patch:
            tags:
                - RecordsService
            description: |-
                Replaces an activity's fields.

                 A full replacement rather than a patch, and the field mask that would make
                 it a patch is deliberately absent. Article 30 is a record of fact whose gaps
                 are meaningful: clearing a legal basis is a real edit somebody makes when
                 they realise the one recorded was wrong, and a partial update in which an
                 omitted field means "leave it alone" gives a client no way to express that.
            operationId: RecordsService_UpdateProcessingActivity
            parameters:
                - name: processingActivityId
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateProcessingActivityRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateProcessingActivityResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /internal/v1/corpus:ingest:
        post:
            tags:
                - IngestService
            description: |-
                Writes a pack, or refuses it whole.

                 # IDEMPOTENT, AND THAT IS THE HARD REQUIREMENT

                 Every row upserts on its natural key: a document on its CELEX number, an
                 article on `(document, number)`, an obligation on its slug. Running the
                 same pack twice produces no duplicates and no drift, which matters because
                 the caller is a schedule: §20.3 makes this a singleton with a fixed
                 workflow id once Temporal lands at step 8, and a schedule that
                 double-writes on retry would compound silently.

                 # ONE TRANSACTION, SO A BAD PACK LEAVES NOTHING BEHIND

                 A pack that fails validation halfway would otherwise leave a corpus that is
                 partly the new snapshot and partly the old, which is the one state nobody
                 can reason about: a finding citing Article 30 would resolve, and the recital
                 beside it would not, with nothing to say which snapshot each came from.

                 # A CITATION THAT DOES NOT RESOLVE IS A REFUSAL, NOT A WARNING

                 Every obligation names an article, recital or annex, and ingest checks that
                 the thing exists before committing. AGENTS.md opens by saying a fabricated
                 citation is worse than nothing; an obligation pointing at an article that
                 is not in the corpus is exactly that, and it would surface to a customer as
                 a finding whose "check this against the law" link goes nowhere.
            operationId: IngestService_IngestCorpus
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/IngestCorpusRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IngestCorpusResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /internal/v1/sweep:
        post:
            tags:
                - SweepService
            description: |-
                Runs the Watcher and then the Analyst for one organisation.

                 The organisation comes from the `Kindlast-Org-Id` header, exactly as it
                 does on the human surface. A sweep is per-organisation and never global:
                 "sweep everyone" is an operation whose blast radius is every customer at
                 once, and it should be a loop somebody writes deliberately rather than a
                 parameter somebody can pass by accident.

                 Synchronous, and that is a decision with a shelf life. A sweep over one
                 organisation's profiles is fast enough to answer in a request today, and a
                 synchronous call is far easier to operate because the caller learns whether
                 it worked. When sweeps outgrow that, this returns a handle instead, which
                 is a proto change rather than an architectural one.
            operationId: SweepService_RunSweep
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RunSweepRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RunSweepResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
components:
    schemas:
        AcceptInvitationResponse:
            type: object
            properties:
                orgId:
                    type: string
                    description: |-
                        The organisation just joined, so the client can make it active without a
                         second round trip.
                orgName:
                    type: string
                role:
                    type: string
                    description: 'The role the invitation granted: owner, member or viewer.'
                orgSlug:
                    type: string
                    description: |-
                        The URL segment to redirect into, so an accepted invitation lands the
                         person inside the organisation they just joined rather than at a page
                         that has to look it up again (§20.1, ENT-198).
        Actor:
            type: object
            properties:
                userId:
                    type: string
                displayName:
                    type: string
                    description: |-
                        Display name and email, resolved from the identity record. Both empty for
                         an actor who has left the organisation, and for a non-human actor.

                         A row is NOT hidden when its actor is gone, and the entry keeps the user
                         id. An audit log that dropped rows when somebody was offboarded would be
                         trivially defeatable by offboarding somebody.
                email:
                    type: string
                actorRole:
                    type: string
                    description: |-
                        The role held AT THE TIME OF THE ACT, snapshotted into the row rather than
                         looked up now.

                         This is the whole reason the column exists. A page that resolved the role at
                         render time would say "approved by X, an admin" about an act X performed as
                         an owner, and would change what it said about a past act every time
                         somebody's role changed. The log has to stay true about the past.
                kind:
                    enum:
                        - ACTOR_KIND_UNSPECIFIED
                        - ACTOR_KIND_HUMAN
                        - ACTOR_KIND_SERVICE
                    type: string
                    format: enum
            description: |-
                Actor is who acted.

                 NOT ASSUMED TO BE A PERSON

                 It is one today, and §26 has agents producing acts that reference their run
                 record. `kind` exists so that day adds a value rather than a field, and so a
                 console is never written around "the actor's name" being a human's name.
        AiSystem:
            type: object
            properties:
                aiSystemId:
                    type: string
                name:
                    type: string
                vendor:
                    type: string
                    description: |-
                        Who supplies it. Empty for something built in house, which is a meaningful
                         empty rather than a missing one: the AI Act's provider and deployer duties
                         differ, and an organisation that built the system is generally both.
                purpose:
                    type: string
                riskClassification:
                    type: string
                    description: |-
                        unacceptable, high, limited, minimal, or unclassified.

                         `unclassified` is the default and is deliberately not `minimal`. Article 6
                         classification is a judgement with consequences, and a register that
                         defaults to the lowest tier tells a customer they are fine about a system
                         nobody has assessed. Same reasoning as `not_assessed` on the dashboard
                         posture (ENT-161), applied to a record instead of a summary.
                documentationStatus:
                    type: string
                    description: |-
                        missing, in_progress, or complete: how far the Article 11 technical
                         documentation has got.
                lastReviewedAt:
                    type: string
                    description: |-
                        When a human last looked at this entry. Absent means never, which for a
                         register that drives high-risk obligations is worth showing rather than
                         hiding behind a created date.
                    format: date-time
                sourceFindingId:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: One system in the AI Act register.
        AiSystemFields:
            type: object
            properties:
                name:
                    type: string
                vendor:
                    type: string
                purpose:
                    type: string
                riskClassification:
                    type: string
                    description: |-
                        unacceptable, high, limited, minimal, or unclassified. Empty means
                         `unclassified`, which is the honest default: see AiSystem.
                documentationStatus:
                    type: string
                    description: missing, in_progress, or complete. Empty means `missing`.
            description: The fields of an AI system entry a human supplies.
        Annex:
            type: object
            properties:
                label:
                    type: string
                    description: '`III`, and so on.'
                heading:
                    type: string
                summary:
                    type: string
                effectiveDate:
                    type: string
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/AnnexItem'
        AnnexItem:
            type: object
            properties:
                label:
                    type: string
                heading:
                    type: string
                    description: Only top-level items have one in the Official Journal; sub-items do not.
                summary:
                    type: string
                effectiveDate:
                    type: string
                ordering:
                    type: integer
                    format: int32
        ApproveFindingRequest:
            type: object
            properties:
                findingId:
                    type: string
                reviewed:
                    type: boolean
                    description: |-
                        Whether a human actually read the supporting text before approving, as
                         opposed to approving from the feed card. Recorded on the finding and
                         carried into the audit row: "approved" and "approved having read the
                         regulation" are different claims and the record should be able to tell
                         them apart.
        ApproveFindingResponse:
            type: object
            properties:
                applied:
                    type: boolean
                    description: |-
                        False when the finding was already approved, unknown, or belongs to another
                         organisation. All three are the same answer on purpose: a caller must not
                         be able to tell an unknown finding from one in another tenant, because that
                         difference is exactly what probing for tenancy leaks looks like.
                createdRecordId:
                    type: string
                    description: |-
                        The record the Executor created, when it created one.

                         Set when `action_type` was `create_ropa` or `create_ai_system`, empty when
                         it was `review`. A client sends the founder to this record when it is set
                         and stays on the finding when it is not.

                         Empty on a repeat approval even though a record exists, because nothing was
                         created by that call. This field reports what this request did, not what is
                         on file; RecordsService answers the second question.
                createdRecordTable:
                    type: string
                    description: |-
                        Which table `created_record_id` names, e.g. processing_activities. Present
                         so a client can route without hard-coding the action-to-table mapping.
        Article:
            type: object
            properties:
                articleNumber:
                    type: integer
                    format: int32
                heading:
                    type: string
                summary:
                    type: string
                    description: |-
                        Curated, 1 to 2000 characters, enforced by a database constraint. Not the
                         Official Journal wording; see the service comment.
                effectiveDate:
                    type: string
                    description: |-
                        Empty falls back to the document's version date at query time. Present for
                         the AI Act's staged schedule, where Article 4 applies from 2025-02-02 and
                         most others from 2026-08-02.
                paragraphs:
                    type: array
                    items:
                        $ref: '#/components/schemas/Paragraph'
        ArticleRecitalLink:
            type: object
            properties:
                articleNumber:
                    type: integer
                    format: int32
                recitalNumber:
                    type: integer
                    format: int32
        AuditEntry:
            type: object
            properties:
                id:
                    type: string
                occurredAt:
                    type: string
                    description: |-
                        When it happened. The transaction timestamp, so two rows written by one act
                         (the decision, and the record it created) share it. Their order relative to
                         each other is not observable and a client must not imply one.
                    format: date-time
                actionType:
                    type: string
                    description: |-
                        What was done: `approve_finding`, `reject_finding`, `snooze_finding`, and
                         the `create_*` rows the Executor writes.

                         A string rather than an enum, deliberately. The vocabulary grows as
                         obligations are added, and an old row whose action type a new client does
                         not recognise must still render as itself rather than as
                         `ACTION_UNSPECIFIED`. An audit log is the one register where an unknown
                         value must not be flattened.
                actor:
                    $ref: '#/components/schemas/Actor'
                findingId:
                    type: string
                    description: The finding this act was about, when there was one.
                targetTable:
                    type: string
                    description: 'The row this act created or changed: the table name and its id.'
                targetId:
                    type: string
                beforeJson:
                    type: string
                    description: |-
                        The acted-on row before and after, as JSON, or empty when not recorded.

                         Carried as strings rather than Struct so what a client renders is byte for
                         byte what the database stored. Round-tripping through Struct silently
                         rewrites numbers as doubles and reorders keys, and a diff view built on
                         that is showing the auditor a re-serialisation rather than the record.
                afterJson:
                    type: string
                agentRunId:
                    type: string
                    description: |-
                        The agent run that produced this act, when one did (§26).

                         Always empty today: nothing writes it, because `agent_runs` arrives with
                         ENT-218. Declared now so the read model does not have to change when it
                         does, and so no client is written on the assumption that every act had a
                         human behind it.
            description: AuditEntry is one act, as recorded when it happened.
        Citation:
            type: object
            properties:
                obligationSlug:
                    type: string
                    description: |-
                        The obligation this finding was raised against. Stable across rewordings
                         of the obligation text, so it is the right key for "show me every finding
                         about Article 30".
                title:
                    type: string
                    description: The obligation's own title, as stored.
                celex:
                    type: string
                    description: |-
                        The CELEX number of the instrument, e.g. 32016R0679 for the GDPR. The
                         natural key the corpus is indexed by.
                kind:
                    type: string
                    description: |-
                        article, recital or annex. Exactly one of the three fields below is set,
                         and the database enforces that with a check constraint rather than trusting
                         whoever writes the next producer.
                article:
                    type: integer
                    format: int32
                recital:
                    type: integer
                    format: int32
                annex:
                    type: string
                paragraph:
                    type: string
                    description: e.g. "1(b)". Present when the finding cites a sub-paragraph.
                label:
                    type: string
                    description: |-
                        The rendered citation, e.g. "GDPR Art. 30(1)(b)", assembled by
                         `analyst_citation_label` when the finding was created. Render this. Do not
                         rebuild it.
                url:
                    type: string
                    description: |-
                        Deep link to the provision on EUR-Lex, assembled by
                         `analyst_citation_url`. May be empty when the corpus has no anchor for the
                         provision; a client shows the label unlinked rather than guessing a URL.
            description: |-
                The regulatory basis for a finding, exactly as stored.

                 See the service comment: every field is a value the database already holds.
                 A client renders `label` and links `url`; the structured parts are present so
                 a client can filter or group by regulation, not so it can rebuild the label.
        CreateAiSystemRequest:
            type: object
            properties:
                fields:
                    $ref: '#/components/schemas/AiSystemFields'
                reviewed:
                    type: boolean
                    description: Required when `risk_classification` is `high`. See UpdateAiSystem.
        CreateAiSystemResponse:
            type: object
            properties:
                aiSystem:
                    $ref: '#/components/schemas/AiSystem'
        CreateOrganisationRequest:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Free text as the customer writes it, including punctuation and non-ASCII.
                         The slug derived from it is the constrained value, not this.
        CreateOrganisationResponse:
            type: object
            properties:
                orgId:
                    type: string
                name:
                    type: string
                slug:
                    type: string
                    description: Derived from the name at insert time and immutable from then on.
                role:
                    type: string
                    description: |-
                        Always `owner`: whoever creates an organisation owns it. Returned rather
                         than assumed so a client never has to encode that rule.
        CreateProcessingActivityRequest:
            type: object
            properties:
                fields:
                    $ref: '#/components/schemas/ProcessingActivityFields'
        CreateProcessingActivityResponse:
            type: object
            properties:
                processingActivity:
                    allOf:
                        - $ref: '#/components/schemas/ProcessingActivity'
                    description: The created record, so a client renders it without a second call.
        Dsar:
            type: object
            properties:
                dsarId:
                    type: string
                subjectName:
                    type: string
                    description: |-
                        Who asked. Optional in the database because a request can arrive
                         pseudonymously, through a form or an inbox, before anyone has identified the
                         person behind it.
                requestType:
                    type: string
                    description: |-
                        access, erasure, rectification, portability, objection, restriction.

                         Free text rather than an enum, because Article 15-22 requests arrive worded
                         by the person making them, and forcing them into a closed list at intake
                         loses what was actually asked for.
                status:
                    type: string
                    description: |-
                        open, in_progress, responded, or closed. The recorded workflow state, as
                         distinct from `urgency`, which is derived from the clock.
                receivedAt:
                    type: string
                    description: |-
                        When the request was RECEIVED, which is when the statutory clock starts.

                         ENT-224. This is not the row's creation timestamp and the two routinely
                         differ: a request that arrived by post on the 1st and was logged on the 8th
                         is due one month from the 1st. Article 12(3) runs from receipt, so a clock
                         started at data entry silently grants the organisation the days it took them
                         to notice, which is exactly backwards.
                    format: date-time
                responseDueAt:
                    type: string
                    description: |-
                        Article 12(3): one month from receipt, extendable by two further months for
                         complex requests. Stored rather than computed here, so an extension is
                         recorded as a fact about this request instead of being re-derived from a
                         rule that may since have changed. The extension itself is not yet modelled;
                         00010 left it open as a schema question.
                    format: date-time
                respondedAt:
                    type: string
                    description: Set once a response has gone out.
                    format: date-time
                handler:
                    type: string
                    description: |-
                        Who inside the organisation is dealing with it. Free text: this is often a
                         role or an external DPO rather than a member of the workspace.
                urgency:
                    type: string
                    description: |-
                        overdue, due_soon, on_track, or answered.

                         Derived from `response_due_at` against the clock, with `due_soon` meaning
                         ten days or fewer remaining. That window is the legacy console's escalation
                         threshold, preserved deliberately: it is late enough to be urgent and early
                         enough that a month-long response can still be assembled.

                         Computed server-side so the threshold has one definition. A client that
                         re-derived it from `response_due_at` would be a second implementation of a
                         regulatory deadline, and the two would eventually disagree.

                         `answered` rather than a date comparison once `responded_at` is set: a
                         request answered on time and one answered late are both answered, and the
                         list should stop shouting about either.
                daysUntilDue:
                    type: integer
                    description: |-
                        Whole days until `response_due_at`, negative once it has passed. Carried
                         alongside `urgency` because "4 days left" and "11 days overdue" are the
                         words a handler acts on, and rounding a timestamp difference is another
                         thing two clients would do differently.
                    format: int32
                sourceFindingId:
                    type: string
                    description: Always empty today. See ListDsars.
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: A data-subject access request, and the clock on it.
        EnforcementDecision:
            type: object
            properties:
                slug:
                    type: string
                dpa:
                    type: string
                    description: The supervisory authority that decided it.
                title:
                    type: string
                decisionDate:
                    type: string
                fineEur:
                    type: string
                    description: |-
                        Absent where a decision carried no fine, which is common: a reprimand or a
                         processing ban is an outcome too, and treating "no fine" as zero would make
                         an enforcement register read as a list of free passes.
                hasFine:
                    type: boolean
                summary:
                    type: string
                sourceUrl:
                    type: string
                gdprArticles:
                    type: array
                    items:
                        type: integer
                        format: int32
                topicTags:
                    type: array
                    items:
                        type: string
        ExportAuditEntriesResponse:
            type: object
            properties:
                content:
                    allOf:
                        - $ref: '#/components/schemas/ExportContent'
                    description: The file itself. What this returns today.
                download:
                    allOf:
                        - $ref: '#/components/schemas/ExportDownload'
                    description: |-
                        A signed, expiring URL to fetch it from. Not yet produced; declared so
                         the day a log outgrows one response is a server change rather than a
                         contract break.
                rowCount:
                    type: integer
                    description: How many rows the file holds.
                    format: int32
                truncated:
                    type: boolean
                    description: |-
                        True when the export hit its row cap and the file is not the whole matching
                         set.

                         **A console must show this, and it is the reason this field exists.** A
                         truncated export is invisible in the file itself: it is a valid CSV that
                         simply stops. An auditor who attaches it to a report has attached an
                         incomplete record without knowing, which is the specific failure this whole
                         surface exists to prevent. Narrow the time range and export again.
        ExportContent:
            type: object
            properties:
                data:
                    type: string
                    format: bytes
                filename:
                    type: string
                    description: Suggested filename, e.g. `kindlast-audit-2026-08-17.csv`.
                contentType:
                    type: string
        ExportDownload:
            type: object
            properties:
                url:
                    type: string
                expiresAt:
                    type: string
                    format: date-time
        Finding:
            type: object
            properties:
                findingId:
                    type: string
                status:
                    type: string
                    description: pending, approved, rejected or snoozed.
                severity:
                    type: string
                    description: |-
                        low, medium, high or critical. Derived by `analyst_severity` when the
                         finding was created, not re-derived here, so the feed shows the severity
                         that was assessed rather than one recomputed against today's rules.
                detected:
                    type: string
                    description: What the Watcher observed, in the customer's terms.
                proposedAction:
                    type: string
                    description: |-
                        The one specific thing to do about it.

                         Today this is the SQL baseline sentence for every finding, because the
                         narrative layer was deleted with the console and has not been rebuilt
                         (ENT-162). The field is not new or provisional; what is missing is a
                         better value in it, and that is a producer concern rather than a contract
                         one.
                effortEstimate:
                    type: string
                    description: 'minutes, hours, days or weeks: how much work this is likely to be.'
                actionType:
                    type: string
                    description: |-
                        review, create_ropa, create_dsar or create_ai_system.

                         Tracks `obligations.action_type` (00007), which 00009 classified. Approving
                         a finding whose action is `create_ropa` or `create_ai_system` creates the
                         record; `review` records the decision and creates nothing, which is the
                         right outcome for an obligation whose remedy is not a row.

                         No obligation maps to `create_dsar`, and 00009 asserts that rather than
                         leaving it to chance: a data-subject request arrives from a person, so an
                         obligation that manufactured one would be inventing the requester.

                         Carried so a client can say what approving will do rather than promising
                         something generic.
                citation:
                    $ref: '#/components/schemas/Citation'
                createdAt:
                    type: string
                    format: date-time
                snoozedUntil:
                    type: string
                    description: Set only when status is `snoozed`.
                    format: date-time
                approvedBy:
                    type: string
                    description: |-
                        Set only when status is `approved`. The human who approved it, for "who
                         decided this", which is a question the feed should answer without a trip
                         to the audit log.
                rejectionReason:
                    type: string
                    description: Set only when status is `rejected`, and only when one was given.
            description: |-
                A finding as the feed renders it.

                 Everything here is stored. Nothing is computed at render time, and nothing
                 requires a client to combine two fields to produce a third.
        GetAiSystemResponse:
            type: object
            properties:
                aiSystem:
                    $ref: '#/components/schemas/AiSystem'
        GetBillingResponse:
            type: object
            properties:
                plan:
                    type: string
                    description: |-
                        The plan in force: `free` or `pro`.

                         Reported from the subscription's plan AND status together, never the plan
                         column alone. A cancelled or past_due `pro` row reads as `free` here,
                         because entitlement is what the customer currently has rather than what
                         they last bought. That trap has been hit twice in this codebase.
                status:
                    type: string
                    description: |-
                        The raw subscription status: `active`, `past_due` or `canceled`. Empty when
                         no subscription row exists, which is a new organisation rather than an
                         error.

                         Separate from `plan` so a console can say "your payment failed" rather than
                         silently showing a downgrade the customer did not ask for. `past_due` is
                         the state where the two differ and the difference is the whole message.
                currentPeriodEnd:
                    type: string
                    description: When the current period ends. Absent when there is no subscription.
                    format: date-time
                billingConfigured:
                    type: boolean
                    description: |-
                        Whether this deployment sells anything at all.

                         False on a self-hosted stack with no provider configured, and then a
                         console must render no upgrade path, no checkout and no plan comparison.
                         Reported rather than inferred from the absence of a subscription row: a
                         hosted customer between provisioning and their first row would look
                         identical, and would be shown a page telling them their own product cannot
                         be bought.
                gatingEnabled:
                    type: boolean
                    description: |-
                        Whether plan gating applies. False means no feature is withheld for being
                         on the free plan, which is the self-hosted default (§18.1).

                         Distinct from `billing_configured` on purpose: an operator may wire a
                         provider before turning gating on, and during that window the honest
                         answer is that checkout exists and nothing is withheld yet.
        GetCurrentUserResponse:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: |-
                        The verified identity. Sourced from the token's claims rather than from
                         our database: the IdP owns users, this system owns memberships (§20.1).
                memberships:
                    type: array
                    items:
                        $ref: '#/components/schemas/Membership'
                    description: |-
                        Every organisation the caller belongs to, with the role they hold in it.
                         A consultant serving several client companies is a realistic user here,
                         so this is a list rather than a single value.
                activeOrgId:
                    type: string
                    description: |-
                        The organisation this request resolved to, which travels per request
                         rather than living in the token, so switching needs no re-minting.
                plan:
                    type: string
                    description: |-
                        The active organisation's plan, so the console can gate features without
                         a second call. Billing keys on the organisation, not the user.
        GetDashboardResponse:
            type: object
            properties:
                posture:
                    type: string
                    description: |-
                        green, amber, red, or not_assessed.

                         `not_assessed` is the important one and it is why this is not a boolean or
                         a score. Before the Watcher has ever run there are no findings, and a
                         posture derived from counting them reports green, which tells a customer
                         they are on track when the product has not looked (ENT-161). "We have not
                         assessed this yet" is the only honest answer at that point, and a compliance
                         product that says green instead is worse than one that says nothing.
                postureHeadline:
                    type: string
                    description: |-
                        A plain-language sentence for the band, e.g. "Two critical gaps need
                         attention". Server-side so that the wording is one thing rather than one
                         per client.
                openBySeverity:
                    $ref: '#/components/schemas/SeverityCounts'
                openTotal:
                    type: integer
                    description: Open findings across every severity.
                    format: int32
                pipeline:
                    $ref: '#/components/schemas/PipelineStatus'
        GetDsarResponse:
            type: object
            properties:
                dsar:
                    $ref: '#/components/schemas/Dsar'
        GetFindingResponse:
            type: object
            properties:
                finding:
                    $ref: '#/components/schemas/Finding'
                supporting:
                    type: array
                    items:
                        $ref: '#/components/schemas/SupportingChunk'
                    description: |-
                        The quoted regulatory text behind the finding, in reading order.

                         May be empty, and a client must cope: the corpus does not cover every
                         instrument an obligation can cite. An empty list means "we cannot show you
                         the text here", which is honest, and is not the same as the citation being
                         absent.
        GetNotificationCapabilitiesResponse:
            type: object
            properties:
                channels:
                    type: array
                    items:
                        $ref: '#/components/schemas/NotificationChannel'
        GetNotificationPreferencesResponse:
            type: object
            properties:
                preferences:
                    $ref: '#/components/schemas/NotificationPreferences'
        GetProcessingActivityResponse:
            type: object
            properties:
                processingActivity:
                    $ref: '#/components/schemas/ProcessingActivity'
        GoogleProtobufAny:
            type: object
            properties:
                '@type':
                    type: string
                    description: The type of the serialized message.
            additionalProperties: true
            description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
        Guideline:
            type: object
            properties:
                slug:
                    type: string
                publisher:
                    type: string
                title:
                    type: string
                adoptedDate:
                    type: string
                version:
                    type: string
                sourceUrl:
                    type: string
                topicTags:
                    type: array
                    items:
                        type: string
        IngestCorpusRequest:
            type: object
            properties:
                pack:
                    $ref: '#/components/schemas/RegulationPack'
                dryRun:
                    type: boolean
                    description: |-
                        Validate and report, write nothing.

                         Worth having because the expensive failure here is a pack that is 90%
                         right: a curator wants to know which citations dangle before deciding
                         whether to fix the pack or ingest the corpus it depends on first. The
                         response is identical either way apart from `applied`.
        IngestCorpusResponse:
            type: object
            properties:
                applied:
                    type: boolean
                    description: |-
                        False on a dry run, and on nothing else: a real run either applied the pack
                         or returned an error.
                counts:
                    allOf:
                        - $ref: '#/components/schemas/IngestCounts'
                    description: |-
                        What was written, by table. Counts an upsert once whether it inserted or
                         updated: the useful question after a re-ingest is "did the pack land",
                         which is answered by the total matching the pack, not by a split that
                         changes every time somebody edits a summary.
                unresolvedCitations:
                    type: array
                    items:
                        type: string
                    description: |-
                        Citations that did not resolve, in the order they appear in the pack.

                         Populated on a dry run. On a real run the request fails instead and this is
                         carried on the error detail, because a partially-good pack must not look
                         like a success with a note attached.
                ingestedAt:
                    type: string
                    format: date-time
        IngestCounts:
            type: object
            properties:
                documents:
                    type: integer
                    format: int32
                articles:
                    type: integer
                    format: int32
                paragraphs:
                    type: integer
                    format: int32
                recitals:
                    type: integer
                    format: int32
                annexes:
                    type: integer
                    format: int32
                annexItems:
                    type: integer
                    format: int32
                articleRecitalLinks:
                    type: integer
                    format: int32
                obligations:
                    type: integer
                    format: int32
                guidelines:
                    type: integer
                    format: int32
                enforcementDecisions:
                    type: integer
                    format: int32
        InviteMemberRequest:
            type: object
            properties:
                email:
                    type: string
                role:
                    type: string
                    description: The role the invitation grants on acceptance.
        InviteMemberResponse:
            type: object
            properties:
                invitationId:
                    type: string
                expiresAt:
                    type: string
                    description: |-
                        When the capability stops working. Returned so the console can tell the
                         inviter what they just created rather than describing it vaguely.
                    format: date-time
        ListAiSystemsResponse:
            type: object
            properties:
                aiSystems:
                    type: array
                    items:
                        $ref: '#/components/schemas/AiSystem'
                nextPageToken:
                    type: string
        ListAuditEntriesResponse:
            type: object
            properties:
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/AuditEntry'
                nextPageToken:
                    type: string
                    description: |-
                        Empty when there are no more. The only signal that more exist: do not
                         infer it from a full page.
                availableActionTypes:
                    type: array
                    items:
                        type: string
                    description: |-
                        Every action type present in this organisation's log, whatever the filter.

                         Returned so a console can render a filter control that offers only values
                         that would return something. A dropdown listing every action type the
                         schema could theoretically hold sends a person hunting for rows that were
                         never written.
        ListDsarsResponse:
            type: object
            properties:
                dsars:
                    type: array
                    items:
                        $ref: '#/components/schemas/Dsar'
                    description: Soonest deadline first. See ListDsars.
                nextPageToken:
                    type: string
        ListFindingsResponse:
            type: object
            properties:
                findings:
                    type: array
                    items:
                        $ref: '#/components/schemas/Finding'
                nextPageToken:
                    type: string
                    description: |-
                        Empty when this is the last page. A client must key "there is more" off
                         this being non-empty rather than off the page being full: a full last page
                         is ordinary and would otherwise read as another page waiting.
        ListMembersResponse:
            type: object
            properties:
                members:
                    type: array
                    items:
                        $ref: '#/components/schemas/Member'
        ListProcessingActivitiesResponse:
            type: object
            properties:
                processingActivities:
                    type: array
                    items:
                        $ref: '#/components/schemas/ProcessingActivity'
                nextPageToken:
                    type: string
                    description: |-
                        Empty when this is the last page. Key "there is more" off this being
                         non-empty, never off the page being full.
                manualQuota:
                    allOf:
                        - $ref: '#/components/schemas/ManualQuota'
                    description: |-
                        How many manually-created activities the plan allows, and how many are used.

                         Carried on the list because that is where a client has to decide whether
                         "Add activity" is available, and computing it needs a count the client does
                         not otherwise have. The limit counts only rows with no `source_finding_id`:
                         a record the Executor created on an approved finding is part of the
                         compliance record and is never withheld behind a plan (ENT-84).
        LogDsarRequest:
            type: object
            properties:
                subjectName:
                    type: string
                    description: |-
                        Optional: a request can arrive pseudonymously, before anyone has identified
                         the person behind it.
                requestType:
                    type: string
                    description: |-
                        access, erasure, rectification, portability, objection, restriction. Free
                         text, for the reason Dsar.request_type gives.
                handler:
                    type: string
                    description: Optional. Often a role or an external DPO rather than a member.
                receivedAt:
                    type: string
                    description: |-
                        When the request actually arrived. Absent means today.

                         ENT-224, and the reason this field exists at all. Without it the deadline
                         was computed from the moment somebody got round to logging the request, so
                         one that came by post on the 1st and was entered on the 8th was recorded as
                         due a month from the 8th. Article 12(3) runs from receipt, so a clock
                         started at data entry silently grants the organisation the days it took
                         them to notice: the slower they are, the longer they appear to have.

                         A future date is refused rather than clamped. A request cannot have arrived
                         tomorrow, and the likeliest cause is a typo that would extend a statutory
                         deadline nobody chose to extend.

                         Absent is allowed and means today, unlike the executor path, where a
                         missing date is a producer bug. Somebody logging a request that came in
                         this morning has nothing to type, and requiring a date would produce a
                         field everybody fills with today by reflex.
                    format: date-time
        LogDsarResponse:
            type: object
            properties:
                dsar:
                    allOf:
                        - $ref: '#/components/schemas/Dsar'
                    description: |-
                        Carries the computed `response_due_at`, which is the field the person who
                         logged it actually needs to know.
        ManualQuota:
            type: object
            properties:
                used:
                    type: integer
                    format: int32
                limit:
                    type: integer
                    description: |-
                        Zero means unlimited, which is what a paid plan and a self-hosted
                         deployment with billing disabled both report. A client must check for zero
                         rather than rendering "3 of 0 used".
                    format: int32
            description: A plan limit on manually-created records, and current usage against it.
        MarkDsarRespondedRequest:
            type: object
            properties:
                dsarId:
                    type: string
                reviewed:
                    type: boolean
                    description: Must be true. See MarkDsarResponded.
        MarkDsarRespondedResponse:
            type: object
            properties:
                applied:
                    type: boolean
                    description: False when the request was already answered. See MarkDsarResponded.
                dsar:
                    $ref: '#/components/schemas/Dsar'
        Member:
            type: object
            properties:
                userId:
                    type: string
                    description: |-
                        The derived uuid, not the IdP subject. This is what UpdateMemberRole and
                         RemoveMember take.
                role:
                    type: string
                    description: One of owner, member, viewer.
                displayName:
                    type: string
                    description: |-
                        Both may be empty, and a client must cope. display_name is absent when the
                         authorization server returned no name claim, and both are absent for a
                         member who has never signed in since user_identities gained a row.

                         Visible to every member of the organisation regardless of role, which is a
                         decision the product owner took explicitly on 2026-08-15 rather than a
                         default nobody examined. See 00005_co_member_identity.sql.
                email:
                    type: string
                joinedAt:
                    type: string
                    format: date-time
        Membership:
            type: object
            properties:
                orgId:
                    type: string
                orgName:
                    type: string
                role:
                    type: string
                    description: |-
                        One of owner, member, viewer. Approval authority is a regulatory-relevant
                         fact, so it earns a role boundary (§20.1).
                orgSlug:
                    type: string
                    description: |-
                        The URL segment every console route for this organisation hangs off, as in
                         `/o/{org_slug}/feed` (§20.1, ENT-198).

                         Derived from the name when the organisation is created and immutable
                         afterwards, so it does not follow a rename: slugs live in bookmarks and in
                         emailed capability-token links, which are exactly the links a compliance
                         product has to keep working. A client that wants a label shows org_name; a
                         client that wants a link uses this.
        NotificationChannel:
            type: object
            properties:
                id:
                    type: string
                    description: Stable identifier, e.g. `email`. Not a label.
                displayName:
                    type: string
                    description: What to call it in an interface.
                available:
                    type: boolean
                    description: |-
                        Whether this deployment can deliver on it right now. A channel that is
                         known but unconfigured is reported as unavailable rather than omitted, so a
                         console can say why it is not offered instead of silently lacking it.
                unavailableReason:
                    type: string
                    description: |-
                        Plain-language reason when it is not available, for the console to show.
                         Empty when it is.
        NotificationPreferences:
            type: object
            properties:
                email:
                    type: string
                    description: |-
                        Where to send email, when it should not be the address the person signs in
                         with. Empty means use the identity's own address.

                         Its own field rather than an implicit default, because the two are
                         different facts: a compliance contact is often a shared mailbox that nobody
                         signs in as.
                minSeverityForEmail:
                    type: string
                    description: |-
                        The floor for emailing about a finding. One of low, medium, high, critical.

                         A floor rather than a switch, because "tell me about everything" and "tell
                         me about nothing" are both wrong for a compliance product: the first trains
                         people to ignore it, the second is how a critical finding goes unread.
                weeklyBriefingEnabled:
                    type: boolean
                deadlineAlertsEnabled:
                    type: boolean
                timezone:
                    type: string
                    description: |-
                        IANA name, e.g. Europe/Tallinn. Decides when a briefing and a quiet window
                         fall for this person, so it is theirs rather than the organisation's: a
                         consultant and their client are not always in the same country.
                quietHoursStart:
                    type: string
                    description: |-
                        Local times, HH:MM, during which email is held rather than sent. Both empty
                         means no quiet hours.

                         Held rather than dropped. A deadline that passes overnight still has to be
                         told about in the morning, and a notification system that silently discards
                         during quiet hours is one nobody can trust with a statutory clock.
                quietHoursEnd:
                    type: string
        Obligation:
            type: object
            properties:
                slug:
                    type: string
                title:
                    type: string
                summary:
                    type: string
                    description: |-
                        100 to 2000 characters, enforced by a database constraint. Longer than the
                         article bound on purpose: this is the text a person reads to decide whether
                         a finding applies to them, so a one-line summary would push them to the
                         regulation for every finding.
                citation:
                    $ref: '#/components/schemas/Citation'
                appliesWhenJson:
                    type: string
                    description: |-
                        The profile shape this obligation applies to, as JSON. Free-form because it
                         is matching input rather than a stored schema, and the matcher is the thing
                         that has an opinion about it.
                severity:
                    type: string
                    description: '`low`, `medium` or `high`. Constrained in the database.'
                dueWithinDays:
                    type: integer
                    format: int32
                recurrence:
                    type: string
                effectiveDate:
                    type: string
                topicTags:
                    type: array
                    items:
                        type: string
                actionType:
                    type: string
                    description: |-
                        What approving a finding for this obligation creates, e.g. `create_ropa`.
                         Empty means approving records the decision and creates nothing, which is
                         the honest answer for an obligation with no register behind it.
            description: Obligation is a duty derived from the law, and the thing a finding cites.
        Paragraph:
            type: object
            properties:
                label:
                    type: string
                    description: |-
                        `1`, `2(a)`, and so on. Unique within the article, and the citation grain a
                         finding can point at.
                summary:
                    type: string
                ordering:
                    type: integer
                    format: int32
        PipelineStatus:
            type: object
            properties:
                watcherLastRunAt:
                    type: string
                    description: |-
                        Absent when the Watcher has never run for this organisation, which is the
                         same condition that makes posture `not_assessed`. Read from
                         `compliance_profiles.watcher_last_run_at`.
                    format: date-time
                profileExists:
                    type: boolean
                    description: |-
                        False when no compliance profile exists yet, i.e. onboarding is not done.
                         Distinguishes "the agents have not run" from "there is nothing for them to
                         run against", which are different problems with different fixes.
            description: |-
                Whether the agents have actually run, which is the question the console
                 currently cannot answer.

                 The agent rail (ENT-222) exists to tell a human what The Watcher and The
                 Analyst are doing. Its first honest content is this: when they last ran, and
                 whether they ever have. Everything conversational comes later; this is the
                 part that stops the console implying work that has not happened.
        ProcessingActivity:
            type: object
            properties:
                processingActivityId:
                    type: string
                name:
                    type: string
                    description: |-
                        Required in the database. Taken from the finding's `detected` text when the
                         Executor created it, which is a description of the gap rather than a name,
                         and is the first thing a human renames.
                purpose:
                    type: string
                    description: Article 30(1)(b). Empty on an Executor-created stub.
                legalBasis:
                    type: string
                    description: |-
                        Article 6. Empty on a stub, and empty is honest: the lawful basis is a legal
                         determination, not something derivable from the profile.
                dataCategories:
                    type: array
                    items:
                        type: string
                recipients:
                    type: array
                    items:
                        type: string
                retentionPeriod:
                    type: string
                    description: |-
                        Article 30(1)(f), free text because retention is stated in the customer's
                         own terms ("7 years after the contract ends") far more often than in days.
                sourceFindingId:
                    type: string
                    description: |-
                        Set when the Executor created this from an approved finding, empty when a
                         human created it directly. See the service comment on provenance.
                completeness:
                    type: string
                    description: |-
                        complete, incomplete, or review_needed.

                         `review_needed` means the Executor pre-filled this and no human has edited
                         it since, which is a different state from incomplete and needs a different
                         prompt: the entry exists because an approval said it must, and it is
                         nobody's work-in-progress until someone opens it.

                         `complete` requires every Article 30 field to be present AND the row to have
                         been updated after it was created. That second condition is what stops an
                         Executor stub with plausible defaults from ever reading as complete without
                         a human having looked.
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: |-
                One entry in the Article 30 record.

                 The nullable columns are nullable because `approve_finding` creates the row
                 from a finding that knows the activity exists and not what is in it. A record
                 created by the Executor is therefore a stub a human completes, and the fields
                 below are empty rather than invented. Article 30 is a record of fact, so a
                 plausible guess in `legal_basis` is the single worst thing this product could
                 write.
        ProcessingActivityFields:
            type: object
            properties:
                name:
                    type: string
                purpose:
                    type: string
                legalBasis:
                    type: string
                dataCategories:
                    type: array
                    items:
                        type: string
                recipients:
                    type: array
                    items:
                        type: string
                retentionPeriod:
                    type: string
            description: |-
                The fields of an Article 30 entry a human supplies.

                 Shared by create and update so the two cannot drift into accepting different
                 things about the same record.
        Recital:
            type: object
            properties:
                recitalNumber:
                    type: integer
                    format: int32
                summary:
                    type: string
        RegulationPack:
            type: object
            properties:
                packId:
                    type: string
                    description: |-
                        Names this pack for logs and for the response. Not a key: nothing is
                         stored under it, because the natural keys inside the pack are what the
                         corpus is addressed by. A pack renamed is not a new corpus.
                document:
                    $ref: '#/components/schemas/RegulatoryDocument'
                obligations:
                    type: array
                    items:
                        $ref: '#/components/schemas/Obligation'
                guidelines:
                    type: array
                    items:
                        $ref: '#/components/schemas/Guideline'
                enforcementDecisions:
                    type: array
                    items:
                        $ref: '#/components/schemas/EnforcementDecision'
            description: |-
                RegulationPack is one coherent unit of regulatory reference data.

                 Every field is optional, which is deliberate rather than lax. A pack may
                 carry only a document (the law, no obligations derived from it yet), only
                 obligations (a revised interpretation of a regulation already ingested), or
                 only guidelines. Requiring all of them would mean re-sending 200KB of
                 unchanged articles to correct one obligation's severity.
        RegulatoryDocument:
            type: object
            properties:
                celexNumber:
                    type: string
                    description: |-
                        The natural key. A CELEX number identifies an EU legal act uniquely and
                         permanently, which is why it is the key rather than a title or a slug we
                         would have to invent and then keep stable ourselves.
                title:
                    type: string
                shortTitle:
                    type: string
                versionDate:
                    type: string
                    description: ISO date, `2016-05-04`.
                officialUrl:
                    type: string
                    description: |-
                        Where the verbatim text lives. The corpus stores none, so this is what a
                         citation ultimately resolves to.
                articles:
                    type: array
                    items:
                        $ref: '#/components/schemas/Article'
                recitals:
                    type: array
                    items:
                        $ref: '#/components/schemas/Recital'
                annexes:
                    type: array
                    items:
                        $ref: '#/components/schemas/Annex'
                articleRecitals:
                    type: array
                    items:
                        $ref: '#/components/schemas/ArticleRecitalLink'
                    description: |-
                        Which recitals inform which articles. Additive across ingests: a link is
                         inserted or already exists, and nothing removes one, because the junction
                         has no natural way to tell a link somebody deleted from a link a smaller
                         pack simply did not mention.
        RejectFindingRequest:
            type: object
            properties:
                findingId:
                    type: string
                reason:
                    type: string
                    description: Optional, and worth asking for. See RejectFinding.
        RejectFindingResponse:
            type: object
            properties:
                applied:
                    type: boolean
        RemoveMemberResponse:
            type: object
            properties: {}
        RunSweepRequest:
            type: object
            properties:
                detectOnly:
                    type: boolean
                    description: |-
                        Run the Watcher only, and skip converting its signals into findings.

                         For diagnosing the producer: the Watcher deciding nothing is wrong is a
                         different failure from the Analyst failing to resolve an obligation, and
                         separating them turns one confusing empty feed into two answerable
                         questions.
        RunSweepResponse:
            type: object
            properties:
                signals:
                    type: integer
                    description: |-
                        Signals the Watcher raised. Deduplicated in the database, so a second sweep
                         over unchanged data reports zero rather than repeating itself.
                    format: int32
                findings:
                    type: integer
                    description: |-
                        Findings the Analyst created or refreshed from those signals. Zero when
                         `detect_only` was set.

                         Lower than `signals` is normal rather than an error: a signal whose
                         obligation slug resolves to nothing is skipped and logged, because a
                         finding with no obligation behind it could not cite anything.
                    format: int32
                ranAt:
                    type: string
                    description: When this sweep ran, which is what the console's "last checked" reads.
                    format: date-time
        SeverityCounts:
            type: object
            properties:
                critical:
                    type: integer
                    format: int32
                high:
                    type: integer
                    format: int32
                medium:
                    type: integer
                    format: int32
                low:
                    type: integer
                    format: int32
        SnoozeFindingRequest:
            type: object
            properties:
                findingId:
                    type: string
                days:
                    type: integer
                    description: Clamped to 1..365 by the database. Zero means the default of 7 days.
                    format: int32
        SnoozeFindingResponse:
            type: object
            properties:
                applied:
                    type: boolean
                snoozedUntil:
                    type: string
                    format: date-time
        Status:
            type: object
            properties:
                code:
                    type: integer
                    description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
                    format: int32
                message:
                    type: string
                    description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/GoogleProtobufAny'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
        SupportingChunk:
            type: object
            properties:
                ordinal:
                    type: integer
                    description: 'Reading order, starting at 1: the article first, then its sub-paragraphs.'
                    format: int32
                label:
                    type: string
                    description: |-
                        The citation label for this specific passage, which is more precise than
                         the finding's own label when the passage is a sub-paragraph.
                quotedText:
                    type: string
                    description: The regulatory text itself. Quoted from the corpus, never generated.
                sourceUrl:
                    type: string
            description: One quoted passage supporting a finding, from `finding_supporting_chunks`.
        UpdateAiSystemRequest:
            type: object
            properties:
                aiSystemId:
                    type: string
                fields:
                    $ref: '#/components/schemas/AiSystemFields'
                reviewed:
                    type: boolean
                    description: Required when this changes `risk_classification`. See UpdateAiSystem.
        UpdateAiSystemResponse:
            type: object
            properties:
                aiSystem:
                    $ref: '#/components/schemas/AiSystem'
        UpdateMemberRoleRequest:
            type: object
            properties:
                userId:
                    type: string
                role:
                    type: string
                    description: |-
                        owner, member or viewer. Rejected with InvalidArgument otherwise rather
                         than left to the database's check constraint, so the caller gets a message
                         naming the valid values.
        UpdateMemberRoleResponse:
            type: object
            properties:
                member:
                    $ref: '#/components/schemas/Member'
        UpdateNotificationPreferencesRequest:
            type: object
            properties:
                preferences:
                    $ref: '#/components/schemas/NotificationPreferences'
        UpdateNotificationPreferencesResponse:
            type: object
            properties:
                preferences:
                    allOf:
                        - $ref: '#/components/schemas/NotificationPreferences'
                    description: |-
                        Re-read rather than echoed, so the response describes what the database
                         holds rather than what was sent.
        UpdateOrganisationRequest:
            type: object
            properties:
                name:
                    type: string
        UpdateOrganisationResponse:
            type: object
            properties:
                orgId:
                    type: string
                name:
                    type: string
                slug:
                    type: string
                    description: |-
                        Returned deliberately, and unchanged by the rename. A client that assumed
                         otherwise finds out here rather than by building a broken link.
        UpdateProcessingActivityRequest:
            type: object
            properties:
                processingActivityId:
                    type: string
                fields:
                    $ref: '#/components/schemas/ProcessingActivityFields'
        UpdateProcessingActivityResponse:
            type: object
            properties:
                processingActivity:
                    $ref: '#/components/schemas/ProcessingActivity'
        User:
            type: object
            properties:
                id:
                    type: string
                    description: |-
                        The IdP subject claim. Identifies the human to the authorization server,
                         and is NOT what this system stores against their actions: see `user_id`.
                email:
                    type: string
                displayName:
                    type: string
                emailVerified:
                    type: boolean
                    description: |-
                        Gates finding approval: an unverified address must not be able to sign
                         off a regulatory decision (§1.7).
                userId:
                    type: string
                    description: |-
                        This system's own identifier for the same human, matching
                         `Member.user_id`, `created_by` and `approved_by`.

                         Added rather than replacing `id`, which keeps the change additive: an
                         existing client reading `id` is unaffected, and `buf breaking` stays quiet.
            description: |-
                TWO IDENTIFIERS, AND WHY THEY ARE NOT ONE (ENT-220)

                 This message carries the same human twice, deliberately, and the next reader
                 should not simplify them into one field.

                 `id` is the identifier the authorization server uses: a Zitadel snowflake
                 like `386250729179840515`, or `auth0|abc123`. Its shape is the IdP's to
                 choose and it changes if the deployment changes IdP.

                 `user_id` is this system's own key for that person, a version 5 uuid derived
                 from (issuer, subject) by `libs/chassis/subject`. It is what `memberships`,
                 `created_by` and `approved_by` actually store, and it is what `Member.user_id`
                 returns.

                 The derivation is one-way on purpose, so a client holding `id` cannot compute
                 `user_id`, and `user_identities` is the only way back. Before this field
                 existed a console could list an organisation's members and not work out which
                 row was the person reading the page, which is why an owner could not leave an
                 organisation the API was perfectly willing to let them leave.
tags:
    - name: AuditService
      description: |-
        The audit log: what was decided, by whom, and when (§7.2, §24; ENT-223).

         THIS SURFACE READS `audit_log` AND NOTHING ELSE

         Not traces, not model calls, not anything an observability tool holds. That
         firewall is the product rather than an implementation detail: an auditor is
         buying a record that a regulator can be shown, and a record assembled partly
         from a vendor's telemetry is one whose completeness depends on that vendor's
         retention settings. `audit_log` is append-only by trigger, lives in the
         customer's own database, and is written in the same transaction as the act it
         describes. A trace is none of those things.

         A console rendering this should say so in its own words. "Traces are not the
         audit log" is a sentence an auditor needs to read, not infer.

         EVERY ROW IS A THING THAT HAPPENED

         There is no failure dimension here, and that is a real difference from the
         infrastructure log views this surface is modelled on. A refused act writes
         nothing: the gates are constraints and policies, and a refusal aborts the
         transaction the audit row would have been written in. So there is no `level`
         and no status filter, because there is no such thing as a failed row.

         READ ONLY, AND STRUCTURALLY SO

         There is no write RPC on this service and there will not be one. The table
         carries an append-only trigger, `kindlast_app` holds no update or delete
         grant on it, and the only insert path is the one bound to the acting human by
         policy. A record a customer can edit is not an audit log.
    - name: BillingService
      description: |-
        Billing, per organisation (core-api-surface §9, §18.1; ENT-210).

         BILLING KEYS ON THE ORGANISATION, NEVER ON A PERSON

         `subscriptions.user_id` was dropped in ENT-192 and replaced by a unique
         `org_id`, so nothing in the schema can key billing to an individual any more.
         That is the point rather than a detail: a company pays, people come and go,
         and an owner leaving must not take the subscription with them.

         AND IT IS OPTIONAL

         A deployment with no payment provider configured runs on a single plan and
         renders no upgrade path at all. A self-hoster has no Stripe account and must
         not need one; the design's posture is that they are a first-class user rather
         than a degraded one. So this service answers "billing is not configured here"
         as a first-class response rather than erroring, and a console that reads it
         shows a settings page with no checkout rather than a broken one.
    - name: DashboardService
      description: The dashboard's posture and the pipeline's honesty (§5).
    - name: FindingsService
      description: |-
        Findings, the feed, and the dashboard (core-api-surface §3 and §5).

         THE ORGANISATION IS NEVER IN THE PATH

         Same rule as OrgService and for the same reasons: every method here acts on
         the organisation named by the `Kindlast-Org-Id` header, resolved once per
         request before any handler runs. `{finding_id}` in a path names the thing
         being acted on, not the tenant, and is meaningless without the header.

         READ AND ACT ARE DIFFERENT SCOPES, DELIBERATELY

         `findings:read` and `findings:act` are separate because they are separately
         dangerous. Reading the feed discloses a customer's compliance gaps; acting on
         it changes the compliance record and writes an audit row attributed to a
         human. A token that can render the console is not thereby a token that can
         approve on someone's behalf, and an integration that only needs to display
         findings should not be one credential leak away from approving them.

         CITATIONS ARE CARRIED, NEVER ASSEMBLED BY A CLIENT

         This is the contract's most important property and the reason for the shape
         of `Citation` below. Kindlast's value is that a human can check a claim
         against the law, so a fabricated citation is worse than no finding at all.

         Every citation field here is a value the database already stored, assembled
         by `analyst_citation_label` and `analyst_citation_url` at the time the
         finding was created. There is no field a client is expected to combine, and
         no field from which a client could derive a different citation than the one
         the Analyst recorded. A renderer that wants "GDPR Art. 30(1)(b)" reads
         `label`; it must not build that string from `celex` and `article`, because a
         second assembler is a second thing that can be wrong, and the one that is
         wrong will be the one nobody tested.
    - name: IngestService
      description: |-
        Writing the corpus: the law itself, and the obligations derived from it
         (§20.3, §10, §16.5; ENT-207).

         # WHY THIS IS ON THE PLATFORM SURFACE AND NOT THE CORE ONE

         Nothing here may ever be reachable by a person's token. These RPCs declare
         `internal:ingest`, which the seed issues to service clients through client
         credentials and never to the browser client, and the package separation makes
         "is this reachable by a human" a question answered by the import path. See
         sweep.proto's header for why the package is `platform` when the route says
         `/internal/v1`.

         The reason is not that ingest is dangerous to a tenant. It is that the
         product's whole claim is that a customer can check a finding against the law,
         and that claim is worth exactly nothing if a request from the console could
         change the law it is checked against.

         # IT TAKES A PACK, NOT A REGULATION IT KNOWS THE NAME OF

         Nothing in this file mentions GDPR or the AI Act. A pack is a document with
         its articles, recitals and annexes, plus obligations, guidelines and
         enforcement decisions, and the two regulations shipped today are two calls
         with the same shape. §26 and ENT-233 build on this: a regulation pack is
         corpus plus obligations plus skills plus evals plus record types, and the
         pack boundary is not drawn here. What is settled here is the narrower thing,
         that a third regulation is a third call rather than a code change.

         # THE CORPUS STORES NO VERBATIM TEXT

         Every article, recital, annex and paragraph carries a curated summary, not
         the Official Journal wording. That predates this issue (it is why the schema
         has a 1..2000 character bound on every summary column rather than a text
         blob), and it survives for the same two reasons: the OJ text has its own
         licensing and its own canonical location, and a summary is what a model
         scans to decide which natural key to cite. Verbatim text is fetched from the
         document's `official_url` at the point somebody wants to read it, so the
         citation always resolves to the publisher rather than to our copy.

         # AND THE WRITE RUNS ON A ROLE THAT CAN REACH NOTHING ELSE

         `kindlast_ingest` (00018): NOSUPERUSER, NOBYPASSRLS, owns nothing, grants on
         the ten regulatory tables and no others, insert and update but never delete.
         Not the migrator, which 00002's comment named and which bypasses RLS
         entirely.
    - name: NotificationService
      description: |-
        Notification preferences and the channels a deployment actually has
         (core-api-surface §6, §17, §18.3, §18.5; ENT-209).

         PREFERENCES ARE PERSONAL WITHIN AN ORGANISATION, NOT PER PERSON

         `notification_preferences` is keyed `(org_id, user_id)`, and the policies on
         it are the only ones in the schema that pin `user_id` to
         `app.current_user_id`. So a consultant serving three clients can want a
         weekly briefing from one and silence from another, and no member can read or
         change a colleague's settings even though they share an organisation.

         That is why these RPCs take no user id. The caller is the subject, always,
         and offering a parameter would invite a client to pass somebody else's and a
         handler to be the thing that refuses. Authority stays in the policy.

         WHAT IS DELIBERATELY ABSENT

         No RPC to send a notification, and none to read the outbox. Dispatch is a
         background duty of the agent role, not something a client asks for: a caller
         that could trigger delivery could use this service to mail an arbitrary
         address on a timer. The outbox is not readable here either, because a queue
         of pending messages is operational detail rather than a customer surface.
    - name: OrgService
      description: |-
        Organisations and membership (core-api-surface §20.1).

         THE ORGANISATION IS NEVER IN THE PATH.

         Every method below acts on the organisation named by the `Kindlast-Org-Id`
         request header, which the interceptor resolves and verifies once per request
         before any handler runs. No RPC takes an org_id, and the REST aliases carry
         no `{org_id}` segment.

         This is worth stating loudly because conventional REST would write
         `/organisations/{org_id}/members/{user_id}` and it would be wrong here. The
         header exists so that membership has exactly one source of truth and so a
         consultant can switch active organisation without re-minting a token
         (interceptor/tenancy.go). A path parameter would give the same fact a second
         source, and a caller sending one organisation in the header and another in
         the path would have to be either an error nobody remembered to write or a
         silent winner. Neither is a good answer to a question that should not exist.

         The pattern is precedented rather than eccentric: Stripe scopes with the
         `Stripe-Account` header, and Slack with workspace-scoped tokens.

         `{user_id}` in a path is a different matter and is fine. It names the person
         being acted on, not the tenant, and it is meaningless without the header.

         TWO CALLS DELIBERATELY CARRY NO ORGANISATION

         CreateOrganisation and AcceptInvitation. In both the caller is establishing
         membership rather than exercising it, so there is no active organisation to
         name. Per §1.8 the header is OMITTED on these, not sent empty: an empty
         value is a client bug that should be refused, while its absence is a
         statement.

         THERE IS NO ListMyOrganisations, ON PURPOSE

         GetCurrentUser already returns every membership with its org id, name, slug
         and role, and it is the call the console bootstraps on. A second endpoint
         answering the same question would be a second thing to keep correct, and the
         two would drift the first time one grew a field. Revisit if a single user
         ever belongs to enough organisations to need pagination, which the sizing in
         §19.1 puts a long way off.
    - name: RecordsService
      description: |-
        The compliance record: what the organisation actually holds (§4).

         THE ORGANISATION IS NEVER IN THE PATH

         Same rule as FindingsService and OrgService. Every method acts on the
         organisation named by the `Kindlast-Org-Id` header, resolved once per request
         before any handler runs. A `{..._id}` in a path names the record being read,
         not the tenant, and is meaningless without the header.

         WHY THIS SURFACE EXISTS NOW, AND WHY IT IS READ-ONLY

         Approving a finding already creates a record. `approve_finding` dispatches on
         `findings.action_type` and writes a `processing_activities` or `ai_systems`
         row, with an audit row naming the human who approved it (00006, 00007, 00009).
         That is not a plan: it was exercised through the console before this contract
         was written, and both record types were observed being created by a founder
         clicking Approve.

         So the gap this closes is not "records would be nice". The act path writes
         into a space the customer cannot look at, which for a compliance product is
         the wrong half to have working. Reads come first for that reason, and because
         they are the half an auditor needs.

         Editing arrived after the read surface, in that order deliberately: the act
         path was already writing records nobody could see, so reading was the half
         that was missing. The write RPCs are additive and changed no read shape.

         EVERY WRITE GOES THROUGH A DATABASE FUNCTION, NEVER A TABLE

         The six functions in 00002 own these writes. Each one resolves the acting
         human from the session GUC, enforces its own gate, and writes the audit row in
         the same transaction as the change. A handler that wrote the table directly
         would have to reimplement all three, and the audit row would be a second
         statement that can fail on its own.

         So there is no actor field on any request here, and there will not be one. A
         caller cannot name someone else as the person who made a change.

         ONE SERVICE, THREE RECORD TYPES

         They share `records:read` because they are one answer to one question: what is
         on file for this organisation. Splitting them into three services would imply
         a customer might hold the ROPA without the AI systems register, which is not a
         distinction the product draws and not one the scope vocabulary encodes.

         The write scopes ARE per type, which is the asymmetry that matters: reading
         the record is one entitlement, and changing a specific part of it is three.
         Per-method scopes on one service express that exactly, the way FindingsService
         already mixes `findings:read` and `findings:act`. Matching is exact and never
         by prefix, so `records:read` does not satisfy `records:ropa:write`.

         PROVENANCE IS A FIELD, NOT A JOIN

         Every record carries `source_finding_id`, set when the Executor created it and
         empty when a human did. "Why is this here" is the first question an auditor
         asks of a compliance record, and one that cannot answer it is one somebody has
         to defend from memory.

         COMPLETENESS IS COMPUTED HERE, NOT IN EACH CLIENT

         `ProcessingActivity.completeness` and `Dsar.urgency` are derived server-side
         and carried, rather than left for a renderer to work out. The legacy console
         derived both in TypeScript, which was fine while there was one client; the
         Article 12(3) escalation window in particular is a regulatory threshold, and a
         second implementation of it is a second thing that can drift from the law.
    - name: SessionService
      description: |-
        The console bootstrap call, and the first authenticated endpoint in the
         system (core-api-surface §1.5, §20.1).

         Only GetCurrentUser is defined here. The rest of the public surface arrives
         with the issues that implement it; defining it early would mean a contract
         nobody has verified against a handler.
    - name: SweepService
      description: |-
        The platform surface: things the platform calls, never a browser.

         WHY THIS IS `platform` AND THE ROUTE IS `/internal/v1`

         The design calls this surface "internal" and the HTTP path below keeps that
         name, because that is what it is and what an operator will look for. The
         proto package cannot: Go gives any path segment called `internal` a
         visibility rule, so generated code under `gen/go/kindlast/internal/v1` is
         importable only from within `gen/go/kindlast/...` and nothing in core-api can
         use it. That is a toolchain constraint rather than a design one, so the
         design's name stays on the route and the package takes another.

         A separate package from `kindlast.core.v1` either way, and the separation is
         the point rather than filing. Everything in `core.v1` is reachable by a
         human's token through `web`. Nothing here is, or should ever become so:
         these RPCs declare `internal:*` scopes, which the seed issues to service
         clients through client credentials and never to the browser client. Keeping
         them apart makes "is this reachable by a person" a question answered by the
         import path.

         WHY A SWEEP HAS TO BE TRIGGERED AT ALL

         Nothing runs the Watcher or the Analyst on a schedule. 00001 dropped the
         three pg_cron jobs when the schema moved off Supabase, and the schedules
         return with Temporal at build-order step 8. Between those two points a
         perfectly correct feed shows an empty state forever, because nothing has ever
         looked.

         This is the seam that fills the gap: something outside can ask for a sweep
         now. When Temporal lands it becomes the thing Temporal calls rather than
         being replaced, so the schedule arrives as a caller rather than a rewrite.
