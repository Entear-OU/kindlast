---
# =============================================================================
# AI Provider Keys - kindlast-app namespace
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-provider-keys
  namespace: kindlast-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ai-provider-keys
    creationPolicy: Owner
  data:
    - secretKey: anthropic-api-key
      remoteRef:
        key: kindlast/ai-providers
        property: anthropic-api-key
    - secretKey: openai-api-key
      remoteRef:
        key: kindlast/ai-providers
        property: openai-api-key
    - secretKey: cohere-api-key
      remoteRef:
        key: kindlast/ai-providers
        property: cohere-api-key
    - secretKey: firecrawl-api-key
      remoteRef:
        key: kindlast/ai-providers
        property: firecrawl-api-key

