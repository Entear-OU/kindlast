---
# ClusterSecretStore for HashiCorp Vault
# This provides cluster-wide access to Vault secrets for all namespaces
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "kindlast"
          serviceAccountRef:
            name: "kindlast-vault-auth"
            namespace: "kindlast-app"
