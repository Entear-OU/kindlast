apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: kindlast-app
  labels:
    app: rag-service
    app.kubernetes.io/name: rag-service
    app.kubernetes.io/component: rag
    app.kubernetes.io/part-of: kindlast
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-service
  template:
    metadata:
      labels:
        app: rag-service
        app.kubernetes.io/name: rag-service
        app.kubernetes.io/component: rag
        app.kubernetes.io/part-of: kindlast
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: rag-service
        image: kindlast/rag:latest
        ports:
        - containerPort: 8081
          name: http
          protocol: TCP
        env:
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-provider-keys
              key: anthropic-api-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-provider-keys
              key: openai-api-key
        - name: COHERE_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-provider-keys
              key: cohere-api-key
        - name: QDRANT_HOST
          valueFrom:
            secretKeyRef:
              name: qdrant-credentials
              key: host
        - name: QDRANT_PORT
          valueFrom:
            secretKeyRef:
              name: qdrant-credentials
              key: port
        - name: QDRANT_API_KEY
          valueFrom:
            secretKeyRef:
              name: qdrant-credentials
              key: api-key
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: host
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: port
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: password
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: kindlast-app
  labels:
    app: rag-service
    app.kubernetes.io/name: rag-service
    app.kubernetes.io/component: rag
    app.kubernetes.io/part-of: kindlast
spec:
  selector:
    app: rag-service
  ports:
  - port: 8081
    targetPort: 8081
    name: http
    protocol: TCP
  type: ClusterIP
