# Ingress controller manifest for external traffic routing
# Routes traffic to frontend and API gateway services
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kindlast-ingress
  namespace: kindlast-app
  labels:
    app.kubernetes.io/name: kindlast-ingress
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: kindlast
  annotations:
    # nginx ingress controller annotations
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Proxy settings for API requests
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    # CORS configuration (adjust origins for production)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    # Rate limiting for API endpoints
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
spec:
  ingressClassName: nginx
  # TLS configuration placeholder - uncomment and configure for production
  # tls:
  # - hosts:
  #   - kindlast.example.com
  #   - api.kindlast.example.com
  #   secretName: kindlast-tls-secret
  rules:
  # Primary domain routing
  - host: kindlast.example.com
    http:
      paths:
      # API routes - route to API gateway
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: api-gateway
            port:
              number: 8080
      # All other routes - route to frontend
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
---
# TLS certificate Secret placeholder
# In production, use cert-manager or external secrets for certificate management
