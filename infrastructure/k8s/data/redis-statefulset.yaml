apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: kindlast-data
data:
  master.conf: |
    maxmemory 512mb
    maxmemory-policy allkeys-lru
    save 60 1000
    appendonly yes
    appendfsync everysec
  replica.conf: |
    maxmemory 512mb
    maxmemory-policy allkeys-lru
    save 60 1000
    appendonly yes
    appendfsync everysec
    replicaof redis-0.redis-headless.kindlast-data.svc.cluster.local 6379
  sentinel.conf: |
    sentinel monitor mymaster redis-0.redis-headless.kindlast-data.svc.cluster.local 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel failover-timeout mymaster 60000
    sentinel parallel-syncs mymaster 1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: kindlast-data
spec:
  serviceName: redis-headless
  replicas: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      initContainers:
      - name: config
        image: redis:7-alpine
        command: ["sh", "-c"]
        args:
        - |
          # configure master vs replica based on pod ordinal
          if [ "$(hostname)" = "redis-0" ]; then
            cp /config/master.conf /data/redis.conf
          else
            cp /config/replica.conf /data/redis.conf
          fi
          # Add password configuration
          echo "requirepass ${REDIS_PASSWORD}" >> /data/redis.conf
          echo "masterauth ${REDIS_PASSWORD}" >> /data/redis.conf

          # Configure sentinel
          cp /config/sentinel.conf /data/sentinel.conf
          echo "sentinel auth-pass mymaster ${REDIS_PASSWORD}" >> /data/sentinel.conf
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: password
        volumeMounts:
        - name: redis-config
          mountPath: /config
        - name: redis-data
          mountPath: /data
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "/data/redis.conf"]
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: password
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a $REDIS_PASSWORD ping
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a $REDIS_PASSWORD ping
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: redis-data
          mountPath: /data
      - name: sentinel
        image: redis:7-alpine
        command: ["redis-sentinel", "/data/sentinel.conf"]
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: password
        ports:
        - containerPort: 26379
          name: sentinel
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -p 26379 ping
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-config
        configMap:
          name: redis-config
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: kindlast-data
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  - port: 26379
    targetPort: 26379
    name: sentinel
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: kindlast-data
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
  - port: 6379
    name: redis
  - port: 26379
    name: sentinel
