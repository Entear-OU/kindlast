apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingestion-reconcile
  namespace: kindlast-ingestion
spec:
  schedule: "0 3 * * 0"       # Sunday 3am UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 7200
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: ingestion
            image: kindlast/ingestion:latest
            env:
            - name: MODE
              value: full
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-provider-keys
                  key: openai-api-key
            - name: COHERE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-provider-keys
                  key: cohere-api-key
            - name: FIRECRAWL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-provider-keys
                  key: firecrawl-api-key
            - name: QDRANT_HOST
              value: qdrant.kindlast-data.svc.cluster.local
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: dsn
            resources:
              requests:
                memory: "1Gi"
                cpu: "500m"
              limits:
                memory: "2Gi"
                cpu: "1000m"
