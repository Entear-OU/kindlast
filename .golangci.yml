# golangci-lint for the Go workspace (ENT-214).
#
# One config at the repository root rather than one per module. The three
# modules are separate so their dependency sets are separate (go.work explains
# why), but there is no reason for them to disagree about what good Go looks
# like, and three copies of this file would drift within a month.
#
# The selection below is deliberately short. A linter that fires often and is
# right rarely gets suppressed with a nolint comment, and once a codebase has
# learned that reflex the useful findings get suppressed too. Everything here
# earns its place by catching a bug rather than an opinion.
version: "2"

run:
  # Build tags are not used in this repository yet. When integration tests grow
  # one, add it here or the linter silently stops reading those files.
  timeout: 5m

linters:
  # errcheck, govet, ineffassign, staticcheck and unused. The unglamorous set
  # that finds real defects, and the one nobody argues about.
  default: standard

  enable:
    # A response body that is never closed leaks a connection, and the leak
    # shows up as an unrelated timeout hours later. core-api fetches JWKS over
    # HTTP on a refresh path, which is exactly where this goes unnoticed.
    - bodyclose

    # Errors compared with == or type-asserted directly rather than through
    # errors.Is and errors.As. The store already unwraps a *pgconn.PgError to
    # read a constraint name, and that pattern breaks silently the first time
    # a wrapped error is introduced above it.
    - errorlint

    # HTTP requests built without a context. A request with no context cannot
    # be cancelled, so a slow dependency holds a request handler open for as
    # long as the network allows.
    - noctx

    # Returning nil after checking that an error is non-nil. Almost always a
    # mistake, and one that reads as correct.
    - nilerr

    # Rows.Err left unchecked, and sql.Rows or sql.Stmt left unclosed. The
    # database is the part of this system where a leak becomes an outage.
    - rowserrcheck
    - sqlclosecheck

    # Conversions that convert a type to itself: usually the residue of a type
    # that changed underneath the call.
    - unconvert

    # os.Setenv and friends inside a test, where t.Setenv restores the value
    # afterwards. The failure mode is a test that passes alone and fails in a
    # suite, which costs an afternoon to attribute.
    - usetesting

    # Spelling, in comments as well as identifiers. Cheap, and this repository
    # treats comments as the durable part.
    - misspell

  settings:
    errorlint:
      # The `%w` check is off, and the pattern it objects to is deliberate.
      # `fmt.Errorf("%w: %v", ErrTokenExpired, err)` wraps the sentinel a
      # caller matches on and prints the library's error as detail. Promoting
      # that detail to a second `%w` would put a third-party error type into
      # this package's public contract, where an upgrade could change what
      # `errors.Is` answers. The valuable half of errorlint, `==` comparisons
      # and direct type assertions on errors, stays on.
      errorf: false

    misspell:
      # British spelling, matching the product copy and the schema
      # (organisation, not organization). UK locale here would flag the
      # American spellings that appear in vendored strings instead, so the
      # locale stays default and only the words we care about are listed.
      ignore-rules:
        - organisation
        - organisations
        - authorisation

  exclusions:
    # Generated protobuf code is not ours to lint. It is regenerated by
    # `buf generate` and CI fails on drift, so a finding here could not be
    # fixed even in principle: the fix would be reverted by the next
    # regeneration.
    generated: strict

    rules:
      # Test files may ignore errors on setup calls where the assertion is the
      # test itself. errcheck on a deliberate best-effort cleanup produces
      # noise that teaches people to add nolint comments.
      - path: _test\.go
        linters:
          - errcheck

# gofmt and goimports moved out of `linters` in golangci-lint v2. This is the
# Go half of what Prettier does for TypeScript: one canonical layout, checked
# by CI, so formatting stops being a review topic.
formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      # Intra-repo imports group together and after third-party ones, which
      # makes a boundary violation visible in the import block rather than
      # only in the CI log.
      local-prefixes:
        - github.com/Entear-OU/kindlast

  exclusions:
    generated: strict
