version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.8.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333'" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kindlast
      POSTGRES_USER: kindlast
      POSTGRES_PASSWORD: localdev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/k8s/data/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kindlast" ]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/gateway.Dockerfile
    ports:
      - "8080:8080"
    env_file: .env.local
    environment:
      POSTGRES_DSN: postgres://kindlast:localdev@postgres:5432/kindlast?sslmode=disable
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rag:
    build:
      context: .
      dockerfile: infrastructure/docker/rag.Dockerfile
    ports:
      - "8081:8081"
    env_file: .env.local
    environment:
      QDRANT_HOST: qdrant:6333
      REDIS_URL: redis://redis:6379
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

  ingestion:
    build:
      context: .
      dockerfile: infrastructure/docker/ingestion.Dockerfile
    env_file: .env.local
    environment:
      QDRANT_HOST: qdrant:6333
      POSTGRES_DSN: postgres://kindlast:localdev@postgres:5432/kindlast?sslmode=disable
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    profiles: [ "ingestion" ] # only start when explicitly requested

  processor-ingestion:
    build:
      context: .
      dockerfile: infrastructure/docker/ingestion.Dockerfile
    env_file: .env.local
    environment:
      MODE: processors
      QDRANT_HOST: qdrant:6333
      POSTGRES_DSN: postgres://kindlast:localdev@postgres:5432/kindlast?sslmode=disable
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    profiles: [ "processors" ] # only start when explicitly requested

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Public URL for client-side requests (from browser)
      NEXT_PUBLIC_API_URL: http://localhost:8080
      # Internal URL for server-side requests (within Docker network)
      API_URL_INTERNAL: http://gateway:8080
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  qdrant_data:
  postgres_data:
