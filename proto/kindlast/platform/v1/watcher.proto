syntax = "proto3";

package kindlast.platform.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "kindlast/options/v1/scope.proto";

// What an agentic Watcher reads, and the one thing it may write (ENT-258,
// ENT-274).
//
// # WHY THIS EXISTS AT ALL
//
// The Watcher today is three plpgsql detectors over the compliance profile and
// the DSAR table (00002, 00023). It cannot see anything a customer has
// connected, and it decides nothing: it applies fixed rules. The agent version
// decides what to look at, which means it needs two things this surface did
// not have: a way to learn what an organisation has connected and is believed
// to be, and a way to say "look at this" that is not a way to say "this is a
// finding".
//
// # INPUTS ARE FETCHED BY THE CALLER, WHICH IS §26.2 AND IS LOAD BEARING
//
// WatcherContext returns everything one run reasons over, assembled by
// core-api in one read. The agent does not go looking: it holds no database
// handle, no tenancy GUC, and no way to decide which organisation's facts it
// is entitled to. That is the same rule DraftNarrative follows for
// obligations, and it is what keeps a run a pure function of its inputs and
// therefore replayable as a Temporal activity.
//
// It is also why this is not "let the machine call ListIntegrations": that RPC
// is `integrations:read`, a human scope on the console surface, and issuing
// human scopes to service principals is the separation ENT-207 built being
// undone for convenience.
//
// # THE WATCHER WRITES SIGNALS AND NOTHING ELSE
//
// RaiseSignal writes a `watcher_findings` row, which is a claim that something
// is worth looking at. It is NOT a finding: the Analyst still turns a signal
// into a finding under the citation validator, and a human still decides. That
// separation is the product's central claim, so the surface enforces it by not
// having the other RPC: there is no way to write a finding here, on purpose,
// and a Watcher that wanted to would have to be given a different service.
//
// ENT-274 added a second READ, not a second write. `ReadEvidence` lets a run
// look at what an organisation's connected systems have already reported,
// which is the difference between a Watcher deciding from what a customer said
// during onboarding and one deciding from what their systems actually do. It
// reaches no customer system: see the RPC for why a live fetch is somebody
// else's change.
service WatcherService {
  // Everything one Watcher run reasons over, for one organisation.
  //
  // No `Kindlast-Org-Id` header: the organisation is in the message, like
  // every other RPC on this surface, and it is believed because
  // `internal:ingest` never reaches a browser.
  rpc WatcherContext(WatcherContextRequest) returns (WatcherContextResponse) {
    option (kindlast.options.v1.required_scope) = "internal:ingest";
    option (google.api.http) = {
      post: "/internal/v1/watcher:context"
      body: "*"
    };
  }

  // Raises one signal: something worth looking at, with what was seen and why
  // it might matter.
  //
  // Idempotent on `(profile, dedup_key)` while a signal is open, which is the
  // same key the deterministic detectors use and the same reason: a sweep that
  // runs every day must not produce a new row every day for a condition that
  // has not changed. A dismissed signal frees its key, so the next run raises
  // it afresh, which is deliberate: somebody dismissing a signal is saying
  // "not now", not "never tell me again".
  rpc RaiseSignal(RaiseSignalRequest) returns (RaiseSignalResponse) {
    option (kindlast.options.v1.required_scope) = "internal:ingest";
    option (google.api.http) = {
      post: "/internal/v1/signals"
      body: "*"
    };
  }

  // What one connection has already reported, so the Watcher can look at it
  // rather than only at the fact that it exists (ENT-274).
  //
  // # WHY A READ AND NOT A FETCH
  //
  // The obvious shape is "call the customer's tool now, through the gateway".
  // It is not this, and the reason is a grant rather than an appetite.
  //
  // Dialling a customer's system needs their credential opened, and the
  // producer role this whole service runs on is granted a COLUMN-LIMITED
  // select on `integrations` that deliberately omits `credential_ciphertext`
  // (00025). That omission is argued in the migration and it is right: the
  // role that runs model output should not be able to reach the one value
  // whose loss is a breach notification. Widening it to give an agent a live
  // fetch is a security decision that deserves its own review rather than a
  // line inside a feature.
  //
  // The shape of a sweep says the same thing from the other end. The watch
  // activity has a twenty minute timeout and retries up to three times, and
  // nobody is sitting in front of it. A synchronous call to a customer's slow
  // endpoint inside that loop would hold a sweep slot on somebody else's
  // latency and could dial their system three times for one sweep.
  // `IntegrationsService.FetchNow` exists for the case where a person asked
  // and is waiting, which is exactly the case this is not.
  //
  // So a fetch deposits, and a watch reads what was deposited. Both halves
  // already write the same two rows through the same door.
  //
  // # WHAT IT ENFORCES, WHICH IS NOT WHAT THE CALLER ENFORCES
  //
  // The harness checks the connection against the context the run was SHOWN,
  // which catches a model naming something it was never offered. This checks
  // the connection belongs to the organisation and the tool is GRANTED on it,
  // which is the invariant: no run reads through a tool the customer has not
  // granted, whatever the caller believes. They refuse different things and
  // both are wanted, the same way a citation is checked twice.
  //
  // Refusing an ungranted tool matters more than it looks. A grant is the
  // customer's statement of what Kindlast may look at, and a stored row is
  // still something they may withdraw permission to reason over. The console
  // showing them the row is a person reading their own data; an agent reading
  // it is the thing they granted or did not.
  rpc ReadEvidence(ReadEvidenceRequest) returns (ReadEvidenceResponse) {
    option (kindlast.options.v1.required_scope) = "internal:ingest";
    option (google.api.http) = {
      post: "/internal/v1/watcher:evidence"
      body: "*"
    };
  }
}

message WatcherContextRequest {
  string org_id = 1;
}

message WatcherContextResponse {
  // False when the organisation has no compliance profile, which is every
  // organisation that has not finished onboarding. There is nothing to watch
  // and no profile to hang a signal on, so a run stops here rather than
  // reasoning about an empty context.
  bool has_profile = 1;
  // What the organisation is currently believed to be (ENT-228): the open
  // facts, newest values only. History is a different question and this is
  // not the surface for it.
  repeated ProfileFact facts = 2;
  // What it has connected, and what Kindlast may do there. Revoked
  // connections are included and marked, because "we used to be able to read
  // this" is part of deciding what has changed since the last look.
  repeated WatchedConnection connections = 3;
  // The signals already open for this organisation. The agent is told what it
  // has already said so that a run can decide something has changed rather
  // than repeating itself, and so a reviewer can see it was told.
  repeated OpenSignal open_signals = 4;
  // When the deterministic sweep last ran for this organisation, or unset if
  // it never has.
  google.protobuf.Timestamp last_swept_at = 5;

  // The obligations this organisation may be cited against, and the ONLY ones
  // a signal from this context may cite (ENT-258, PR 2).
  //
  // # OFFERED, NOT LOOKED UP, FOR THE REASON THE ANALYST'S ARE
  //
  // `intelligence.proto` argues it at length and it holds identically here: a
  // citation is checked against what the run was SHOWN rather than against the
  // corpus, because a slug that genuinely exists and was never offered is
  // still a fabrication. The model produced it from somewhere other than its
  // context, which is exactly the failure the check exists to catch, and
  // asking the corpus "does this exist" would wave it through.
  //
  // # AND EVALUATED ONCE, BY THE EVALUATOR THAT ALREADY EXISTS
  //
  // Which obligations apply is `watcher_obligation_applies` over the
  // organisation's profile: the same function the deterministic detectors
  // use. Offering the agent a differently computed set would put two
  // evaluators of one question in one product, which is the arrangement
  // ENT-246 was filed about.
  repeated CitableObligation obligations = 6;

  // Which model would serve a run over this context, and whether there is one
  // (ENT-258, PR 2).
  //
  // # THE LOAD STEP RESOLVES IT, FOR THE REASON THE NARRATE PATH DOES
  //
  // `NextFindingToNarrate` returns a draft request with the endpoint already
  // resolved, because deciding which model serves an organisation means
  // reading that organisation's own rows and opening a sealed credential, and
  // core-api is the only process that may do either. The same is true here, so
  // the same shape: the context a run is given includes what will serve it.
  //
  // Names only. Where the call goes and what authenticates it stay core-api's,
  // and every completion is asked for through CompletionService.
  //
  // `intelligence_available` is false for a deployment that runs no
  // Intelligence at all, which is a supported configuration: nothing is
  // attempted and nothing is wrong. A deployment that runs it and whose
  // organisation has chosen a provider that cannot be honoured is a different
  // case and is `failed_precondition`, because that one somebody has to fix.
  bool intelligence_available = 7;
  // The provider and model that would serve a run, by name.
  //
  // TWO SCALARS RATHER THAN THE `ModelEndpoint` MESSAGE, and the reason is
  // structural rather than stylistic. That message lives in
  // `intelligence.proto`, which imports THIS file for `WatcherContextResponse`,
  // so naming it here would be an import cycle protobuf will not compile.
  //
  // Moving it to a shared file was tried and rejected: `buf breaking` is right
  // that a message leaving a file changes the generated Python import path for
  // anybody consuming this contract, and `docs/versioning.md` makes the proto
  // surface public. A three-field message is not worth breaking it for.
  //
  // Nothing is lost. `ModelEndpoint`'s only live fields are these two; its
  // `base_url` and `api_key` were deprecated when completions moved behind
  // CompletionService, and a request setting either is refused. The caller
  // builds the message from these when it hands a run over.
  string model_provider = 8;
  string model_name = 9;
}

message ProfileFact {
  string key = 1;
  // The value as stored, JSON-encoded. A fact is `{"value": ...}` shaped
  // rather than a string, because "four employees" and "unsure" are different
  // kinds of answer and flattening them here would lose that.
  string value_json = 2;
  // `onboarding`, `correction` or `observation`: where the belief came from.
  // An agent reasoning about a fact should be able to tell what a human said
  // from what a machine saw.
  string source = 3;
  google.protobuf.Timestamp valid_from = 4;
}

message WatchedConnection {
  string connection_id = 1;
  string kind = 2;
  string display_name = 3;
  string status = 4;
  bool revoked = 5;
  // The tools this connection offers, and whether this organisation has
  // granted each. A tool that is not granted is listed and not callable: the
  // agent should be able to say "I could see more if you connected X" without
  // being able to reach it.
  repeated ConnectionTool tools = 6;
}

message ConnectionTool {
  string name = 1;
  string description = 2;
  bool write_capable = 3;
  bool granted = 4;
}

message OpenSignal {
  string signal_id = 1;
  string kind = 2;
  string dedup_key = 3;
  string title = 4;
  string severity = 5;
  google.protobuf.Timestamp updated_at = 6;

  // `detector` or `agent`, matching `watcher_findings.source` (00039).
  //
  // # WHY THE AGENT IS TOLD WHOSE SIGNAL IT IS LOOKING AT (ENT-276)
  //
  // Every open signal is shown with its deduplication key, because a run that
  // is not told what is already open repeats it. Keys are also what the
  // schema deduplicates on, so a key is an address: writing one lands on
  // whatever row already has it.
  //
  // ENT-273 made that safe. A trigger refuses an update that changes a
  // signal's source, so a model echoing a detector's key back can no longer
  // overwrite a rule's row. What it can still do is TRY, and be refused, and
  // end the whole run: the customer gets nothing from that sweep, for a
  // reason they cannot act on.
  //
  // The model is not being unreasonable there. It is shown a list of
  // addresses with no indication that some are not its to write. This is that
  // indication.
  //
  // It is not the authority and must not become it. The trigger is the
  // authority and is unchanged; this makes the refusal predictable rather
  // than moving the check into a prompt, which AGENTS.md is explicit is the
  // one thing a prompt must never be.
  string source = 7;
}

message RaiseSignalRequest {
  string org_id = 1;
  // `deadline`, `profile_gap`, `dsar` or `regulatory_update`, matching the
  // check constraint on `watcher_findings.kind`. A kind outside it is refused
  // here rather than at the database, so the caller gets `invalid_argument`
  // and the list of kinds rather than a constraint name.
  string kind = 2;
  // What makes this signal the same signal tomorrow. Required: without it a
  // daily sweep produces a row a day for one unchanged condition.
  string dedup_key = 3;
  string title = 4;
  string detail = 5;
  // `low`, `medium`, `high` or `critical`.
  string severity = 6;
  // The obligation this is about, when it is about one. An unknown slug is
  // refused: a signal citing an obligation that does not exist is the same
  // fabrication the citation validator refuses in a narrative, arriving by
  // another door.
  string obligation_slug = 7;
  // What was seen, JSON-encoded, for the person reading the signal and for
  // the Analyst that turns it into a finding.
  string metadata_json = 8;
}

message ReadEvidenceRequest {
  string org_id = 1;
  // Which connection to read, by the id `WatcherContext` gave. A connection
  // outside this organisation reads nothing rather than erroring, because
  // that is what the producer role's policies do and a handler that turned it
  // into a different answer would be describing tenancy rather than obeying
  // it.
  string connection_id = 2;
  // Which of that connection's tools the observations were produced by.
  // Required, and refused when the connection has not granted it.
  //
  // NOT OPTIONAL, DELIBERATELY. "Everything this connection ever said" is a
  // convenient default and the wrong one: a grant is per tool, so an
  // unfiltered read would let one granted tool carry back what an ungranted
  // one deposited before the grant was withdrawn.
  string tool = 3;
  // How many observations, newest first. Clamped by the handler; zero means
  // its default. The caller asks for what it can use rather than for
  // everything, because everything is a customer's whole history and a run
  // reads it into a model's context.
  int32 limit = 4;
}

// One thing a customer's own system reported, as it was stored.
//
// # `body_json` IS A STRING AND WILL STAY ONE
//
// The same argument `CallToolResponse.content_json` and
// `IngestEvidenceRequest.content_json` make, and it matters most here because
// this is the message that ends up in front of a model. It is third-party
// content. A typed message invites code that branches on a customer's data,
// and a field a customer controls that some handler reads as an instruction is
// the whole failure this product's design is arranged to avoid.
//
// It was redacted by the gateway before it was ever stored. Nothing here
// redacts again, for the reason `IngestEvidence` gives: a second
// implementation is free to disagree with the first, and the one that ran is
// the one that decided.
message StoredObservation {
  string evidence_id = 1;
  string connection_id = 2;
  // The tool it came from, without the `integration.` prefix the stored kind
  // carries. The caller asked in tool names and is answered in them.
  string tool = 3;
  // When it was true at the source, and when we learned it. Both, because the
  // gap between them is how stale an observation is and a Watcher deciding
  // whether something has changed needs to know.
  google.protobuf.Timestamp observed_at = 4;
  google.protobuf.Timestamp fetched_at = 5;
  string body_json = 6;
}

message ReadEvidenceResponse {
  // Newest first, and superseded rows are left out: a Watcher asks what a
  // system says now, and an observation something later replaced is not that.
  repeated StoredObservation observations = 1;
  // The connection's display name, so a caller can say where something came
  // from without a second read. Empty when the connection is not this
  // organisation's, which is the same answer as no observations and for the
  // same reason: the producer role saw no rows.
  string connection_name = 2;
}

message RaiseSignalResponse {
  string signal_id = 1;
  // False when this updated a signal that was already open rather than
  // raising a new one, which is the ordinary case for a condition that has
  // not gone away.
  bool raised = 2;
}


// CitableObligation is one obligation a signal from this context may cite.
//
// # WHY THIS IS NOT `ObligationContext`, WHICH IS ALMOST THE SAME SHAPE
//
// Not only to avoid the import cycle, though it does. The two carry different
// claims, and the difference is the fourth field.
//
// `ObligationContext` has `applies_because`: why the Watcher raised this, in
// plain words, so the Analyst does not have to invent grounds it was never
// given (ENT-248). Handing the same field to the WATCHER would be incoherent,
// because the Watcher is the thing that decides the grounds. A message that
// carries a field its recipient is supposed to produce is a message inviting
// it to agree with itself.
//
// So: the same three fields a model needs to cite something, and deliberately
// not the fourth.
message CitableObligation {
  string slug = 1;
  string title = 2;
  // The statement of the law, which a person wrote. Never the Official Journal
  // wording: the corpus stores none, and a citation resolves to the publisher
  // rather than to our copy.
  string summary = 3;
}
