syntax = "proto3";

package kindlast.platform.v1;

import "google/api/annotations.proto";
import "kindlast/options/v1/scope.proto";

// The Intelligence service: the agent harness, as an RPC surface (ENT-218,
// §1.6, §10, §26).
//
// # THE DIRECTION OF THIS CALL IS THE POINT
//
// core-api calls Intelligence, never the other way round for anything that
// decides. §1.6 splits the languages so that Go loads and Go persists while
// Python drafts and returns, and this service exists on the far side of that
// line: it holds no database credential, sets no tenancy GUC, and has no way
// to write a finding.
//
// It writes exactly one thing, and through core-api rather than itself: the
// `agent_runs` record, over `IngestService.RecordAgentRun`. Everything else it
// produces comes back in a response for the caller to decide about.
//
// # NO USER TOKEN REACHES THIS, EVER
//
// `internal:intelligence`, issued to one service principal through client
// credentials and never to the browser client. Two independent things enforce
// it: the audience is `kindlast-intelligence` and a human's console token
// carries a different one, and this scope is granted only to the machine user.
//
// That is not belt and braces for its own sake. Intelligence has no tenancy
// GUCs and no RLS session, so it cannot check whether a human should see what
// it is processing. It never needs to, because a human cannot reach it.
//
// # THE CALLER PASSES EVERYTHING
//
// There is no "fetch the obligations yourself" here, and its absence is
// deliberate (§26.2). Inputs are what a skill needs before it starts, and
// fetching them is a decision nobody is making, so the caller assembles them
// in Go where the corpus is already readable. That keeps a run a pure function
// of its inputs, which is what makes it activity-shaped for Temporal at step
// 8, and what lets its tests run without a stack.
//
// Tools, meaning what the model may decide to call DURING a run, are a
// different thing and are dispatched inside the harness under the skill's
// allow-list. The Analyst declares none.
service IntelligenceService {
  // Draft the plain-language narrative for one finding.
  //
  // # WHAT COMES BACK IS ALWAYS AN OUTCOME, NEVER AN ERROR FOR A REFUSAL
  //
  // A refusal is not a failure and does not arrive as one. §26.3 makes refusal
  // what a working guardrail produces: a budget exhausted, a citation that did
  // not resolve, a tool outside the allow-list. Returning `unavailable` or
  // `internal` for those would tell the caller the harness broke when in fact
  // it worked exactly as designed, and would put that in the column a customer
  // reads to decide whether to trust a finding.
  //
  // So a refused run is a 200 with `outcome: REFUSED` and an empty narrative.
  // A transport error means something genuinely went wrong.
  //
  // # AND A REFUSED NARRATIVE IS NOT RETURNED ANYWAY
  //
  // When a citation does not resolve, the drafted text is withheld rather than
  // returned with a warning attached. `AGENTS.md` calls a fabricated citation
  // worse than nothing, and handing a caller prose plus a note is how that
  // prose ends up in front of a customer.
  rpc DraftNarrative(DraftNarrativeRequest) returns (DraftNarrativeResponse) {
    option (kindlast.options.v1.required_scope) = "internal:intelligence";
    option (google.api.http) = {
      post: "/internal/v1/narratives:draft"
      body: "*"
    };
  }
}

message DraftNarrativeRequest {
  // The organisation this run is for.
  //
  // Carried in the message rather than a header because this caller holds no
  // session and no active organisation: a run happens for whichever tenant the
  // work belonged to. Used to record the run, never to decide what may be
  // read, because this service reads nothing.
  string org_id = 1;

  // What the Watcher found, in the organisation's own words where it has them.
  //
  // TREATED AS DATA AND NEVER AS INSTRUCTION. It reaches the model inside a
  // fenced user message and never in the system prompt, because `AGENTS.md` is
  // unambiguous that anything a customer typed is data, and concatenating a
  // compliance profile into a system prompt is how that profile becomes a way
  // to reprogram the Analyst.
  string signal = 2;

  // The obligations this run may cite, and the ONLY ones it may cite.
  //
  // The validator checks the model's citations against this list rather than
  // against the corpus, which is a stronger check than it looks. A citation to
  // an obligation that genuinely exists but is not in this list is still a
  // fabrication: the model produced it from somewhere other than its context,
  // which is exactly what the validator exists to catch.
  repeated ObligationContext obligations = 3;

  // The person this was drafted for, when there was one. Empty for a scheduled
  // sweep, which runs for the organisation and for nobody in particular.
  //
  // FOR THE HARNESS TO READ, NEVER FOR CORE-API TO BELIEVE (ENT-230). What
  // ends up in the run record is resolved from the delegation below, not from
  // this, because a value that travels through a second service and comes back
  // is a value that service could have changed.
  string on_behalf_of_user_id = 4;

  // The delegation this run may act under (ENT-230, §26.3).
  //
  // Minted by core-api while it was serving the person's own request, short
  // lived, single-org, single-user and revocable. Intelligence cannot make one,
  // cannot read what is inside it, and cannot widen it: all it can do is hand
  // it back, which is the property that keeps a machine principal from being
  // able to act as anybody it names.
  //
  // Two things it is for. A skill whose tools reach core-api presents it in the
  // `Kindlast-Delegation` header, and those calls then run as the person, bound
  // by exactly what that person could do at the keyboard. And it travels back
  // on `IngestService.RecordAgentRun`, where core-api resolves it to decide who
  // the run is recorded as having been for.
  //
  // Empty for a scheduled sweep. A skill given no delegation has no tools that
  // reach a tenant's data, which is the Analyst today: it declares none.
  string delegation = 5;
}

// ObligationContext is one obligation as the model sees it.
//
// A summary, never the Official Journal wording. The corpus stores no verbatim
// text, and the citation resolves to the publisher rather than to our copy.
message ObligationContext {
  string slug = 1;
  string title = 2;
  string summary = 3;
}

message DraftNarrativeResponse {
  DraftOutcome outcome = 1;

  // Empty unless the outcome is SUCCEEDED. See the RPC's comment: a refused
  // narrative is withheld rather than returned with a warning attached.
  string narrative = 2;

  // Why, when the outcome was not success. For a human to read.
  string outcome_detail = 3;

  // The citations that resolved, and the ones refused.
  //
  // BOTH, AND THE REFUSED HALF IS THE IMPORTANT ONE. A response carrying only
  // the good citations would be indistinguishable from a run where the model
  // never tried to cite anything, and "what did it get wrong" is the question
  // a customer is actually asking.
  repeated string resolved_citations = 4;
  repeated RejectedCitation rejected_citations = 5;

  // The `agent_runs` row this produced, so the caller can point a finding at
  // the record of how it was made.
  //
  // ALWAYS SET ON A 200, and the reason is worth stating because an earlier
  // draft of this comment said the opposite.
  //
  // Recording is not best-effort telemetry running alongside the answer. If a
  // run cannot be recorded, the handler returns `internal` rather than
  // returning the narrative with this field empty, because a caller handed
  // prose and a blank provenance field is a caller that stores the prose. A
  // finding nobody can check is the thing this service exists to not produce.
  //
  // So there is no "recording failed" case for a caller to handle here. There
  // is a transport error, which means it did.
  string agent_run_id = 6;
}

enum DraftOutcome {
  DRAFT_OUTCOME_UNSPECIFIED = 0;
  DRAFT_OUTCOME_SUCCEEDED = 1;
  // A guardrail stopped it. Not a kind of failure; see the RPC's comment.
  DRAFT_OUTCOME_REFUSED = 2;
  // Something went wrong that was nobody's policy.
  DRAFT_OUTCOME_FAILED = 3;
}

message RejectedCitation {
  string slug = 1;
  string reason = 2;
}
