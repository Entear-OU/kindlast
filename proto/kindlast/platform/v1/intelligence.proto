syntax = "proto3";

package kindlast.platform.v1;

import "google/api/annotations.proto";
import "kindlast/options/v1/scope.proto";
import "kindlast/platform/v1/hands.proto";
import "kindlast/platform/v1/watcher.proto";

// The Intelligence service: the agent harness, as an RPC surface (ENT-218,
// §1.6, §10, §26).
//
// # THE DIRECTION OF THIS CALL IS THE POINT
//
// core-api calls Intelligence, never the other way round for anything that
// decides. §1.6 splits the languages so that Go loads and Go persists while
// Python drafts and returns, and this service exists on the far side of that
// line: it holds no database credential, sets no tenancy GUC, and has no way
// to write a finding.
//
// It writes exactly one thing, and through core-api rather than itself: the
// `agent_runs` record, over `IngestService.RecordAgentRun`. Everything else it
// produces comes back in a response for the caller to decide about.
//
// # NO USER TOKEN REACHES THIS, EVER
//
// `internal:intelligence`, issued to one service principal through client
// credentials and never to the browser client. Two independent things enforce
// it: the audience is `kindlast-intelligence` and a human's console token
// carries a different one, and this scope is granted only to the machine user.
//
// That is not belt and braces for its own sake. Intelligence has no tenancy
// GUCs and no RLS session, so it cannot check whether a human should see what
// it is processing. It never needs to, because a human cannot reach it.
//
// # THE CALLER PASSES EVERYTHING
//
// There is no "fetch the obligations yourself" here, and its absence is
// deliberate (§26.2). Inputs are what a skill needs before it starts, and
// fetching them is a decision nobody is making, so the caller assembles them
// in Go where the corpus is already readable. That keeps a run a pure function
// of its inputs, which is what makes it activity-shaped for Temporal at step
// 8, and what lets its tests run without a stack.
//
// Tools, meaning what the model may decide to call DURING a run, are a
// different thing and are dispatched inside the harness under the skill's
// allow-list. The Analyst declares none.
service IntelligenceService {
  // Draft the plain-language narrative for one finding.
  //
  // # WHAT COMES BACK IS ALWAYS AN OUTCOME, NEVER AN ERROR FOR A REFUSAL
  //
  // A refusal is not a failure and does not arrive as one. §26.3 makes refusal
  // what a working guardrail produces: a budget exhausted, a citation that did
  // not resolve, a tool outside the allow-list. Returning `unavailable` or
  // `internal` for those would tell the caller the harness broke when in fact
  // it worked exactly as designed, and would put that in the column a customer
  // reads to decide whether to trust a finding.
  //
  // So a refused run is a 200 with `outcome: REFUSED` and an empty narrative.
  // A transport error means something genuinely went wrong.
  //
  // # AND A REFUSED NARRATIVE IS NOT RETURNED ANYWAY
  //
  // When a citation does not resolve, the drafted text is withheld rather than
  // returned with a warning attached. `AGENTS.md` calls a fabricated citation
  // worse than nothing, and handing a caller prose plus a note is how that
  // prose ends up in front of a customer.
  rpc DraftNarrative(DraftNarrativeRequest) returns (DraftNarrativeResponse) {
    option (kindlast.options.v1.required_scope) = "internal:intelligence";
    option (google.api.http) = {
      post: "/internal/v1/narratives:draft"
      body: "*"
    };
  }

  // Watch one organisation: decide what in its context is worth raising, and
  // raise it (ENT-258, PR 2).
  //
  // # THE FIRST SKILL THAT DECIDES, AND THE FIRST WITH A TOOL
  //
  // The Analyst is given everything and answers. This one is given a context
  // and chooses: which of the conditions in front of it is worth a signal,
  // which is a repeat of something already open, and when to stop. That choice
  // is made across several model calls with a tool between them, which is what
  // `harness/tools.py`'s dispatch seam was built for and, until now, only a
  // test skill exercised.
  //
  // # WHY THIS ONE WRITES AND THE ANALYST DOES NOT
  //
  // Narration is "Go loads, Python drafts, Go persists" because a draft is one
  // value: the caller can take it and write it. A watch is not. The model
  // decides DURING the run whether to raise, and how a raise turned out
  // changes what it does next, so the write has to be a tool inside the loop
  // rather than a return value after it.
  //
  // What keeps that safe is not the language boundary. It is that the tool is
  // `WatcherService.RaiseSignal`, on `internal:ingest`, which validates the
  // vocabulary, requires a deduplication key, resolves the citation and writes
  // through the producer role's own policies. This service gains no authority
  // it did not have; it gains one call it may make.
  //
  // # AND IT STILL CANNOT WRITE A FINDING
  //
  // There is no RPC for it anywhere on this surface. A signal is a thing worth
  // looking at; a finding cites regulation and goes to a human. The skill's
  // allow-list holds one tool, and a model asking for anything else is refused
  // rather than retried, recorded as refused, and the run ends.
  //
  // Like DraftNarrative, a refusal is a 200 with `outcome: REFUSED`. See that
  // RPC's comment for why.
  rpc Watch(WatchRequest) returns (WatchResponse) {
    option (kindlast.options.v1.required_scope) = "internal:intelligence";
    option (google.api.http) = {
      post: "/internal/v1/sweeps:watch"
      body: "*"
    };
  }

  // Answer one question a person asked about one finding (ENT-270).
  //
  // # THE FIRST RUN A PERSON STARTS RATHER THAN A SCHEDULE
  //
  // The two RPCs above run because a sweep or a job asked. This one runs
  // because somebody typed a question and is sitting in front of the answer,
  // and that changes exactly two things.
  //
  // The first is what the run is given. A narration is handed the sweep's own
  // words about a finding; this is handed those words AND a sentence the
  // customer wrote a second ago. Both are data, both arrive fenced inside user
  // messages, and neither is ever concatenated into the system prompt. The
  // second channel is the one worth naming separately: a question is the only
  // input to this service a person composes freely, so it is the one somebody
  // would reach for to try to reprogram the Analyst. The controls that make
  // that fail are the same ones the narrative already has, which is the reason
  // this RPC exists here rather than as a new service with its own ring.
  //
  // The second is what a wait means. A narration that sat in a queue too long
  // is refused because its asker has probably given up; that reasoning applies
  // harder here, because the asker is definitely still there and definitely
  // still waiting.
  //
  // # IT EXPLAINS APPLICABILITY AND WILL NOT STATE THE LAW
  //
  // The same split ENT-248 made for the narrative, enforced by the same claim
  // critic, for the same measured reason: two live runs on the 2B tier stated
  // the law backwards beside a citation that resolved correctly, which is the
  // failure a customer checking the citation cannot detect. A question that
  // invites a statement of law therefore earns a refusal, and the reader is
  // shown the obligation's authored summary instead. That is a worse-feeling
  // chat and a better product, and the alternative is a compliance assistant
  // that answers "what does Article 30 require" from what a 4B remembers.
  //
  // # NOTHING IS STORED BUT THE RUN
  //
  // No transcript, no thread, no conversation table. The answer goes back to
  // the caller and the `agent_runs` row is the only thing this leaves behind,
  // which is deliberate for a first version: a stored conversation is a second
  // place a customer's words live and a second thing to reason about under
  // retention, and neither is needed to answer one question about one finding.
  //
  // Like the two RPCs above, a refusal is a 200 with `outcome: REFUSED`.
  rpc AnswerFindingQuestion(AnswerFindingQuestionRequest) returns (AnswerFindingQuestionResponse) {
    option (kindlast.options.v1.required_scope) = "internal:intelligence";
    option (google.api.http) = {
      post: "/internal/v1/findings:answer"
      body: "*"
    };
  }

  // Runs the Hands over one finding: explain what approving it will do, and
  // prepare the record it would create (ENT-261, §26.5).
  //
  // # THE THIRD SKILL, AND THE FIRST WHOSE JOB IS TO NOT DECIDE
  //
  // The Analyst is given everything and answers. The Watcher decides what is
  // worth raising. This one is shown a decision a person is about to make and
  // its whole job is to make that decision better informed without making any
  // part of it.
  //
  // That is a property of the surface rather than of the prompt. The skill's
  // allow-list holds one tool, `HandsService.PrepareRecord`, which writes a
  // proposal onto a finding. There is no RPC anywhere this service can reach
  // that approves a finding, and none that creates an entry in a register:
  // approving is `findings:act`, which only a human's token carries, and
  // creating is `ExecutorService.ExecuteJob`, which acts on an
  // `executor_jobs` row that exists only because a human approved (00036).
  // A model asking for either is refused against the allow-list, recorded as
  // refused, and the run ends.
  //
  // Like DraftNarrative and Watch, a refusal is a 200 with `outcome:
  // REFUSED`. See DraftNarrative's comment for why.
  rpc ExplainApproval(ExplainApprovalRequest) returns (ExplainApprovalResponse) {
    option (kindlast.options.v1.required_scope) = "internal:intelligence";
    option (google.api.http) = {
      post: "/internal/v1/approvals:explain"
      body: "*"
    };
  }

  // Runs the Messenger over one finding notification: write the words a
  // person will read, and hand them to the dispatch path (ENT-260, §26.5).
  //
  // # THE FOURTH SKILL, AND THE FIRST WHOSE OUTPUT LEAVES THE BUILDING
  //
  // Everything the other three write is read on a page, behind the reader's
  // own sign-in, beside the finding it is about. This arrives in a mailbox or
  // a chat that somebody did not open at that moment, under our From: header.
  //
  // So the question the issue's title asks, can it send any other way, is
  // answered by the surface rather than by the prompt. The skill's allow-list
  // holds one entry, `queue_message`, and there is no RPC anywhere this
  // service can reach that delivers anything: the SMTP client and the
  // Telegram token are held by core-api, this process declares no library
  // that could open either, and `tests/test_no_third_party_credential.py`
  // asserts that rather than assuming it. A model asking to send is refused
  // against the allow-list, recorded as refused, and the run ends.
  //
  // And the draft changes nothing about the send. Who hears about a finding
  // comes from memberships and `notification_preferences` at delivery time;
  // whether a channel may be addressed at all comes from `notify.RouteFor`,
  // which answers a linked but unverified Telegram chat with the remaining
  // channel or with nowhere. A Messenger run reaches none of that.
  //
  // # WHAT IT IS GIVEN IS DELIBERATELY THIN
  //
  // See `MessageContext` below, which carries the argument in
  // full: §17.1 keeps the finding's own words out of a doorbell, and this
  // issue's description asks for exactly those words. The contradiction is
  // reported rather than resolved, and the run is not shown them, so it
  // cannot restate what it never saw.
  //
  // Like DraftNarrative and Watch, a refusal is a 200 with `outcome:
  // REFUSED`. See DraftNarrative's comment for why.
  rpc DraftMessage(DraftMessageRequest) returns (DraftMessageResponse) {
    option (kindlast.options.v1.required_scope) = "internal:intelligence";
    option (google.api.http) = {
      post: "/internal/v1/messages:draft"
      body: "*"
    };
  }
}

message DraftNarrativeRequest {
  // The organisation this run is for.
  //
  // Carried in the message rather than a header because this caller holds no
  // session and no active organisation: a run happens for whichever tenant the
  // work belonged to. Used to record the run, never to decide what may be
  // read, because this service reads nothing.
  string org_id = 1;

  // What the Watcher found, in the organisation's own words where it has them.
  //
  // TREATED AS DATA AND NEVER AS INSTRUCTION. It reaches the model inside a
  // fenced user message and never in the system prompt, because `AGENTS.md` is
  // unambiguous that anything a customer typed is data, and concatenating a
  // compliance profile into a system prompt is how that profile becomes a way
  // to reprogram the Analyst.
  string signal = 2;

  // The obligations this run may cite, and the ONLY ones it may cite.
  //
  // The validator checks the model's citations against this list rather than
  // against the corpus, which is a stronger check than it looks. A citation to
  // an obligation that genuinely exists but is not in this list is still a
  // fabrication: the model produced it from somewhere other than its context,
  // which is exactly what the validator exists to catch.
  repeated ObligationContext obligations = 3;

  // The person this was drafted for, when there was one. Empty for a scheduled
  // sweep, which runs for the organisation and for nobody in particular.
  //
  // FOR THE HARNESS TO READ, NEVER FOR CORE-API TO BELIEVE (ENT-230). What
  // ends up in the run record is resolved from the delegation below, not from
  // this, because a value that travels through a second service and comes back
  // is a value that service could have changed.
  string on_behalf_of_user_id = 4;

  // The delegation this run may act under (ENT-230, §26.3).
  //
  // Minted by core-api while it was serving the person's own request, short
  // lived, single-org, single-user and revocable. Intelligence cannot make one,
  // cannot read what is inside it, and cannot widen it: all it can do is hand
  // it back, which is the property that keeps a machine principal from being
  // able to act as anybody it names.
  //
  // Two things it is for. A skill whose tools reach core-api presents it in the
  // `Kindlast-Delegation` header, and those calls then run as the person, bound
  // by exactly what that person could do at the keyboard. And it travels back
  // on `IngestService.RecordAgentRun`, where core-api resolves it to decide who
  // the run is recorded as having been for.
  //
  // Empty for a scheduled sweep. A skill given no delegation has no tools that
  // reach a tenant's data, which is the Analyst today: it declares none.
  string delegation = 5;

  // Which model this run is recorded against: the organisation's chosen
  // provider and model name (ENT-236, §26.6), as a hint for the run record
  // and nothing more.
  //
  // # WHAT CHANGED HERE, AND WHY (ENT-256, part five)
  //
  // ENT-236 put the organisation's own API key in this field for one call, a
  // recorded relaxation of the rule that no third-party credential reaches
  // the Python service. It was the pass-through shape, and the alternative
  // considered then, proxying every completion through core-api so the key
  // never leaves Go, was parked in §25.
  //
  // Temporal unparked it. A draft that runs as a Python activity has its
  // input written into a workflow history, and a key cannot ride there; so
  // the key no longer rides anywhere. Intelligence asks core-api's
  // CompletionService for every completion, naming only the organisation,
  // and core-api resolves the choice inside the tenant's own rows, opens the
  // sealed credential with the key only it holds, and makes the call. The
  // Python service holds no endpoint and no credential, by construction,
  // again. `base_url` and `api_key` are kept on the wire for compatibility
  // and are refused if set: a request carrying either is a caller that has
  // not heard, and answering it would be the old exception by the back door.
  //
  // Absent means the deployment's own model, which is the default and the
  // case where nothing leaves.
  ModelEndpoint model_endpoint = 6;
}

// ModelEndpoint is one organisation's chosen provider, for the run record.
//
// Names only: `provider`, which is what a sub-processor record needs and is
// not a secret, and `model`. Where the call goes and what authenticates it
// are core-api's to know (CompletionService).
message ModelEndpoint {
  string provider = 1;
  // No longer read. Intelligence dials no model; a request setting this is
  // refused with invalid_argument (ENT-256, part five).
  string base_url = 2 [deprecated = true];
  string model = 3;
  // No longer read, and never populated by core-api. A request setting this
  // is refused with invalid_argument: a credential arriving this way is the
  // retired exception, not a feature (ENT-256, part five).
  string api_key = 4 [deprecated = true];
}

// ObligationContext is one obligation as the model sees it.
//
// A summary, never the Official Journal wording. The corpus stores no verbatim
// text, and the citation resolves to the publisher rather than to our copy.
message ObligationContext {
  string slug = 1;
  string title = 2;
  string summary = 3;

  // Why the Watcher raised this for this organisation, in plain words
  // (ENT-248).
  //
  // # GROUNDS ARE AN INPUT, BECAUSE A MODEL WITHOUT THEM INVENTS THEM
  //
  // Both narratives ENT-248 was filed for filled this gap themselves. One
  // asserted the obligation binds every controller regardless of size; the
  // other reasoned from the absence of a record to a headcount exemption.
  // Neither had been told why the obligation was thought to apply, so both
  // reached for whatever they remembered about the regulation, which is the
  // one thing a 2B is worst at.
  //
  // Caller-assembled like everything else here (§26.2). These are the
  // applicability conditions the obligation declares, rendered from the
  // vocabulary in `domain/corpus`, NOT a second evaluation of whether they
  // hold: the sweep already decided that, and a second evaluator disagreeing
  // with the first is the arrangement that produced ENT-246.
  //
  // May be empty, and an empty list is rendered as no block at all rather than
  // as a heading with nothing under it, because a model shown an empty list
  // reads it as "no grounds" instead of "not supplied".
  repeated string applies_because = 4;
}

message DraftNarrativeResponse {
  DraftOutcome outcome = 1;

  // Empty unless the outcome is SUCCEEDED. See the RPC's comment: a refused
  // narrative is withheld rather than returned with a warning attached.
  string narrative = 2;

  // Why, when the outcome was not success. For a human to read.
  string outcome_detail = 3;

  // The citations that resolved, and the ones refused.
  //
  // BOTH, AND THE REFUSED HALF IS THE IMPORTANT ONE. A response carrying only
  // the good citations would be indistinguishable from a run where the model
  // never tried to cite anything, and "what did it get wrong" is the question
  // a customer is actually asking.
  repeated string resolved_citations = 4;
  repeated RejectedCitation rejected_citations = 5;

  // The `agent_runs` row this produced, so the caller can point a finding at
  // the record of how it was made.
  //
  // ALWAYS SET ON A 200, and the reason is worth stating because an earlier
  // draft of this comment said the opposite.
  //
  // Recording is not best-effort telemetry running alongside the answer. If a
  // run cannot be recorded, the handler returns `internal` rather than
  // returning the narrative with this field empty, because a caller handed
  // prose and a blank provenance field is a caller that stores the prose. A
  // finding nobody can check is the thing this service exists to not produce.
  //
  // So there is no "recording failed" case for a caller to handle here. There
  // is a transport error, which means it did.
  string agent_run_id = 6;
}

enum DraftOutcome {
  DRAFT_OUTCOME_UNSPECIFIED = 0;
  DRAFT_OUTCOME_SUCCEEDED = 1;
  // A guardrail stopped it. Not a kind of failure; see the RPC's comment.
  DRAFT_OUTCOME_REFUSED = 2;
  // Something went wrong that was nobody's policy.
  DRAFT_OUTCOME_FAILED = 3;
}

message RejectedCitation {
  string slug = 1;
  string reason = 2;
}

// WatchRequest is one organisation's whole context, as core-api assembled it.
//
// Caller-assembled for the reason §26.2 gives and DraftNarrativeRequest
// repeats: fetching the context is not a decision, so it happens in Go where
// the tenancy GUCs and the producer role already are, and the run stays a pure
// function of its inputs. What the model DECIDES is what to do with it.
message WatchRequest {
  // The organisation this run is for. Carried in the message because this
  // caller holds no session; used to record the run and to name the
  // organisation on every signal raised, never to decide what may be read.
  string org_id = 1;

  // The context, exactly as `WatcherService.WatcherContext` returned it.
  //
  // The whole response rather than its fields copied across, so there is one
  // definition of what a watch sees. A second copy would drift the first time
  // a field is added to one and not the other, and the thing that would go
  // wrong is a model quietly reasoning without something core-api thought it
  // had been given.
  WatcherContextResponse context = 2;

  // Which model this run is recorded against (ENT-236, §26.6): names only,
  // for the run record. Absent means the deployment's own model. Identical in
  // meaning and in what it must never carry to DraftNarrativeRequest's field
  // of the same name.
  ModelEndpoint model_endpoint = 3;
}

message WatchResponse {
  WatchOutcome outcome = 1;

  // Why, when the outcome was not success. For a human to read.
  string outcome_detail = 2;

  // What the run raised, in the order it raised them.
  //
  // INCLUDING THE ONES THAT WERE DEDUPLICATED, which is the half a caller
  // most wants. A run that raised nothing new because everything it noticed
  // was already open is a run that worked, and a response listing only the
  // new rows would be indistinguishable from one where the model noticed
  // nothing at all.
  repeated RaisedSignal signals = 3;

  // The `agent_runs` row this produced. Always set on a 200, for the reason
  // DraftNarrativeResponse gives: a caller handed results and a blank
  // provenance field is a caller that stores unprovenanced results.
  string agent_run_id = 4;
}

// RaisedSignal is one signal this run put through RaiseSignal.
message RaisedSignal {
  string signal_id = 1;
  string dedup_key = 2;
  string title = 3;
  string severity = 4;
  // False when the signal already existed and this run touched it rather than
  // created it. See WatchResponse.signals for why both are reported.
  bool raised = 5;
}

enum WatchOutcome {
  WATCH_OUTCOME_UNSPECIFIED = 0;
  WATCH_OUTCOME_SUCCEEDED = 1;
  // A guardrail stopped it: a budget spent, a tool outside the allow-list, a
  // citation that did not resolve. Not a kind of failure.
  WATCH_OUTCOME_REFUSED = 2;
  // Something went wrong that was nobody's policy.
  WATCH_OUTCOME_FAILED = 3;
}

message AnswerFindingQuestionRequest {
  // The organisation this run is for. Used to record the run and to bind the
  // completion to the right tenant, never to decide what may be read: core-api
  // has already read the finding through the asker's own session and RLS, and
  // this service reads nothing.
  string org_id = 1;

  // What the person typed, verbatim.
  //
  // THE ONLY INPUT TO THIS SERVICE A PERSON COMPOSES FREELY, and therefore the
  // one that is most obviously an instruction if anything here is treated as
  // one. It reaches the model in its own fenced user message and never in the
  // system prompt. Nothing about that rests on the prompt asking: what holds
  // is that the answer is checked by the citation validator against the
  // obligations this run was offered, and by the claim critic, before a word
  // of it goes back.
  //
  // Length is bounded by the harness rather than by a proto constraint, so a
  // question that is too long is a recorded refusal a customer can read rather
  // than a parse error somewhere in the transport.
  string question = 2;

  // The finding the question is about, in the words the person is looking at.
  //
  // Data as well, and from the same direction: a finding's text is partly
  // derived from a compliance profile a customer filled in, so an injection
  // planted during onboarding reaches this run through here rather than
  // through `question`. Both channels are fenced, because closing one and
  // leaving the other open closes nothing.
  FindingContext finding = 3;

  // The obligations this run may cite, and the ONLY ones it may cite.
  //
  // In practice exactly one, the obligation the finding was raised against,
  // which is the strongest form of the check for the reason
  // DraftNarrativeRequest gives at length: a citation to an article that
  // genuinely exists and was never offered is still a fabrication.
  repeated ObligationContext obligations = 4;

  // Which model this run is recorded against (ENT-236, §26.6): names only, for
  // the run record. Absent means the deployment's own model. Identical in
  // meaning, and in what it must never carry, to DraftNarrativeRequest's field
  // of the same name.
  ModelEndpoint model_endpoint = 5;
}

// FindingContext is one finding as the person asking is seeing it.
//
// The fields the console renders and nothing else. Not the citation label and
// not the obligation summary: those reach the model through ObligationContext,
// where they are corpus rows a person wrote rather than text derived from a
// profile, and that difference is which side of the fence they belong on.
message FindingContext {
  // The sweep's own sentence, which the console shows as the heading.
  string detected = 1;
  string proposed_action = 2;
  string severity = 3;
  // What the Analyst wrote about this finding earlier, if it wrote anything.
  // Empty is ordinary: narration is a separate job and Intelligence is
  // optional, so most findings carry none.
  string narrative = 4;
}

message AnswerFindingQuestionResponse {
  AnswerOutcome outcome = 1;

  // Empty unless it succeeded, for the reason DraftNarrativeResponse gives: a
  // caller handed prose plus a warning is a caller that eventually shows the
  // prose.
  string answer = 2;

  // Why, when the outcome was not success. Written for the person who asked,
  // because unlike a narration this refusal happens while somebody is waiting
  // in front of it.
  string outcome_detail = 3;

  repeated string resolved_citations = 4;
  repeated RejectedCitation rejected_citations = 5;

  // The `agent_runs` row this produced. Always set on a 200.
  string agent_run_id = 6;

  // What that row says about how the answer was produced.
  //
  // CARRIED BACK RATHER THAN LEFT TO BE READ, and that is a limitation being
  // worked around rather than a design. `agent_runs` has a write path and no
  // read path, so a caller holding only the id has nothing to ask. Until there
  // is one, the run reports its own provenance in the same response, so "how
  // this was produced" can be shown to the person who asked instead of being
  // an id they cannot resolve.
  RunProvenance provenance = 7;
}

// RunProvenance is the part of an `agent_runs` row a person reads.
//
// The same values this run wrote through `IngestService.RecordAgentRun`, taken
// from the same record in the same call, so the two cannot describe different
// runs.
message RunProvenance {
  string skill = 1;
  string skill_version = 2;
  string model = 3;
  string model_version = 4;
  // Who served it: `instance` for the deployment's own endpoint, otherwise the
  // organisation's chosen provider. A different question from `model`, and the
  // one a sub-processor record needs.
  string provider = 5;
  int32 input_tokens = 6;
  int32 output_tokens = 7;
}

enum AnswerOutcome {
  ANSWER_OUTCOME_UNSPECIFIED = 0;
  ANSWER_OUTCOME_SUCCEEDED = 1;
  // A guardrail stopped it: a budget spent, a question longer than the harness
  // accepts, a citation that did not resolve, an answer that stated the law.
  // Not a kind of failure.
  ANSWER_OUTCOME_REFUSED = 2;
  // Something went wrong that was nobody's policy.
  ANSWER_OUTCOME_FAILED = 3;
}

// ExplainApprovalRequest is one finding's approval, as core-api assembled it.
//
// Caller-assembled for the reason §26.2 gives and WatchRequest repeats:
// fetching the context is not a decision, so it happens in Go where the
// tenancy GUCs and the corpus already are, and the run stays a pure function
// of its inputs.
message ExplainApprovalRequest {
  // The organisation this run is for. Carried in the message because this
  // caller holds no session; used to record the run and to name the
  // organisation on the one tool this skill may call, never to decide what
  // may be read.
  string org_id = 1;

  // The finding, the register an approval would write to, its columns, and
  // what this organisation is believed to be.
  //
  // The whole message rather than its fields copied across, so there is one
  // definition of what a Hands run sees. A second copy would drift the first
  // time a field is added to one and not the other, and what would go wrong
  // is a model quietly reasoning without something core-api thought it had
  // been given.
  ApprovalContext context = 2;

  // Which model this run is recorded against (ENT-236, §26.6): names only,
  // for the run record. Absent means the deployment's own model. Identical in
  // meaning and in what it must never carry to DraftNarrativeRequest's field
  // of the same name.
  ModelEndpoint model_endpoint = 3;
}

message ExplainApprovalResponse {
  ExplainOutcome outcome = 1;

  // Why, when the outcome was not success. For a human to read.
  string outcome_detail = 2;

  // What approving will do, in this organisation's terms. Empty unless the
  // outcome is SUCCEEDED, for the reason DraftNarrativeResponse withholds a
  // refused narrative.
  string explanation = 3;

  // The plan, as it was accepted: what the run filled and from which fact,
  // and what it left for a person.
  //
  // BOTH HALVES, AND THE SECOND IS THE ONE THAT MATTERS. A response listing
  // only what was filled would let a caller render a record that reads as
  // complete, which is the failure this agent exists to fix: today an
  // approved ROPA finding produces a row saying "Not recorded" in every
  // column, which is useless but honest, and a half-filled row presented as
  // finished would be worse than either.
  repeated PreparedField prepared = 4;
  repeated LeftForYou left_for_you = 5;

  // The `agent_runs` row this produced. Always set on a 200, for the reason
  // DraftNarrativeResponse gives.
  string agent_run_id = 6;
}

enum ExplainOutcome {
  EXPLAIN_OUTCOME_UNSPECIFIED = 0;
  EXPLAIN_OUTCOME_SUCCEEDED = 1;
  // A guardrail stopped it. Not a kind of failure; see the RPC's comment.
  EXPLAIN_OUTCOME_REFUSED = 2;
  // Something went wrong that was nobody's policy.
  EXPLAIN_OUTCOME_FAILED = 3;
}

// MessageContext is what a Messenger run is allowed to know about the doorbell
// it is writing the words of (ENT-260, §26.5).
//
// # WHAT IS MISSING FROM THIS MESSAGE IS THE MESSAGE
//
// There is no detected text, no proposed action and no obligation summary, and
// that is not an oversight for somebody to fill in later. §17.1 decided that a
// doorbell says that something happened and not what it says, because those
// three fields are a customer's compliance exposure and putting them in a
// message moves them into a mailbox and into a mail provider's logs. The
// recipient follows a link and reads the finding behind their own sign-in,
// where their role and their organisation are checked again.
// `notify.FindingNotification` has carried that reasoning since ENT-209.
//
// ENT-260's own description asks for the opposite in as many words: "what
// needs a decision, why it matters to this organisation in particular, what
// approving will do". Those are exactly the three fields §17.1 keeps out. The
// contradiction is reported rather than resolved, which is what AGENTS.md asks
// for when the design and the code disagree, and until somebody decides it the
// rule that was written down with its reasoning wins, because it is the one
// that is about somebody's privacy.
//
// Widening this message is the change that would settle it, which is why the
// argument lives here rather than in a commit message nobody will find, and
// why a test asserts this field set exactly.
//
// There is no recipient either. Who hears about a finding is resolved at
// delivery time from memberships and preferences, and one draft is the words
// everybody who does will read.
message MessageContext {
  // The organisation, as it named itself. Free text a customer typed, and
  // therefore data: it reaches the model in a fenced user message and never in
  // a system prompt.
  string org_name = 1;
  // How serious this one is, in the vocabulary of `severity_level`.
  string severity = 2;
  // How many other findings are open and undecided in this organisation. An
  // aggregate, so it says how loud to be without saying what about.
  int32 open_findings = 3;
  // True when this organisation has never had a finding before, so the message
  // is also the first of these anybody there has seen. Distinct from
  // `open_findings` being zero, which means everything else has been decided.
  bool first_for_org = 4;
  // True when at least one recipient will be given the one-tap approve link,
  // so a draft may say the choice is there. Never the link itself: every link
  // in a doorbell is minted per recipient inside the delivery transaction.
  bool has_approve_link = 5;
  // The channels this notification is going out on, from the recipients' own
  // preferences. A chat message and an email want different lengths, and
  // ENT-263 shipped Telegram receiving the email body verbatim.
  repeated string channels = 6;
}

message DraftMessageRequest {
  // The organisation this run is for. Carried in the message because this
  // caller holds no session; used to record the run and to name the
  // organisation on the completion, never to decide what may be read.
  string org_id = 1;

  // The notification row the words are for. Used only to record the run
  // against something a person can find later. Nothing this service can call
  // takes it, so it is not an identifier the skill could act on.
  string notification_id = 2;

  // What this run may know, and the only thing it may know. The whole message
  // rather than its fields copied across, so there is one definition of what a
  // Messenger run sees. A second copy would drift the first time a field was
  // added to one and not the other, and what would go wrong is a model
  // reasoning without something core-api thought it had been given.
  MessageContext context = 3;

  // Which model this run is recorded against (ENT-236, §26.6): names only, for
  // the run record. Absent means the deployment's own model. Identical in
  // meaning and in what it must never carry to DraftNarrativeRequest's field
  // of the same name.
  ModelEndpoint model_endpoint = 4;
}

message DraftMessageResponse {
  MessageOutcome outcome = 1;

  // Why, when the outcome was not success. For a human to read.
  string outcome_detail = 2;

  // The words, and empty unless the outcome is SUCCEEDED.
  //
  // Withheld on a refusal rather than returned with a warning attached, for
  // the reason DraftNarrativeResponse withholds a refused narrative, and it is
  // sharper here: the thing most likely to have been refused is a link the
  // model invented, and a caller handed copy plus a note is a caller that
  // eventually sends the copy.
  //
  // Both empty means the template renders the message, which is what a
  // deployment with no model gets and what every deployment got before this.
  string subject = 3;
  string body_text = 4;

  // The `agent_runs` row this produced. Always set on a 200, for the reason
  // DraftNarrativeResponse gives: a run that happened and left no record a
  // customer can read is the one outcome the harness is not allowed to
  // produce (ENT-277).
  string agent_run_id = 5;
}

enum MessageOutcome {
  MESSAGE_OUTCOME_UNSPECIFIED = 0;
  MESSAGE_OUTCOME_SUCCEEDED = 1;
  // A guardrail stopped it: a link, a claim about the law, a forbidden dash, a
  // request to send. Not a kind of failure; see the RPC's comment.
  MESSAGE_OUTCOME_REFUSED = 2;
  // Something went wrong that was nobody's policy.
  MESSAGE_OUTCOME_FAILED = 3;
}
