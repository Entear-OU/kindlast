syntax = "proto3";

package kindlast.platform.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "kindlast/options/v1/scope.proto";

// The platform surface: things the platform calls, never a browser.
//
// WHY THIS IS `platform` AND THE ROUTE IS `/internal/v1`
//
// The design calls this surface "internal" and the HTTP path below keeps that
// name, because that is what it is and what an operator will look for. The
// proto package cannot: Go gives any path segment called `internal` a
// visibility rule, so generated code under `gen/go/kindlast/internal/v1` is
// importable only from within `gen/go/kindlast/...` and nothing in core-api can
// use it. That is a toolchain constraint rather than a design one, so the
// design's name stays on the route and the package takes another.
//
// A separate package from `kindlast.core.v1` either way, and the separation is
// the point rather than filing. Everything in `core.v1` is reachable by a
// human's token through `web`. Nothing here is, or should ever become so:
// these RPCs declare `internal:*` scopes, which the seed issues to service
// clients through client credentials and never to the browser client. Keeping
// them apart makes "is this reachable by a person" a question answered by the
// import path.
//
// HOW A SWEEP GETS RUN, AS OF ENT-256 PART FOUR
//
// 00001 dropped the three pg_cron jobs when the schema moved off Supabase,
// and for a while nothing ran the Watcher or the Analyst unless somebody called
// RunSweep with a service credential. That is over: Temporal Schedules on
// `workers` call this surface, exactly as this comment always said they would,
// and RunSweep survived as the activity rather than being replaced.
//
// Two things start a sweep now. Confirming onboarding writes a `sweep_triggers`
// row in the same transaction as the profile (00035), a relay lists it within
// seconds and starts one workflow for it; and a daily schedule lists every
// organisation with a profile (ListSweepTargets) and sweeps each. Both
// workflows run the Watcher (RunSweep with detect_only) and then the Analyst
// (RunAnalyst) as two activities, because the design's point is that the
// Analyst is the next step in the workflow, not a second schedule five minutes
// later hoping the first has finished. RunSweep with detect_only false still
// does both in one transaction, for an operator who wants one call.
service SweepService {
  // Runs the Watcher and then the Analyst for one organisation.
  //
  // The organisation comes from the `Kindlast-Org-Id` header, exactly as it
  // does on the human surface. A sweep is per-organisation and never global:
  // "sweep everyone" is an operation whose blast radius is every customer at
  // once, and it should be a loop somebody writes deliberately rather than a
  // parameter somebody can pass by accident.
  //
  // Synchronous, and that is a decision with a shelf life. A sweep over one
  // organisation's profiles is fast enough to answer in a request today, and a
  // synchronous call is far easier to operate because the caller learns whether
  // it worked. When sweeps outgrow that, this returns a handle instead, which
  // is a proto change rather than an architectural one.
  rpc RunSweep(RunSweepRequest) returns (RunSweepResponse) {
    option (kindlast.options.v1.required_scope) = "internal:ingest";
    option (google.api.http) = {
      post: "/internal/v1/sweep"
      body: "*"
    };
  }

  // Brings back every finding whose deferral has run out, across every
  // organisation at once (ENT-256, part two).
  //
  // THE FIRST THING TEMPORAL RUNS ON A SCHEDULE, and the shape every schedule
  // after it takes: a Temporal Schedule starts a workflow in `workers`, the
  // workflow's activity calls this, and core-api does the work on the
  // producer pool. `workers` holds no database credential by design (§21.4),
  // so "an activity" means "an RPC on this surface", and this is that RPC.
  //
  // NO ORGANISATION HEADER, UNLIKE RunSweep, AND THAT IS THE POINT OF IT. A
  // sweep is per organisation because "sweep everyone" is a blast radius
  // somebody should have to write a loop for. Expiring snoozes is the
  // opposite: it is a maintenance pass whose whole job is every organisation,
  // it decides nothing (the person decided when they deferred), and running
  // it per organisation would need a list of organisations the producer role
  // deliberately cannot read. So the database function is SECURITY DEFINER
  // and bounded by its own body instead (00034), and this RPC carries nothing
  // but the call.
  //
  // Idempotent. A finding is brought back once; a second call in the same
  // hour finds nothing to do and reports zero, which is what lets Temporal
  // retry it freely.
  rpc ExpireSnoozes(ExpireSnoozesRequest) returns (ExpireSnoozesResponse) {
    option (kindlast.options.v1.required_scope) = "internal:ingest";
    option (google.api.http) = {
      post: "/internal/v1/snoozes:expire"
      body: "*"
    };
  }

  // Runs the Analyst alone for one organisation: turns the signals the
  // Watcher raised and nobody has analysed yet into findings.
  //
  // The second activity of a sweep workflow, after RunSweep with detect_only.
  // Same organisation header, same producer pool, same refusal without a
  // header. Idempotent: the Analyst works over unprocessed signals, so a
  // second call finds none and reports zero, which is what lets a workflow
  // retry it on its own.
  rpc RunAnalyst(RunAnalystRequest) returns (RunAnalystResponse) {
    option (kindlast.options.v1.required_scope) = "internal:ingest";
    option (google.api.http) = {
      post: "/internal/v1/sweep:analyse"
      body: "*"
    };
  }

  // Lists the sweeps somebody asked for and nothing has run yet (00035):
  // trigger id and organisation, oldest first. The relay's question, asked
  // every few seconds; ids only, because the answer goes into a workflow
  // history. No organisation header: the list is every organisation's.
  rpc ListSweepTriggers(ListSweepTriggersRequest) returns (ListSweepTriggersResponse) {
    option (kindlast.options.v1.required_scope) = "internal:ingest";
    option (google.api.http) = {
      post: "/internal/v1/sweep-triggers:pending"
      body: "*"
    };
  }

  // Records what a triggered sweep did: done, or an attempt that failed with
  // why. A failed attempt leaves the row pending, so the relay offers it
  // again once the workflow that held it has closed; `done` is reserved for a
  // sweep that actually ran. Idempotent on a settled row.
  rpc SettleSweepTrigger(SettleSweepTriggerRequest) returns (SettleSweepTriggerResponse) {
    option (kindlast.options.v1.required_scope) = "internal:ingest";
    option (google.api.http) = {
      post: "/internal/v1/sweep-triggers:settle"
      body: "*"
    };
  }

  // Lists every organisation a scheduled sweep should visit: the ones with a
  // compliance profile, by id alone. The daily workflow's first activity.
  //
  // THIS IS "SWEEP EVERYONE", WRITTEN DELIBERATELY. RunSweep refuses to sweep
  // more than one organisation because the blast radius is every customer at
  // once; this RPC exists so that the loop is a workflow an operator can watch,
  // pause and read the history of, one organisation per activity, rather than
  // a parameter. The producer role cannot enumerate tenants, so the list comes
  // from `sweep_targets()`, a SECURITY DEFINER function that answers this one
  // question (00035).
  rpc ListSweepTargets(ListSweepTargetsRequest) returns (ListSweepTargetsResponse) {
    option (kindlast.options.v1.required_scope) = "internal:ingest";
    option (google.api.http) = {
      post: "/internal/v1/sweep-targets:list"
      body: "*"
    };
  }
}

message RunAnalystRequest {}

message RunAnalystResponse {
  // Findings the Analyst created or refreshed from the signals waiting for
  // it. Zero is the ordinary answer for an organisation whose profile has not
  // changed since its last sweep.
  int32 findings = 1;
  // When this ran, from the database's clock inside the same transaction.
  google.protobuf.Timestamp ran_at = 2;
}

message ListSweepTriggersRequest {
  // At most this many. Zero means the server's default.
  int32 limit = 1;
}

message ListSweepTriggersResponse {
  repeated SweepTrigger triggers = 1;
}

message SweepTrigger {
  string trigger_id = 1;
  string org_id = 2;
  // Why the row exists; `onboarding_confirmed` today.
  string reason = 3;
}

message SettleSweepTriggerRequest {
  string trigger_id = 1;
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    // The Watcher and the Analyst both ran. The row becomes `done`.
    OUTCOME_DONE = 1;
    // An attempt failed; `error` says how. The row stays pending with the
    // attempt and the reason recorded.
    OUTCOME_FAILED = 2;
  }
  Outcome outcome = 2;
  string error = 3;
}

message SettleSweepTriggerResponse {
  // True when this call changed the row; false when it was already done.
  bool settled = 1;
}

message ListSweepTargetsRequest {}

message ListSweepTargetsResponse {
  // Organisation ids, in a stable order.
  repeated string org_ids = 1;
}

message RunSweepRequest {
  // Run the Watcher only, and skip converting its signals into findings.
  //
  // For diagnosing the producer: the Watcher deciding nothing is wrong is a
  // different failure from the Analyst failing to resolve an obligation, and
  // separating them turns one confusing empty feed into two answerable
  // questions.
  bool detect_only = 1;
}

message RunSweepResponse {
  // Signals the Watcher raised. Deduplicated in the database, so a second sweep
  // over unchanged data reports zero rather than repeating itself.
  int32 signals = 1;
  // Findings the Analyst created or refreshed from those signals. Zero when
  // `detect_only` was set.
  //
  // Lower than `signals` is normal rather than an error: a signal whose
  // obligation slug resolves to nothing is skipped and logged, because a
  // finding with no obligation behind it could not cite anything.
  int32 findings = 2;
  // When this sweep ran, which is what the console's "last checked" reads.
  google.protobuf.Timestamp ran_at = 3;
}

message ExpireSnoozesRequest {}

message ExpireSnoozesResponse {
  // Findings returned to "needs a decision" by this call. Zero is the ordinary
  // answer most hours of most days.
  int32 reemerged = 1;
  // When the pass ran, from the database's clock inside the same transaction,
  // so it is the instant the findings actually moved.
  google.protobuf.Timestamp ran_at = 2;
}
