syntax = "proto3";

package kindlast.platform.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "kindlast/options/v1/scope.proto";

// Writing the corpus: the law itself, and the obligations derived from it
// (§20.3, §10, §16.5; ENT-207).
//
// # WHY THIS IS ON THE PLATFORM SURFACE AND NOT THE CORE ONE
//
// Nothing here may ever be reachable by a person's token. These RPCs declare
// `internal:ingest`, which the seed issues to service clients through client
// credentials and never to the browser client, and the package separation makes
// "is this reachable by a human" a question answered by the import path. See
// sweep.proto's header for why the package is `platform` when the route says
// `/internal/v1`.
//
// The reason is not that ingest is dangerous to a tenant. It is that the
// product's whole claim is that a customer can check a finding against the law,
// and that claim is worth exactly nothing if a request from the console could
// change the law it is checked against.
//
// # IT TAKES A PACK, NOT A REGULATION IT KNOWS THE NAME OF
//
// Nothing in this file mentions GDPR or the AI Act. A pack is a document with
// its articles, recitals and annexes, plus obligations, guidelines and
// enforcement decisions, and the two regulations shipped today are two calls
// with the same shape. §26 and ENT-233 build on this: a regulation pack is
// corpus plus obligations plus skills plus evals plus record types, and the
// pack boundary is not drawn here. What is settled here is the narrower thing,
// that a third regulation is a third call rather than a code change.
//
// # THE CORPUS STORES NO VERBATIM TEXT
//
// Every article, recital, annex and paragraph carries a curated summary, not
// the Official Journal wording. That predates this issue (it is why the schema
// has a 1..2000 character bound on every summary column rather than a text
// blob), and it survives for the same two reasons: the OJ text has its own
// licensing and its own canonical location, and a summary is what a model
// scans to decide which natural key to cite. Verbatim text is fetched from the
// document's `official_url` at the point somebody wants to read it, so the
// citation always resolves to the publisher rather than to our copy.
//
// # AND THE WRITE RUNS ON A ROLE THAT CAN REACH NOTHING ELSE
//
// `kindlast_ingest` (00018): NOSUPERUSER, NOBYPASSRLS, owns nothing, grants on
// the ten regulatory tables and no others, insert and update but never delete.
// Not the migrator, which 00002's comment named and which bypasses RLS
// entirely.
service IngestService {
  // Writes a pack, or refuses it whole.
  //
  // # IDEMPOTENT, AND THAT IS THE HARD REQUIREMENT
  //
  // Every row upserts on its natural key: a document on its CELEX number, an
  // article on `(document, number)`, an obligation on its slug. Running the
  // same pack twice produces no duplicates and no drift, which matters because
  // the caller is a schedule: §20.3 makes this a singleton with a fixed
  // workflow id once Temporal lands at step 8, and a schedule that
  // double-writes on retry would compound silently.
  //
  // # ONE TRANSACTION, SO A BAD PACK LEAVES NOTHING BEHIND
  //
  // A pack that fails validation halfway would otherwise leave a corpus that is
  // partly the new snapshot and partly the old, which is the one state nobody
  // can reason about: a finding citing Article 30 would resolve, and the recital
  // beside it would not, with nothing to say which snapshot each came from.
  //
  // # A CITATION THAT DOES NOT RESOLVE IS A REFUSAL, NOT A WARNING
  //
  // Every obligation names an article, recital or annex, and ingest checks that
  // the thing exists before committing. AGENTS.md opens by saying a fabricated
  // citation is worse than nothing; an obligation pointing at an article that
  // is not in the corpus is exactly that, and it would surface to a customer as
  // a finding whose "check this against the law" link goes nowhere.
  rpc IngestCorpus(IngestCorpusRequest) returns (IngestCorpusResponse) {
    option (kindlast.options.v1.required_scope) = "internal:ingest";
    option (google.api.http) = {
      post: "/internal/v1/corpus:ingest"
      body: "*"
    };
  }

  // Records one agent run: what was asked, what answered, what it consulted,
  // what it cost, and how it ended (ENT-218, §26.3).
  //
  // # WHY THE SCOPE IS DIFFERENT FROM THE RPC ABOVE
  //
  // `internal:intelligence`, not `internal:ingest`, and the difference is the
  // point rather than an inconsistency. The scope option is per method
  // precisely so one internal surface can hold writes that different platform
  // callers make. The corpus loader may not record agent runs and the
  // Intelligence service may not rewrite the law, and neither holds the
  // other's scope.
  //
  // What the two share, and the reason they sit on one service, is the
  // property in this file's header: no person's token reaches either. The
  // package boundary answers "is this reachable by a human" and the scope
  // answers "by which of us".
  //
  // # WHY INTELLIGENCE DOES NOT WRITE THIS ITSELF
  //
  // It holds no database credential (§1.6). Go persists; Python drafts and
  // returns. So the run record travels back over this RPC rather than being
  // written where it was produced, which also means the record is written by
  // something that can be trusted to write the org_id honestly.
  //
  // # ONE CALL, AT THE END
  //
  // A run is recorded once, when it finishes, carrying both timestamps. There
  // is no start call to pair with. A record a producer can amend after the
  // fact is worth less than one it cannot, which is the same argument
  // `audit_log` rests on, and 00019 enforces it by granting no update to
  // anybody.
  //
  // A refusal is a run and is recorded. A run that failed to record is not a
  // run that did not happen, so the caller must treat a failure here as
  // serious rather than as best-effort telemetry.
  // Records what a machine fetched from a customer's own system (ENT-231,
  // §26.4).
  //
  // # THE DOOR EVIDENCE COMES IN BY WHEN NOBODY IS SIGNED IN
  //
  // ENT-231 says evidence enters only through `IngestService`, and this is
  // that door. The scheduled Watcher at build-order step 8 uses it, and so
  // does any gateway-initiated fetch that runs for an organisation with no
  // session behind it.
  //
  // # AND WHY THERE IS A SECOND DOOR ON THE CORE SURFACE
  //
  // Worth stating plainly rather than leaving somebody to find the asymmetry
  // and assume it is a mistake. A live fetch a person asked for from the
  // console arrives on a USER token, and a user token by design can never
  // carry an `internal:*` scope. Routing it through here would mean either
  // issuing internal scopes to people, which undoes what ENT-207 built, or
  // writing without the person's identity, which loses `requested_by` on the
  // one record where "which human asked" matters most.
  //
  // So: a machine ingests here, on `kindlast_agent`, org named in the message.
  // A person's live fetch goes through `IntegrationsService.FetchNow`, on
  // `kindlast_app`, under RLS and their own membership. Both write the same
  // two rows with the same stamps, and neither is reachable by the other's
  // caller. `MemoryService`'s header makes the identical argument for why a
  // human corrects a fact on the core surface rather than through here.
  //
  // # WHAT IS ALREADY TRUE BY THE TIME THIS IS CALLED
  //
  // The content has been through the gateway: an endpoint on the egress
  // allow-list, a tool the connection granted, and redaction applied before it
  // crossed back. This RPC does not re-apply any of that and could not: it
  // holds no allow-list and no policy, and a second redaction pass here would
  // be a second implementation free to disagree with the first.
  //
  // What it does enforce is the shape: an observation names its connection and
  // when it was observed, and a fetch record is written for every call
  // including the ones that produced nothing.
  rpc IngestEvidence(IngestEvidenceRequest) returns (IngestEvidenceResponse) {
    option (kindlast.options.v1.required_scope) = "internal:ingest";
    option (google.api.http) = {
      post: "/internal/v1/evidence"
      body: "*"
    };
  }

  rpc RecordAgentRun(RecordAgentRunRequest) returns (RecordAgentRunResponse) {
    option (kindlast.options.v1.required_scope) = "internal:intelligence";
    option (google.api.http) = {
      post: "/internal/v1/agent-runs"
      body: "*"
    };
  }
}

// RecordAgentRunRequest is one finished run.
//
// Minimal on purpose. §26.4 gives this a versioned profile reference and
// normalised evidence, and ENT-228 adds them. The shape here is what those
// grow into rather than something they replace.
message RecordAgentRunRequest {
  // The organisation the run was for. Required, and carried in the message
  // rather than a header because this caller has no active organisation: it
  // runs for whichever tenant the work belonged to, and says so per call.
  string org_id = 1;

  // What ran, with versions. A bare name would record that "the analyst skill"
  // ran, which is not a fact anybody can act on a year later.
  string skill = 2;
  string skill_version = 3;
  string model = 4;
  // For a local model this is the weights' digest, not a marketing version.
  string model_version = 5;

  // The person this ran for, when there was one.
  //
  // Empty for a scheduled sweep, which runs for the organisation and for
  // nobody in particular. Setting it there would be a lie that later reads as
  // "this person asked for this".
  //
  // NOT BELIEVED ON ITS OWN (ENT-230). Until this field was checked, a caller
  // holding `internal:intelligence` could name anybody here and the record
  // would say a person asked for a run they had never heard of, in their own
  // organisation's compliance record. So a run that names a person must also
  // present the delegation below, and the two must agree; a run that presents
  // no delegation must leave this empty.
  //
  // Kept as a field rather than derived silently from the delegation, because
  // an agreement that is checked is worth more than a value that is inferred:
  // a caller sending the wrong pair finds out, where a caller whose field was
  // quietly overwritten does not.
  string on_behalf_of_user_id = 6;

  // The input the run was given, as JSON. Not the assembled prompt: that
  // includes the corpus prefix and is reconstructible from the skill version,
  // so storing it per run would copy the corpus into every row.
  string request_json = 7;

  // Ordered tool calls with arguments and result summaries, as JSON.
  string tool_calls_json = 8;

  // Citations, split into those that resolved to a stored obligation and those
  // the validator refused, as JSON.
  //
  // BOTH HALVES, AND THE REJECTED HALF IS THE IMPORTANT ONE. A validator that
  // silently dropped a bad citation would leave a record indistinguishable
  // from a run where the model never tried to cite anything. The customer's
  // question is "what did it get wrong", and an omission cannot answer it.
  string citations_json = 9;

  AgentRunOutcome outcome = 10;
  // Why, when the outcome was not success. For a human to read, not a code to
  // branch on.
  string outcome_detail = 11;

  AgentRunUsage usage = 12;

  // Queued, started, finished. Three rather than two because ENT-238 needs to
  // tell "slow because the model is slow" from "slow because it waited", and
  // those are different problems with different fixes.
  google.protobuf.Timestamp queued_at = 13;
  google.protobuf.Timestamp started_at = 14;
  google.protobuf.Timestamp finished_at = 15;

  // The delegation this run was given, when it ran for a person (ENT-230,
  // §26.3).
  //
  // # EVIDENCE HERE, AUTHORITY EVERYWHERE ELSE
  //
  // On the core surface a delegation is presented in the `Kindlast-Delegation`
  // header and the request then runs AS the person: their scopes, their
  // tenancy, their audit row. This is the one place it appears in a message,
  // and it does the opposite job. Recording a run is something the machine does
  // as itself, on a scope no person holds; the delegation is here so core-api
  // can check that the person named above really did authorise this run, rather
  // than taking the caller's word for it.
  //
  // Empty for a scheduled sweep, which runs for nobody in particular and has no
  // delegation to present.
  //
  // # WHY IT DOES NOT ALSO BECOME THE ORGANISATION
  //
  // `org_id` above still has to be sent and must MATCH the delegation's. A
  // delegation is single-org, so a run recorded against a different tenant than
  // the one the person authorised is a caller bug, and the mismatch is worth
  // refusing rather than silently correcting.
  string delegation = 16;
}

enum AgentRunOutcome {
  AGENT_RUN_OUTCOME_UNSPECIFIED = 0;
  AGENT_RUN_OUTCOME_SUCCEEDED = 1;
  // A guardrail stopped it: a budget exhausted, a citation that did not
  // resolve, a tool outside the skill's allow-list.
  //
  // FIRST CLASS, NOT A KIND OF FAILURE. §26.3 makes refusal what a working
  // guardrail produces. An enum offering only success and failure would push
  // refusals into one of them and lose the distinction that matters most for
  // trust: the difference between "the harness stopped this" and "the harness
  // broke".
  AGENT_RUN_OUTCOME_REFUSED = 2;
  // Something went wrong that was nobody's policy.
  AGENT_RUN_OUTCOME_FAILED = 3;
}

message AgentRunUsage {
  int32 input_tokens = 1;
  // Separate because every provider that offers prompt caching prices it
  // separately, and because with a local model it is the measurement showing
  // the corpus prefix is reused rather than reprocessed (§26).
  int32 cached_input_tokens = 2;
  int32 output_tokens = 3;
  // Micros, not a float. Money in a float is a bug waiting for a
  // reconciliation. Zero for a local model, which is a true statement about
  // marginal cost rather than a missing value.
  int64 cost_micros = 4;
}

message RecordAgentRunResponse {
  // The stored run's id, so a caller can reference it from whatever it goes on
  // to write.
  string id = 1;
}

message IngestCorpusRequest {
  RegulationPack pack = 1;

  // Validate and report, write nothing.
  //
  // Worth having because the expensive failure here is a pack that is 90%
  // right: a curator wants to know which citations dangle before deciding
  // whether to fix the pack or ingest the corpus it depends on first. The
  // response is identical either way apart from `applied`.
  bool dry_run = 2;
}

// RegulationPack is one coherent unit of regulatory reference data.
//
// Every field is optional, which is deliberate rather than lax. A pack may
// carry only a document (the law, no obligations derived from it yet), only
// obligations (a revised interpretation of a regulation already ingested), or
// only guidelines. Requiring all of them would mean re-sending 200KB of
// unchanged articles to correct one obligation's severity.
message RegulationPack {
  // Names this pack for logs and for the response. Not a key: nothing is
  // stored under it, because the natural keys inside the pack are what the
  // corpus is addressed by. A pack renamed is not a new corpus.
  string pack_id = 1;

  RegulatoryDocument document = 2;
  repeated Obligation obligations = 3;
  repeated Guideline guidelines = 4;
  repeated EnforcementDecision enforcement_decisions = 5;
}

message RegulatoryDocument {
  // The natural key. A CELEX number identifies an EU legal act uniquely and
  // permanently, which is why it is the key rather than a title or a slug we
  // would have to invent and then keep stable ourselves.
  string celex_number = 1;
  string title = 2;
  string short_title = 3;
  // ISO date, `2016-05-04`.
  string version_date = 4;
  // Where the verbatim text lives. The corpus stores none, so this is what a
  // citation ultimately resolves to.
  string official_url = 5;

  repeated Article articles = 6;
  repeated Recital recitals = 7;
  repeated Annex annexes = 8;
  // Which recitals inform which articles. Additive across ingests: a link is
  // inserted or already exists, and nothing removes one, because the junction
  // has no natural way to tell a link somebody deleted from a link a smaller
  // pack simply did not mention.
  repeated ArticleRecitalLink article_recitals = 9;
}

message Article {
  int32 article_number = 1;
  string heading = 2;
  // Curated, 1 to 2000 characters, enforced by a database constraint. Not the
  // Official Journal wording; see the service comment.
  string summary = 3;
  // Empty falls back to the document's version date at query time. Present for
  // the AI Act's staged schedule, where Article 4 applies from 2025-02-02 and
  // most others from 2026-08-02.
  string effective_date = 4;
  repeated Paragraph paragraphs = 5;
}

message Paragraph {
  // `1`, `2(a)`, and so on. Unique within the article, and the citation grain a
  // finding can point at.
  string label = 1;
  string summary = 2;
  int32 ordering = 3;
}

message Recital {
  int32 recital_number = 1;
  string summary = 2;
}

message Annex {
  // `III`, and so on.
  string label = 1;
  string heading = 2;
  string summary = 3;
  string effective_date = 4;
  repeated AnnexItem items = 5;
}

message AnnexItem {
  string label = 1;
  // Only top-level items have one in the Official Journal; sub-items do not.
  string heading = 2;
  string summary = 3;
  string effective_date = 4;
  int32 ordering = 5;
}

message ArticleRecitalLink {
  int32 article_number = 1;
  int32 recital_number = 2;
}

// Obligation is a duty derived from the law, and the thing a finding cites.
message Obligation {
  string slug = 1;
  string title = 2;
  // 100 to 2000 characters, enforced by a database constraint. Longer than the
  // article bound on purpose: this is the text a person reads to decide whether
  // a finding applies to them, so a one-line summary would push them to the
  // regulation for every finding.
  string summary = 3;

  Citation citation = 4;

  // The profile shape this obligation applies to, as JSON. Free-form because it
  // is matching input rather than a stored schema, and the matcher is the thing
  // that has an opinion about it.
  string applies_when_json = 5;

  // `low`, `medium` or `high`. Constrained in the database.
  string severity = 6;
  int32 due_within_days = 7;
  string recurrence = 8;
  string effective_date = 9;
  repeated string topic_tags = 10;

  // What approving a finding for this obligation creates, e.g. `create_ropa`.
  //
  // One of `review`, `create_ropa`, `create_dsar`, `create_ai_system`, matching
  // `findings.action_type` and constrained in the database (00007). Empty is
  // read as `review`, which is the honest answer for an obligation with no
  // register behind it: approving records the decision and creates no row. That
  // is a value rather than an absence, and the column is NOT NULL because of it.
  string action_type = 11;
}

// Citation is what an obligation points at, and it must resolve.
message Citation {
  // `article`, `recital` or `annex`. Exactly one of the three targets below is
  // set, matched by a database constraint as well as by ingest.
  string kind = 1;
  // Which document, by CELEX. Not assumed to be the pack's own document: an
  // obligation may cite a regulation ingested by an earlier pack.
  string celex = 2;

  int32 article_number = 3;
  int32 recital_number = 4;
  string annex_label = 5;
  // Narrows an article citation to one paragraph. Optional, and checked when
  // present: a paragraph label that does not exist is as dangling as an article
  // number that does not.
  string paragraph_label = 6;
}

message Guideline {
  string slug = 1;
  string publisher = 2;
  string title = 3;
  string adopted_date = 4;
  string version = 5;
  string source_url = 6;
  repeated string topic_tags = 7;
}

message EnforcementDecision {
  string slug = 1;
  // The supervisory authority that decided it.
  string dpa = 2;
  string title = 3;
  string decision_date = 4;
  // Absent where a decision carried no fine, which is common: a reprimand or a
  // processing ban is an outcome too, and treating "no fine" as zero would make
  // an enforcement register read as a list of free passes.
  int64 fine_eur = 5;
  bool has_fine = 6;
  string summary = 7;
  string source_url = 8;
  repeated int32 gdpr_articles = 9;
  repeated string topic_tags = 10;
}

message IngestCorpusResponse {
  // False on a dry run, and on nothing else: a real run either applied the pack
  // or returned an error.
  bool applied = 1;

  // What was written, by table. Counts an upsert once whether it inserted or
  // updated: the useful question after a re-ingest is "did the pack land",
  // which is answered by the total matching the pack, not by a split that
  // changes every time somebody edits a summary.
  IngestCounts counts = 2;

  // Citations that did not resolve, in the order they appear in the pack.
  //
  // Populated on a dry run. On a real run the request fails instead and this is
  // carried on the error detail, because a partially-good pack must not look
  // like a success with a note attached.
  repeated string unresolved_citations = 3;

  google.protobuf.Timestamp ingested_at = 4;
}

message IngestCounts {
  int32 documents = 1;
  int32 articles = 2;
  int32 paragraphs = 3;
  int32 recitals = 4;
  int32 annexes = 5;
  int32 annex_items = 6;
  int32 article_recital_links = 7;
  int32 obligations = 8;
  int32 guidelines = 9;
  int32 enforcement_decisions = 10;
}

// IngestEvidenceRequest is one fetch and what it produced.
//
// # A FETCH THAT PRODUCED NOTHING IS STILL A FETCH
//
// `content_json` is empty when the outcome was not a success, and the request
// is still recorded. A log holding only successful fetches would be
// indistinguishable from a deployment where the policy gateway does nothing,
// and the rows that make a control visible to a customer are precisely the
// ones saying "we did not call that".
message IngestEvidenceRequest {
  // The organisation this was for. Required, and carried in the message rather
  // than a header for the reason RecordAgentRun's `org_id` is: this caller has
  // no active organisation and says so per call.
  //
  // NOT BELIEVED BECAUSE IT IS CONVENIENT. It is safe only because
  // `internal:ingest` is issued to service principals through client
  // credentials and never to a browser, so "the caller could name any
  // organisation" describes a component we ship rather than an input a person
  // controls. If that scope ever reaches something a customer can drive, this
  // becomes a tenancy hole.
  string org_id = 1;

  // Which connection produced it. Required even for a refusal, because "what
  // did it try to reach" is the question a refusal exists to answer.
  string connection_id = 2;

  // Which tool was called, or would have been.
  string tool = 3;

  // The arguments, after redaction, as JSON.
  string arguments_json = 4;

  // `succeeded`, `refused` or `failed`.
  //
  // THREE, AND THE MIDDLE ONE IS THE POINT. A refusal is what a working
  // control produces, not a kind of failure, and a vocabulary offering only
  // the two would push refusals into one of them and lose the distinction that
  // matters most for trust.
  string outcome = 5;

  // Why, when it was not a success. For a human to read, and required for a
  // refusal or a failure: a row that says neither what happened nor why tells
  // nobody anything.
  string detail = 6;

  // What the tool returned, as JSON, ALREADY REDACTED BY THE GATEWAY. Empty
  // when the outcome was not a success.
  //
  // A string rather than a Struct, for the same reason every other third-party
  // payload on this surface is one: it is data on its way to becoming a stored
  // observation, and a typed message would invite code that branches on a
  // customer's content.
  string content_json = 7;

  // How many values the redactor replaced. Zero says the redactor ran and
  // found nothing, which is a different statement from the field being absent.
  int32 redactions = 8;

  // When it was true at the source, and when the fetch was asked for. Both,
  // because they are routinely far apart and the gap is the interesting part:
  // a record last edited in March and first read by us in August is a
  // five-month blind spot that one timestamp would hide.
  google.protobuf.Timestamp observed_at = 9;
  google.protobuf.Timestamp requested_at = 10;
}

message IngestEvidenceResponse {
  // The stored observation's id, empty when the fetch produced none. A caller
  // that wants to reference what it learned has something to reference.
  string evidence_id = 1;
  // The stored fetch record's id, which is written whatever the outcome.
  string fetch_id = 2;
}
