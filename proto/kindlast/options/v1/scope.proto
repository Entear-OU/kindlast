syntax = "proto3";

package kindlast.options.v1;

import "google/protobuf/descriptor.proto";

// The required OAuth scope for an RPC, declared on the method itself.
//
// This exists so the scope table lives in the contract rather than in a map
// inside middleware (core-api-surface §1.3). A hand-maintained table drifts
// within a month: someone adds an RPC, forgets the table, and the method is
// reachable with any valid token. Declared here, the middleware reads the
// option off the method descriptor, and an RPC with no declared scope fails
// closed and fails a test.
//
// Field number 50001 sits in the 50000-99999 range protobuf reserves for
// internal use within an organisation, so it cannot collide with a public
// extension.
extend google.protobuf.MethodOptions {
  // The scope a caller's token must carry. Exactly one, because a method
  // requiring "any of these" is a method doing two jobs.
  //
  // Deliberately not optional in spirit: a method that omits it is rejected
  // by the reflection test rather than defaulting to something permissive.
  string required_scope = 50001;
}
