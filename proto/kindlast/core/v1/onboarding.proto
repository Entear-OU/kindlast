syntax = "proto3";

package kindlast.core.v1;

import "google/api/annotations.proto";
import "kindlast/core/v1/memory.proto";
import "kindlast/options/v1/scope.proto";

// The first conversation, and the organisation memory's first feeder
// (ENT-212, §2, §24 step 6, §26.5).
//
// # WHAT ONBOARDING PRODUCES, AND WHERE IT LANDS
//
// It produces facts, and they land in `org_profile_facts` with
// `source = 'onboarding'`, alongside every other thing the product believes
// about the organisation. There is no separate onboarding profile.
//
// That matters more than it sounds. ENT-228 built the memory so a customer can
// see what we believe, see where each value came from, correct it, and read the
// history of what it was before. A profile written into a parallel table would
// have none of that: onboarding answers would be the one part of what Kindlast
// knows that nobody could correct, which is precisely the part a customer is
// most likely to want to.
//
// `compliance_profiles` is still written, and it is a PROJECTION rather than a
// second source of truth. The Watcher's `run_watcher()` reads that table, in
// plpgsql, and moving that read is a piece of work with its own blast radius
// (ENT-225 owns the direction). Until it moves, a fact write refreshes the
// projection in the same transaction, so the two cannot disagree.
//
// # THE INTERVIEW IS TYPED AT THE POINT OF ANSWER, NOT EXTRACTED AFTERWARDS
//
// The legacy flow interviewed freely and then ran a second model pass over the
// transcript to extract a structured profile. That is the arrangement ENT-212
// names as the risk to design out: the profile decides which obligations apply,
// so a field value the model invented produces wrong findings later, at enough
// distance from the mistake that nobody traces it back.
//
// So the shape here is inverted. Every question names the fact it is asking
// about, every answer is parsed into that fact's declared kind by Go at the
// moment it is given, and an answer that does not parse is refused with a
// sentence rather than interpreted. Nothing reads the transcript afterwards to
// decide what was meant. A person who cannot or will not answer skips, and the
// fact is simply absent, which is what "left empty rather than guessed" means
// when it is a property of the code instead of an instruction in a prompt.
//
// # AND NOTHING IS BELIEVED UNTIL THE PERSON SAYS SO
//
// Answers live in `onboarding_messages` until `ConfirmProfile`. Before that
// call there is no fact, no profile row, and therefore nothing any finding can
// be reasoned from. The confirmation step is structural rather than a screen
// somebody could skip past.
//
// # THE §25 QUESTION, ANSWERED: THE STREAM PASSES THROUGH CORE-API
//
// §25 left open whether a token stream from the Analyst would go browser to
// core-api to Intelligence, or browser straight to Intelligence. It goes
// through core-api, and the reason is not latency.
//
// `AGENTS.md` is unambiguous that no user token reaches Intelligence: its
// audience is a different one, its scope is issued only to a machine principal,
// and it holds no tenancy GUCs, so it could not check whether the person
// streaming should see what it is processing. It also holds no database handle,
// so a browser-direct stream would produce a conversation nothing persisted:
// refresh the page and the interview is gone.
//
// core-api is the only writer here, and every turn below is a row before it is
// a response. Token streaming itself is not in this surface yet; see the
// package comment on the service implementation for what that costs and what
// it would take.
service OnboardingService {
  // Where this organisation has got to, without starting anything.
  //
  // A read that creates nothing, deliberately. Every authenticated route that
  // wants to know whether to route a person into onboarding asks this, and a
  // read that quietly opened a session would mean merely LOOKING at the console
  // started an interview.
  rpc GetOnboardingSession(GetOnboardingSessionRequest) returns (GetOnboardingSessionResponse) {
    option (kindlast.options.v1.required_scope) = "onboarding:read";
    option (google.api.http) = {get: "/api/v1/onboarding/session"};
  }

  // Open the interview, or resume the one already open.
  //
  // Idempotent by construction: an organisation with an unfinished session gets
  // that session back rather than a second one, so a refresh, a second tab and
  // a retry after a dropped connection all land in the same conversation.
  rpc StartOnboarding(StartOnboardingRequest) returns (StartOnboardingResponse) {
    option (kindlast.options.v1.required_scope) = "onboarding:write";
    option (google.api.http) = {
      post: "/api/v1/onboarding/session:start"
      body: "*"
    };
  }

  // Answer the question that was asked, or decline it.
  //
  // The key travels in the request rather than being inferred from position,
  // because a person may go back and change an earlier answer and because a
  // retry must not be able to attach an answer to a different question than the
  // one it was typed under.
  rpc AnswerQuestion(AnswerQuestionRequest) returns (AnswerQuestionResponse) {
    option (kindlast.options.v1.required_scope) = "onboarding:write";
    option (google.api.http) = {
      post: "/api/v1/onboarding/answers"
      body: "*"
    };
  }

  // Record what was said as what the organisation believes.
  //
  // This is the only call in this service that writes a fact. Until it is made,
  // the interview is a conversation and nothing else, which is how "the person
  // sees and confirms the profile before it drives anything" is enforced rather
  // than promised.
  //
  // Idempotent: confirming twice records the same values, and a value equal to
  // what is already believed writes no history row.
  rpc ConfirmProfile(ConfirmProfileRequest) returns (ConfirmProfileResponse) {
    option (kindlast.options.v1.required_scope) = "onboarding:write";
    option (google.api.http) = {
      post: "/api/v1/onboarding/session:confirm"
      body: "*"
    };
  }
}

// What shape an answer has to take.
//
// Carried to the client so a console can render the right control rather than
// guessing from the key, which would put the same table in two languages. It is
// the same pairing `memory.Kinds` enforces on the way in, so a client that
// renders a free-text box for a tri-state question produces an answer the
// server refuses rather than a value nobody can read.
enum AnswerShape {
  ANSWER_SHAPE_UNSPECIFIED = 0;
  ANSWER_SHAPE_TEXT = 1;
  ANSWER_SHAPE_LIST = 2;
  ANSWER_SHAPE_TRI_STATE = 3;
  ANSWER_SHAPE_NUMBER = 4;
}

// One question, as the person is asked it.
message Question {
  ProfileFactKey key = 1;

  // The question itself, in plain English.
  //
  // Written here rather than in the console, so the transcript a customer reads
  // back is the text they were actually asked. A prompt that lived only in the
  // browser would leave `onboarding_messages` holding answers to questions
  // nobody could reconstruct.
  string prompt = 2;

  AnswerShape shape = 3;

  // For a tri-state, the three answers. Empty otherwise.
  repeated string choices = 4;

  // A sentence under the question, when one helps. Never a legal term.
  string help = 5;
}

// One turn, as it is stored.
message OnboardingTurn {
  string id = 1;

  // `user` or `assistant`. The database constrains it to those two.
  string role = 2;

  // What was said. For a person's turn this is verbatim what they typed, kept
  // separately from the parsed value so a reader can check one against the
  // other.
  string content = 3;

  // Which fact this turn is about. Unspecified for a turn that is not part of
  // the question sequence.
  ProfileFactKey key = 4;

  // What we took the answer to mean. Absent on a question, and absent on an
  // answer that was a skip.
  FactValue value = 5;

  // True when the person declined the question. Distinct from an absent value
  // on a question turn, and distinct from an empty list, which is an answer.
  bool skipped = 6;

  string created_at = 7;

  // Which human said it. Onboarding is a person talking, and if two members of
  // one organisation both take part, each turn records who it was.
  string created_by = 8;
}

// The interview's state, which is the same message every call returns.
//
// One shape rather than four, because every one of these calls leaves the
// client needing exactly the same things: what has been said, what is being
// asked, what would be recorded, and whether it is finished. Four subtly
// different response bodies is how a console ends up with four renderers.
message OnboardingState {
  // Empty when this organisation has never started.
  string session_id = 1;

  // `in_progress`, `completed` or `abandoned`.
  string status = 2;

  repeated OnboardingTurn transcript = 3;

  // What to ask next. Absent once every applicable question has an answer or a
  // skip.
  Question next_question = 4;

  // What would be recorded if the person confirmed now, as typed values.
  //
  // Derived from the answers rather than stored, so it cannot drift from them,
  // and shown before anything is written because that is the whole of the
  // confirmation step.
  repeated DraftFact draft = 5;

  // True when there is nothing left to ask. A person may confirm before this,
  // and the facts they skipped are simply absent; the flag is what a console
  // uses to decide whether to nudge.
  bool ready_to_confirm = 6;

  // Whether this organisation has a compliance profile at all.
  //
  // The question every authenticated route actually asks. It is deliberately
  // not "is there a completed session": a profile could arrive another way, and
  // what decides whether the console has anything to show is the profile.
  bool profile_exists = 7;

  // How many questions there are, and how many have an answer or a skip. For a
  // progress line, so a person can see how long this is.
  int32 total_questions = 8;
  int32 answered_questions = 9;
}

// One value the interview would record.
message DraftFact {
  ProfileFactKey key = 1;
  FactValue value = 2;

  // Verbatim, what the person typed to produce it. Shown next to the parsed
  // value on the confirmation screen, because "we read this as a list of three
  // countries" is checkable and "United Kingdom, Ireland, Spain" alone is not.
  string answer = 3;
}

message GetOnboardingSessionRequest {}

message GetOnboardingSessionResponse {
  OnboardingState state = 1;
}

message StartOnboardingRequest {}

message StartOnboardingResponse {
  OnboardingState state = 1;

  // False when an unfinished session was resumed rather than opened.
  bool created = 2;
}

message AnswerQuestionRequest {
  ProfileFactKey key = 1;

  // What the person typed, verbatim. Parsed into the key's declared kind, and
  // refused with a sentence when it does not fit, because a server that
  // interprets a number out of "about fifty" has guessed.
  string answer = 2;

  // They would rather not say.
  //
  // A field rather than an empty answer, because the two mean different things
  // and only one of them is a decision: a blank box is a mistake to correct,
  // and a skip is a person declining, which leaves the fact absent on purpose.
  bool skip = 3;
}

message AnswerQuestionResponse {
  OnboardingState state = 1;
}

message ConfirmProfileRequest {}

message ConfirmProfileResponse {
  OnboardingState state = 1;

  // The `compliance_profiles` row the Watcher will read.
  string profile_id = 2;

  // What is now believed, as stored, with provenance. Returned rather than
  // assumed, so a console renders what the database holds.
  repeated ProfileFact facts = 3;
}
