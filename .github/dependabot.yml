# Dependabot, told which package manager this repository actually uses.
#
# WHY THIS FILE EXISTS, AND WHAT HAPPENED WITHOUT IT
#
# There was no configuration here, so Dependabot's automatic security updates
# detected `package.json` and inferred the `npm_and_yarn` ecosystem. That
# ecosystem does not know about `bun.lock`, so PR #199 bumped `next` in the
# manifest and left the lockfile untouched. Every job that runs
# `bun install --frozen-lockfile` then failed on main with:
#
#     error: lockfile had changes, but lockfile is frozen
#
# The bump itself was wanted, and it was a security update. The breakage was
# purely that the manifest and the lockfile stopped agreeing, which is exactly
# the property AGENTS.md asks a human to preserve ("commit the manifest and the
# lockfile in the same commit, or the next person's install resolves something
# different from yours"). An automated contributor has to be told the same rule,
# and the way to tell it is the ecosystem name.
#
# `bun` rather than `npm_and_yarn`, so updates carry `bun.lock` with them.
version: 2

updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    # Grouped, because this is a Bun workspace: a bump that touches the root
    # and a workspace separately would produce two PRs whose lockfiles conflict
    # with each other, and the second would need a rebase to be mergeable.
    groups:
      # The lint toolchain moves as its own pull request, and it is listed
      # FIRST because Dependabot assigns a dependency to the first group whose
      # patterns match.
      #
      # WHY IT IS SEPARATE, FROM TWO CONSECUTIVE FAILURES RATHER THAN A
      # PREFERENCE
      #
      # #207 carried nineteen updates and died on TypeScript 7.0, which
      # `typescript-eslint` cannot load. Holding that one major produced #217
      # with eighteen, which died on a different pair:
      #
      #     TypeError: Error while loading rule 'react/display-name':
      #     contextOrFilename.getFilename is not a function
      #
      # That is `eslint-plugin-react` against a newer ESLint API. Two runs, two
      # incompatibilities, both inside the lint toolchain and neither anywhere
      # near the code the product runs.
      #
      # This ecosystem is mid-migration and will keep doing that, so it gets a
      # pull request that is allowed to sit red without holding back the
      # dependencies the product actually runs on. Chasing each break one
      # `ignore` entry at a time is how the config becomes a list of
      # workarounds nobody dares remove.
      lint-toolchain:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "prettier"
          - "prettier-*"
      javascript:
        patterns: ["*"]
    open-pull-requests-limit: 5
    ignore:
      # TypeScript majors are held, and the grouping above is why this is
      # needed rather than optional.
      #
      # The first grouped run raised #207 with nineteen updates, one of which
      # was TypeScript 7.0. `typescript-eslint` does not support it yet and
      # fails to load at all:
      #
      #     Error: typescript-eslint does not support TS 7.0.
      #
      # So `bun run lint` exits 2 and the whole group is unmergeable. That is
      # the cost of grouping: one incompatible package holds the other eighteen
      # hostage, where ungrouped they would land and it alone would sit red.
      #
      # Grouping is still right for this repository, because it is a Bun
      # workspace and separate bumps produce lockfiles that conflict with each
      # other. Holding the one package that breaks is the cheaper half of the
      # trade.
      #
      # Minor and patch TypeScript updates still come through. Remove this
      # entry when `typescript-eslint` supports 7.x, which is the only thing
      # blocking it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "gomod"
    directory: "/apps/core-api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/apps/workers"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/libs/chassis"
    schedule:
      interval: "weekly"

  # gen/go is generated and committed, and its runtime library version is a
  # matched pair with the codegen plugin in buf.gen.yaml. Bumping one without
  # the other produces generated code that expects a different runtime, so this
  # module is deliberately left out: it moves when somebody re-runs
  # `buf generate`, not when a bot raises a patch.

  - package-ecosystem: "uv"
    directory: "/apps/intelligence"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
