name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Same-repo PRs only.
    #
    # GitHub deliberately withholds secrets from workflow runs triggered by a
    # forked pull_request, so on an external contribution
    # CLAUDE_CODE_OAUTH_TOKEN below resolves to an empty string and the action
    # fails with an opaque auth error. Skipping is honest; failing on every
    # external PR is noise that teaches contributors to ignore red checks.
    #
    # The tempting fix is pull_request_target, which does get secrets. Do not
    # do that here. It runs in the context of the base repository with a
    # write-capable token while checking out untrusted PR code, and is the
    # single most common way public repositories get compromised. External
    # PRs get human review instead.
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

