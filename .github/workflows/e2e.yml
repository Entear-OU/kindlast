name: Browser end to end

# The browser suite, as a job somebody else's workflow calls (ENT-264).
#
# WHY IT IS A REUSABLE WORKFLOW RATHER THAN A JOB IN ci.yml
#
# Because it is called twice, and the two callers must not drift. `ci.yml`
# calls it on every pull request; `nightly.yml` calls it once a day against
# main. Written as two jobs, the second copy is the one that rots: it is edited
# less often, nobody reads it on a green day, and the day it matters it is
# booting a stack that stopped resembling the one under test.
#
# WHAT IT COSTS, SINCE THAT IS THE THING WORTH DECIDING WITH A NUMBER
#
# The browser suite itself is under a minute: eleven tests, measured at 33 to
# 55 seconds over repeated local runs against the containerised console. The
# job around it is dominated entirely by building and booting the stack, which
# is the same cost the `stack` and `airgap` jobs in ci.yml already pay, and it
# runs in parallel with them rather than after.
#
# So the suite is cheap and the stack is not, which is the argument for the
# `specs` input existing: adding a spec to a job that is already paying for a
# stack costs seconds, and the interesting question is never "can we afford
# another spec" but "does this one pass".

on:
  workflow_call:
    inputs:
      specs:
        description: >
          Space-separated spec files under apps/web/e2e, e.g.
          "auth.spec.ts journey.spec.ts". Every one named must produce at
          least one executed test or the job fails.
        required: true
        type: string

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ inputs.specs }}
    runs-on: ubuntu-latest
    # Generous, because the stack is built from source here. It is a ceiling
    # that turns a hung browser into a failure rather than a six-hour run, not
    # a budget anybody should be spending.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned, matching every other job in this repository.
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The browser, at the version the lockfile pins for @playwright/test.
      #
      # Through the workspace rather than `bunx playwright`, for the reason the
      # `unit` job uses `bun run typecheck` rather than `bunx tsc`: bunx
      # resolves from the registry when the binary is not linked at the root,
      # and a browser build that does not match the client library is a class
      # of failure nobody enjoys reading a stack trace for.
      #
      # `--with-deps` installs the system libraries Chromium needs. On a GitHub
      # runner most are already present; naming them is still cheaper than the
      # afternoon spent on a missing libnss3.
      - name: Install the pinned browser
        run: bun run test:e2e:install

      # The stack, the same way the `stack` job boots it, and for the same
      # stated reason: a suite that is allowed to skip when its dependencies
      # are missing reports nothing on a green run, so the job boots them and
      # fails loudly when it cannot.
      #
      # No `--profile model`. Nothing the browser drives calls a model, and
      # gigabytes of weights would double this job's wall clock to exercise
      # nothing.
      - name: Start the kindlast stack
        run: docker compose -f deploy/compose.yaml up -d

      - name: Wait for the seed job to finish
        run: |
          for _ in $(seq 1 90); do
            status="$(docker inspect kindlast-seed --format '{{.State.Status}}' 2>/dev/null || echo missing)"
            if [ "$status" = "exited" ]; then
              exit_code="$(docker inspect kindlast-seed --format '{{.State.ExitCode}}')"
              echo "seed exited with ${exit_code}"
              exit "$exit_code"
            fi
            sleep 2
          done
          echo "seed job did not finish in time"
          docker compose -f deploy/compose.yaml logs seed --tail 100 || true
          exit 1

      # THE CONSOLE, NOT THE DEV SERVER. `edge` waits on `web` being healthy
      # before it starts, so an edge that answers is a production Next build
      # that answers. That is the artefact a self-hoster runs, and the reason
      # this job points the suite at port 8000 rather than letting Playwright
      # start `bun run dev`.
      #
      # `up -d` returns once containers are created, and a cold Caddy in front
      # of a booting console is a 502 rather than an error, so this polls.
      - name: Wait for the console behind the edge
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS -m 5 http://localhost:8000/healthz >/dev/null 2>&1; then
              echo "the console is answering behind the edge"; exit 0
            fi
            sleep 2
          done
          echo "the console never answered behind the edge" >&2
          docker compose -f deploy/compose.yaml logs edge web core-api --tail 100 || true
          exit 1

      # THIS IS THE STEP THAT CANNOT BE GREEN WITHOUT HAVING TESTED SOMETHING.
      #
      # `scripts/e2e-check.sh` brackets the Playwright run: it refuses to guess
      # a console URL (so the dev server can never be what got tested), it
      # proves the console and the identity provider answer before a browser
      # starts, and afterwards it reads the JSON report and fails on an empty
      # run, on a spec file that produced no test, and on any skip at all. Its
      # header documents each of the three and they were induced on purpose
      # before this merged.
      #
      # KINDLAST_WEB_URL is what playwright.config.ts reads for `baseURL` and
      # what tells it a console is already running. A CI job with the compose
      # stack up is exactly the case that flag exists for.
      #
      # The spec list arrives through the environment rather than interpolated
      # into the command. It comes from a workflow file in this repository and
      # never from an event payload, so this is not a live injection hole; it
      # is the habit that stops one appearing the day somebody wires a
      # `workflow_dispatch` input to it. Unquoted on purpose, because the whole
      # point is that a space-separated list becomes several arguments.
      - name: Browser suite against the production console
        env:
          KINDLAST_WEB_URL: http://localhost:8000
          KINDLAST_AUTH_URL: http://localhost:8300
          SPECS: ${{ inputs.specs }}
        # shellcheck disable=SC2086
        run: ./scripts/e2e-check.sh $SPECS

      # A failing auth test is usually a redirect landing somewhere
      # unexpected, and playwright.config.ts keeps a trace for exactly that.
      # A trace nobody can download is a trace that does not exist, so it is
      # uploaded rather than left in the runner's filesystem.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/e2e-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --tail 100

      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose.yaml down -v
