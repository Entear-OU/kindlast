name: CI

# Three jobs that run in parallel (ENT-153, ENT-192), so wall-clock is the
# slowest of them rather than their sum:
#
#   1. `unit` — lint, typecheck, and the unit/component suite. No services, so a
#      unit regression fails fast and is never entangled with a stack boot.
#   2. `stack`: the self-managed compose stack (deploy/compose.yaml) plus
#      the database isolation suite (db/tests/), which is the RLS security
#      boundary check for the organisation tenancy model.
#   3. `go`: proto codegen drift and the Go suites.
#
# The Supabase integration job was removed with the suite it ran (ENT-200).
# What it protected is worth restating, because the property has to be kept as
# each surface is rebuilt on core-api: a suite that self-skips when its stack
# is unreachable proves nothing on a green run, so the job booted the stack and
# failed loudly if it could not. `stack` does exactly that for the compose
# stack today. Any rebuilt integration coverage must boot its dependencies the
# same way rather than skipping quietly.
#
# All jobs are required for the workflow to conclude `success`, so the
# auto-merge workflow (gated on the whole CI run) waits for every one.
#
# Fork safety: this workflow is safe to run on pull requests from forks and is
# meant to. It reads no secrets, holds only `contents: read`, and every step
# operates on the checked-out tree rather than on PR metadata. The stacks it
# boots need no credentials, so external contributions get the same signal
# maintainers do. Keep it that way: adding a secret to this workflow would
# silently break CI for every external PR, since GitHub withholds secrets from
# forked runs.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned rather than `latest`: an installer that silently changes
          # under CI is the one tool you never want moving on its own.
          bun-version: 1.3.14

      # Node is still required. Bun is the installer and task runner here, but
      # Next.js builds and Vitest both run on Node, so the toolchain needs both.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # `bun run typecheck`, not `bunx tsc`. bunx resolves a compiler from the
      # registry when the binary is not linked at the root, so CI silently ran
      # a newer TypeScript than the pinned one and failed on a stricter
      # default. Going through the workspace script uses the version in the
      # lockfile, which is the one developers run locally.
      - name: Typecheck
        run: bun run typecheck

      # `bun run test:unit`, never `bun test`. The latter is Bun's own runner;
      # this repo's suite is Vitest, and `bun test` would collect none of it and
      # still exit 0.
      - name: Unit tests
        run: bun run test:unit

  go:
    name: Proto codegen & Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so `buf breaking` below can resolve main from the
          # local clone. Comparing against the remote URL would need
          # credentials for a private repository; comparing against `.git`
          # needs only the objects, and a shallow clone does not have them.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # Pinned, for the same reason the Bun version is pinned above: a codegen
      # toolchain that moves on its own produces a diff nobody asked for, in a
      # directory nobody reads carefully.
      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.72.0

      - name: Lint protos
        run: buf lint

      # The merge gate ENT-199 adds, and the reason it exists now rather than
      # when a stranger first integrates: a field removed or a tag reused is
      # free to fix today and an external breaking change the moment anyone
      # depends on it. Policy in proto/EVOLUTION.md.
      #
      # `ref=refs/remotes/origin/main`, not `branch=main`, and the difference
      # is not cosmetic. On a pull request actions/checkout leaves the PR
      # branch checked out and main present only as a remote-tracking ref, so
      # asking for a *branch* named main fails with "couldn't find remote ref
      # main". Reproduced by cloning this repo and deleting the local main,
      # because testing it in a normal clone proves nothing: a developer's
      # clone has refs/heads/main and CI does not.
      #
      # The explicit fetch guarantees the ref exists rather than depending on
      # what actions/checkout happens to populate.
      #
      # On a push to main this compares main against itself, which is a no-op
      # rather than a special case worth branching on.
      - name: Check for breaking proto changes
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          buf breaking --against '.git#ref=refs/remotes/origin/main'

      # gen/ is committed so a reviewer reads the same bytes the build uses.
      # That only holds if CI notices when the two diverge, hence regenerating
      # and failing on any diff rather than trusting the author to have run it.
      - name: Check generated code is in sync
        run: |
          buf generate
          git diff --exit-code -- gen/ \
            || { echo "gen/ is out of date; run 'buf generate' and commit"; exit 1; }

      - name: Build and test every module
        run: |
          for module in apps/core-api libs/chassis gen/go; do
            echo "== $module"
            (cd "$module" && go build ./... && go test ./...)
          done

      # Service boundaries enforced by the build rather than by review habit
      # (core-api-surface §21.4). Boundaries policed only by reviewers erode in
      # weeks, and the erosion is invisible until two services cannot be
      # deployed independently.
      - name: Check service boundaries
        run: |
          if grep -rn "gen/go/kindlast/core" libs/chassis --include='*.go'; then
            echo "libs/chassis must not import core business types"
            exit 1
          fi
          if [ -d apps/workers ] \
             && grep -rn "apps/core-api" apps/workers --include='*.go'; then
            echo "apps/workers must not import apps/core-api"
            exit 1
          fi

  stack:
    name: Compose stack & isolation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The new self-managed stack (ENT-192): postgres-app with the role
      # split, the goose migration job, Zitadel, redis and the edge. This is
      # the stack the db test suite runs against, and the suite is the RLS
      # security boundary check. Mirroring the Supabase job above, the job
      # boots the stack and fails loudly if it does not come up, rather than
      # letting the suite silently skip.
      - name: Start the kindlast stack
        run: docker compose -f deploy/compose.yaml up -d

      - name: Wait for the seed job to finish
        run: |
          for i in $(seq 1 90); do
            status="$(docker inspect kindlast-seed --format '{{.State.Status}}' 2>/dev/null || echo missing)"
            if [ "$status" = "exited" ]; then
              exit_code="$(docker inspect kindlast-seed --format '{{.State.ExitCode}}')"
              echo "seed exited with ${exit_code}"
              exit "$exit_code"
            fi
            sleep 2
          done
          echo "seed job did not finish in time"
          exit 1

      # Guard: a healthy stack means migrations applied by the job container
      # and Zitadel serving OIDC discovery (the ENT-192 acceptance criteria).
      - name: Verify the stack is reachable
        run: |
          curl --fail --silent --show-error \
            http://localhost:8300/.well-known/openid-configuration > /dev/null
          curl --fail --silent --show-error http://localhost:8000/healthz > /dev/null

      - name: Database isolation tests
        run: bun run test:db

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # The Go suites that need real infrastructure: the interceptor chain
      # against a real Postgres and Redis, and tenancy proved as two users
      # (core-api-surface §13.3). They self-skip when the stack is unreachable,
      # which is right on a laptop and wrong here, so KINDLAST_REQUIRE_STACK
      # turns the skip into a failure. Without it a green run could mean the
      # security boundary was never exercised.
      - name: Go tests that need the stack
        env:
          KINDLAST_REQUIRE_STACK: "1"
        run: |
          for module in apps/core-api libs/chassis; do
            echo "== $module"
            (cd "$module" && go test ./...)
          done

      # core-api is reachable only on the compose network today, and this
      # asserts that rather than trusting a missing `ports` stanza nobody
      # reads. It is a check on the current phase, not on the architecture:
      # web, mobile and third parties are all intended clients, and build-order
      # step 7b opens this surface deliberately. When that lands, this
      # assertion is expected to change with it.
      - name: core-api publishes no port, and still answers internally
        run: |
          published="$(docker inspect kindlast-core-api --format '{{json .NetworkSettings.Ports}}')"
          if [ "$published" != "{}" ] && [ "$published" != "null" ]; then
            echo "core-api publishes ports, and must not: $published"
            exit 1
          fi
          docker run --rm --network kindlast_default curlimages/curl:8.11.1 \
            --fail --silent --show-error http://core-api:8080/healthz

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --tail 100

      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose.yaml down -v
