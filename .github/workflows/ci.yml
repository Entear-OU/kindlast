name: CI

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  test-go:
    name: Test Go services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, rag]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Download deps
        run: go mod download
        working-directory: services/${{ matrix.service }}

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: services/${{ matrix.service }}
          version: latest

      - name: Test
        run: go test ./... -race -coverprofile=coverage.out
        working-directory: services/${{ matrix.service }}

      - name: Coverage check
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "Coverage $COVERAGE% below 70% threshold"
            exit 1
          fi
        working-directory: services/${{ matrix.service }}

  test-python:
    name: Test Python ingestion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt pytest pytest-cov ruff
        working-directory: services/ingestion

      - name: Lint
        run: uv run ruff check src/
        working-directory: services/ingestion

      - name: Test
        run: uv run pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=70
        working-directory: services/ingestion

  test-client:
    name: Test Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: client

      - name: Type check
        run: pnpm exec tsc --noEmit
        working-directory: client

      - name: Lint
        run: pnpm lint
        working-directory: client

      - name: Test
        run: pnpm test
        working-directory: client

      - name: Build
        run: pnpm build
        working-directory: client

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [test-go, test-python, test-client]
    strategy:
      matrix:
        include:
          - service: gateway
            dockerfile: infrastructure/docker/gateway.Dockerfile
          - service: rag
            dockerfile: infrastructure/docker/rag.Dockerfile
          - service: ingestion
            dockerfile: infrastructure/docker/ingestion.Dockerfile
          - service: frontend
            dockerfile: infrastructure/docker/frontend.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: kindlast/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Security scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: kindlast/${{ matrix.service }}:${{ github.sha }}
          only-severities: critical
          exit-code: true
