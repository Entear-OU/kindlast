name: CI

# Two jobs that run in parallel (ENT-153), so wall-clock is the slower of the
# two rather than their sum:
#
#   1. `unit` — lint, typecheck, and the unit/component suite. No services, so a
#      unit regression fails fast and is never entangled with — or skipped
#      because of — the Supabase stack.
#   2. `integration` — the integration suite (tests/integration/) against a
#      booted Supabase stack.
#
# The integration suites self-skip when the local stack is unreachable
# (describe.skipIf(isLocalSupabaseReachable)), so the integration job boots
# Supabase and fails loudly if it isn't reachable — integration coverage can
# never silently disappear. Keeping the two as separate jobs also guarantees the
# unit tests always run and must pass, even if the Supabase setup later fails.
#
# Both jobs are required for the workflow to conclude `success`, so the
# auto-merge workflow (gated on the whole CI run) still waits for both.
#
# Fork safety: this workflow is safe to run on pull requests from forks and is
# meant to. It reads no secrets, holds only `contents: read`, and every step
# operates on the checked-out tree rather than on PR metadata. The local
# Supabase stack the integration job boots needs no credentials, so external
# contributions get the same signal maintainers do. Keep it that way: adding a
# secret to this workflow would silently break CI for every external PR, since
# GitHub withholds secrets from forked runs.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # Match local dev: the repo's pnpm-workspace.yaml uses the pnpm 10+
          # `allowBuilds` field, which pnpm 9 rejects ("packages field missing").
          version: 11.1.3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13 (and uses node:sqlite); local dev runs
          # Node 24, so 22 LTS is the safe CI floor.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Boots only the containers the integration suite needs — Postgres + Auth
      # + PostgREST + Kong on the default local ports (54321/54322), applying
      # every migration in supabase/migrations. The excluded containers (Studio,
      # Storage, Realtime, Edge Runtime/Functions, imgproxy, Vector, Analytics,
      # Inbucket, postgres-meta) are unused by the tests and shave the slowest
      # step (`supabase start`) by skipping their image pulls + health checks.
      - name: Start Supabase
        run: >
          supabase start
          -x studio,imgproxy,storage,realtime,edge-runtime,functions,vector,analytics,inbucket,meta

      # Guard: if the stack didn't come up, fail here rather than let the
      # integration suites silently skip and the run pass green. Mirrors
      # isLocalSupabaseReachable() in tests/integration/helpers/supabase.ts.
      - name: Verify Supabase is reachable
        env:
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
        run: |
          curl --fail --silent --show-error \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            http://127.0.0.1:54321/auth/v1/health

      - name: Integration tests
        run: pnpm test:integration

      - name: Stop Supabase
        if: always()
        run: supabase stop
