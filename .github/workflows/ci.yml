name: CI

# Lint, typecheck, and the full Vitest suite — including the Supabase-backed
# integration tests. Those suites self-skip when the local stack is unreachable
# (describe.skipIf(isLocalSupabaseReachable)), so without a running stack CI
# would go green having executed none of them. This workflow boots Supabase and
# fails loudly if it isn't reachable, so integration coverage can never silently
# disappear again.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # Match local dev: the repo's pnpm-workspace.yaml uses the pnpm 10+
          # `allowBuilds` field, which pnpm 9 rejects ("packages field missing").
          version: 11.1.3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # Boots Postgres + Auth + PostgREST + Kong on the default local ports
      # (54321/54322) and applies every migration in supabase/migrations — the
      # same stack the integration helpers expect (well-known local keys).
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      # Guard: if the stack didn't come up, fail here rather than let the
      # integration suites silently skip and the run pass green. Mirrors
      # isLocalSupabaseReachable() in tests/integration/helpers/supabase.ts.
      - name: Verify Supabase is reachable
        env:
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
        run: |
          curl --fail --silent --show-error \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            http://127.0.0.1:54321/auth/v1/health

      - name: Test
        run: pnpm test

      - name: Stop Supabase
        if: always()
        run: supabase stop
