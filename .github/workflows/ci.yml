name: CI

# Lint, typecheck, then tests in two gates:
#
#   1. Unit/component tests (pnpm test:unit, everything under __tests__/) run
#      first and need no services, so a unit regression fails CI fast and is
#      never entangled with — or skipped because of — the Supabase stack.
#   2. Integration tests (pnpm test:integration, tests/integration/) run after
#      booting Supabase.
#
# The integration suites self-skip when the local stack is unreachable
# (describe.skipIf(isLocalSupabaseReachable)), so this workflow boots Supabase
# and fails loudly if it isn't reachable — integration coverage can never
# silently disappear. Splitting the steps also guarantees the unit tests always
# run and must pass, even if the Supabase setup later fails.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # Match local dev: the repo's pnpm-workspace.yaml uses the pnpm 10+
          # `allowBuilds` field, which pnpm 9 rejects ("packages field missing").
          version: 11.1.3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13 (and uses node:sqlite); local dev runs
          # Node 24, so 22 LTS is the safe CI floor.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # Unit/component tests first — no services required, so this gate always
      # runs and must pass regardless of whether the Supabase stack comes up.
      - name: Unit tests
        run: pnpm test:unit

      # Boots Postgres + Auth + PostgREST + Kong on the default local ports
      # (54321/54322) and applies every migration in supabase/migrations — the
      # same stack the integration helpers expect (well-known local keys).
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      # Guard: if the stack didn't come up, fail here rather than let the
      # integration suites silently skip and the run pass green. Mirrors
      # isLocalSupabaseReachable() in tests/integration/helpers/supabase.ts.
      - name: Verify Supabase is reachable
        env:
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
        run: |
          curl --fail --silent --show-error \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            http://127.0.0.1:54321/auth/v1/health

      - name: Integration tests
        run: pnpm test:integration

      - name: Stop Supabase
        if: always()
        run: supabase stop
