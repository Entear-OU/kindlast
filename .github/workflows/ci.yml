name: CI

# Three jobs that run in parallel (ENT-153, ENT-192), so wall-clock is the
# slowest of them rather than their sum:
#
#   1. `unit` — formatting, lint, typecheck, and the unit/component suite. No
#      services, so a unit regression fails fast and is never entangled with a
#      stack boot.
#   2. `stack`: the self-managed compose stack (deploy/compose.yaml) plus
#      the database isolation suite (db/tests/), which is the RLS security
#      boundary check for the organisation tenancy model.
#   3. `go`: proto codegen drift, golangci-lint, and the Go suites.
#
# Formatting is checked in both language jobs rather than in a fourth job of
# its own (ENT-214). A separate job would pay a fresh checkout and toolchain
# setup to run something that takes seconds, and would report formatting as a
# thing apart from the code it formats.
#
# The Supabase integration job was removed with the suite it ran (ENT-200).
# What it protected is worth restating, because the property has to be kept as
# each surface is rebuilt on core-api: a suite that self-skips when its stack
# is unreachable proves nothing on a green run, so the job booted the stack and
# failed loudly if it could not. `stack` does exactly that for the compose
# stack today. Any rebuilt integration coverage must boot its dependencies the
# same way rather than skipping quietly.
#
# All jobs are required for the workflow to conclude `success`, so the
# auto-merge workflow (gated on the whole CI run) waits for every one.
#
# Fork safety: this workflow is safe to run on pull requests from forks and is
# meant to. It reads no secrets, holds only `contents: read`, and every step
# operates on the checked-out tree rather than on PR metadata. The stacks it
# boots need no credentials, so external contributions get the same signal
# maintainers do. Keep it that way: adding a secret to this workflow would
# silently break CI for every external PR, since GitHub withholds secrets from
# forked runs.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned rather than `latest`: an installer that silently changes
          # under CI is the one tool you never want moving on its own.
          bun-version: 1.3.14

      # Node is still required. Bun is the installer and task runner here, but
      # Next.js builds and Vitest both run on Node, so the toolchain needs both.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cheaper than any of the checks below and it fails for a reason nobody
      # would guess from a diff: one version for the whole product, copied into
      # the manifests, and a copy nobody checks is one that drifts.
      - name: Version check
        run: bun run version:check

      # First of the code checks, because it is the cheapest thing that can
      # fail and the easiest to fix: `bun run format` and commit. Prettier's
      # version is pinned in the lockfile, so this checks the same bytes a
      # contributor's editor produces rather than whatever the registry offers
      # today.
      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      # `bun run typecheck`, not `bunx tsc`. bunx resolves a compiler from the
      # registry when the binary is not linked at the root, so CI silently ran
      # a newer TypeScript than the pinned one and failed on a stricter
      # default. Going through the workspace script uses the version in the
      # lockfile, which is the one developers run locally.
      - name: Typecheck
        run: bun run typecheck

      # `bun run test:unit`, never `bun test`. The latter is Bun's own runner;
      # this repo's suite is Vitest, and `bun test` would collect none of it and
      # still exit 0.
      - name: Unit tests
        run: bun run test:unit

  model:
    name: Local model service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # THE DIGEST IS THE CACHE KEY, WHICH IS THE WHOLE TRICK.
      #
      # A cache keyed by a branch or a lockfile would serve stale weights when
      # the pin changes, and the checksum below would then fail confusingly. A
      # cache keyed by the digest cannot: a different pin is a different key,
      # which misses, which fetches. The bytes under a given key are the only
      # bytes that key can ever name.
      #
      # This also turns the §25 fetch-versus-pin tension into its most
      # defensible form. On a hit, `model-init` takes the fast path it already
      # proves in its tests, verifies a file that is already present, and never
      # opens a socket. CI is then exercising the airgapped path on nearly
      # every run, which is the path a real deployment cares about most.
      - name: Restore the model
        uses: actions/cache@v4
        with:
          path: deploy/models
          key: gguf-aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223

      # 2b, not the 4b default: 1.2 GB rather than 2.7 GB, and the mechanism
      # under test is tier-independent. Only the filename and digest differ.
      - name: Start the model
        run: |
          docker compose -f deploy/compose.yaml --profile model up -d model
        env:
          KINDLAST_MODEL_TIER: 2b
          KINDLAST_MODEL_CTX: "4096"

      # `up -d` returns once the container is started, not once the weights are
      # loaded, so waiting on the healthcheck is waiting on a model that can
      # actually answer.
      - name: Wait for it to be healthy
        run: |
          for _ in $(seq 1 120); do
            if curl -fsS -m 3 http://localhost:8081/health >/dev/null 2>&1; then
              echo "model healthy"; exit 0
            fi
            sleep 5
          done
          echo "model never became healthy" >&2
          docker compose -f deploy/compose.yaml logs model || true
          exit 1

      # ENT-235's acceptance criterion, enforced rather than described. Asserts
      # the shape only: the model is free to be wrong about the content, which
      # it demonstrably is, and catching that is the citation validator's job
      # rather than this one's (§26.3).
      - name: Structured output returns schema-valid JSON
        run: python3 scripts/model-smoke.py

      - name: Stop
        if: always()
        run: docker compose -f deploy/compose.yaml --profile model down

  intelligence:
    name: Intelligence (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, for the same reason Bun, Go and buf are pinned above: a
      # toolchain that moves on its own changes what the tests below are
      # actually asserting, and the assertions here are security properties.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"

      - name: Install dependencies
        run: uv sync --locked
        working-directory: apps/intelligence

      # THIS JOB MUST FAIL RATHER THAN SKIP, and it can, because it needs
      # nothing but a Python interpreter. The token battery runs a real
      # authorization server on localhost and signs real tokens, so unlike
      # test:db it has no stack to be unreachable and no reason to self-skip.
      #
      # What it asserts is the whole of this service's authority: that a user
      # token cannot reach it, that a token for the other resource server
      # cannot replay against it, that the algorithm allow-list holds only
      # asymmetric algorithms, and that no database driver has appeared in its
      # dependencies. Every one of those was verified able to fail by being
      # broken on purpose.
      - name: Token battery and service invariants
        run: uv run pytest -q
        working-directory: apps/intelligence

      # THE HARNESS EVALS (ENT-229), AND WHY THEY ARE A STEP RATHER THAN A JOB.
      #
      # A separate job would pay a fresh checkout and a uv install to run
      # something that takes under a second, which is the same argument this
      # file already makes about not giving formatting a job of its own.
      #
      # The gate needs no model, and that is deliberate rather than a
      # simplification. It replays recorded responses through the real
      # `draft_narrative`, so it measures the HARNESS: whether a fabricated
      # citation is still refused, whether a spent budget still stops the run,
      # whether what a customer typed still arrives as data rather than as
      # instruction. A gate that called a live 2B would be measuring the model's
      # knowledge instead, would be flaky by design, and would go red for a
      # reason that is the citation validator's job to catch rather than CI's.
      #
      # It exits non-zero on two different things: a guardrail that stopped
      # firing (no threshold, that is a bug) and an aggregate that moved against
      # the committed baseline (a threshold, in evals/baseline.json). The report
      # with the absolute scores and the weak-versus-strong delta is written to
      # the run summary as well as the log, so the numbers are on the run page
      # rather than fifty lines into a job nobody opens on a green build.
      - name: Harness evals
        run: uv run python -m kindlast_intelligence.evals.gate
        working-directory: apps/intelligence

  intelligence-e2e:
    name: Intelligence end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same digest-as-key cache as the `model` job above, and the same 2b
      # tier, so the two jobs share the restore rather than each paying for a
      # download. The comment there explains why the digest is the key.
      - name: Restore the model
        uses: actions/cache@v4
        with:
          path: deploy/models
          key: gguf-aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223

      # THE WHOLE STACK, because the thing under test is what only appears when
      # these are separate processes on a real network. Every one of the five
      # failures ENT-218 hit at this step passed the unit suite first: the
      # split horizon applying to three URLs rather than one, Zitadel routing
      # by Host, a name collision with `model-init`'s digest. None is reachable
      # in-process, and none would have been caught by a job that mocked the
      # neighbours.
      - name: Start the stack with the model profile
        run: docker compose -f deploy/compose.yaml --profile model up -d
        env:
          KINDLAST_MODEL_TIER: 2b
          KINDLAST_MODEL_CTX: "4096"
          KINDLAST_MODEL_NAME: Qwen3.5-2B-Q4_K_M
          KINDLAST_MODEL_VERSION: aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223

      - name: Wait for the seed job to finish
        run: |
          for _ in $(seq 1 90); do
            status="$(docker inspect kindlast-seed --format '{{.State.Status}}' 2>/dev/null || echo missing)"
            if [ "$status" = "exited" ]; then
              exit_code="$(docker inspect kindlast-seed --format '{{.State.ExitCode}}')"
              echo "seed exited with ${exit_code}"
              exit "$exit_code"
            fi
            sleep 2
          done
          echo "seed job did not finish in time"
          exit 1

      # `up -d` returns once containers are started, not once llama.cpp has the
      # weights loaded, and intelligence answers before the model behind it
      # can. Waiting on both is waiting on a stack that can actually serve a
      # request.
      - name: Wait for the model and the service
        run: |
          for _ in $(seq 1 120); do
            if curl -fsS -m 3 http://localhost:8081/health >/dev/null 2>&1; then
              echo "model healthy"; break
            fi
            sleep 5
          done
          for _ in $(seq 1 60); do
            if docker logs kindlast-intelligence 2>&1 | grep -q "intelligence listening"; then
              echo "intelligence listening"; exit 0
            fi
            sleep 2
          done
          echo "intelligence never started listening" >&2
          docker compose -f deploy/compose.yaml logs intelligence model || true
          exit 1

      # ENT-218's last acceptance criterion. It asserts the harness worked and
      # deliberately not that the run succeeded: on a 2B a refused citation is
      # the guardrail doing its job, and a gate demanding SUCCEEDED would go red
      # for the one reason it should stay green. The script's docstring carries
      # the full argument.
      #
      # THIS JOB MUST FAIL RATHER THAN SKIP. There is no reachability check to
      # fall back on: if the stack is not up, the steps above have already
      # failed, which is the property `test:db`'s self-skip costs on a laptop
      # and CI must not repeat.
      - name: Draft a narrative end to end
        run: python3 scripts/intelligence-smoke.py

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml --profile model logs --tail 100

      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose.yaml --profile model down -v

  go:
    name: Proto codegen & Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so `buf breaking` below can resolve main from the
          # local clone. Comparing against the remote URL would need
          # credentials for a private repository; comparing against `.git`
          # needs only the objects, and a shallow clone does not have them.
          fetch-depth: 0

      # Matches go.work and the `stack` job below. It said 1.24 until ENT-214,
      # which worked only because the go command silently downloaded a newer
      # toolchain to satisfy go.work's `go 1.25.0` on every run. Two Go
      # versions in one workflow is a bad footing for a linter, whose findings
      # depend on the language version it parses with.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # Pinned, for the same reason the Bun version is pinned above: a codegen
      # toolchain that moves on its own produces a diff nobody asked for, in a
      # directory nobody reads carefully.
      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.72.0

      - name: Lint protos
        run: buf lint

      # The merge gate ENT-199 adds, and the reason it exists now rather than
      # when a stranger first integrates: a field removed or a tag reused is
      # free to fix today and an external breaking change the moment anyone
      # depends on it. Policy in proto/EVOLUTION.md.
      #
      # `ref=refs/remotes/origin/main`, not `branch=main`, and the difference
      # is not cosmetic. On a pull request actions/checkout leaves the PR
      # branch checked out and main present only as a remote-tracking ref, so
      # asking for a *branch* named main fails with "couldn't find remote ref
      # main". Reproduced by cloning this repo and deleting the local main,
      # because testing it in a normal clone proves nothing: a developer's
      # clone has refs/heads/main and CI does not.
      #
      # The explicit fetch guarantees the ref exists rather than depending on
      # what actions/checkout happens to populate.
      #
      # On a push to main this compares main against itself, which is a no-op
      # rather than a special case worth branching on.
      - name: Check for breaking proto changes
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          buf breaking --against '.git#ref=refs/remotes/origin/main'

      # gen/ is committed so a reviewer reads the same bytes the build uses.
      # That only holds if CI notices when the two diverge, hence regenerating
      # and failing on any diff rather than trusting the author to have run it.
      - name: Check generated code is in sync
        run: |
          buf generate
          git diff --exit-code -- gen/ \
            || { echo "gen/ is out of date; run 'buf generate' and commit"; exit 1; }

      # Installed through the official action rather than `go install`, which is
      # a departure from how buf is installed above and the reason is wall
      # clock: the action fetches a prebuilt binary in seconds, where building
      # golangci-lint from source compiles a hundred or so linters on every
      # run. `install-only` because the loop below covers three modules, and
      # one step that names them all beats three copies of the same step.
      #
      # Both versions are pinned. The linter version especially: a linter that
      # moves on its own turns somebody's unrelated pull request red, on a day
      # they changed nothing it complains about.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          install-only: true

      # `run` covers the formatters too, so this is the Go equivalent of the
      # format check and the lint step in the `unit` job at once. Config is one
      # .golangci.yml at the root, shared by all four modules.
      #
      # apps/workers joined at ENT-231, when the integrations gateway gave it
      # something to do. The boundary check further down already named it
      # before it existed.
      - name: Lint every module
        run: |
          for module in apps/core-api apps/workers libs/chassis gen/go; do
            echo "== $module"
            (cd "$module" && golangci-lint run ./...)
          done

      - name: Build and test every module
        run: |
          for module in apps/core-api apps/workers libs/chassis gen/go; do
            echo "== $module"
            (cd "$module" && go build ./... && go test ./...)
          done

      # Service boundaries enforced by the build rather than by review habit
      # (core-api-surface §21.4). Boundaries policed only by reviewers erode in
      # weeks, and the erosion is invisible until two services cannot be
      # deployed independently.
      - name: Check service boundaries
        run: |
          if grep -rn "gen/go/kindlast/core" libs/chassis --include='*.go'; then
            echo "libs/chassis must not import core business types"
            exit 1
          fi
          if [ -d apps/workers ] \
             && grep -rn "apps/core-api" apps/workers --include='*.go'; then
            echo "apps/workers must not import apps/core-api"
            exit 1
          fi

  stack:
    name: Compose stack & isolation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The new self-managed stack (ENT-192): postgres-app with the role
      # split, the goose migration job, Zitadel, redis and the edge. This is
      # the stack the db test suite runs against, and the suite is the RLS
      # security boundary check. Mirroring the Supabase job above, the job
      # boots the stack and fails loudly if it does not come up, rather than
      # letting the suite silently skip.
      - name: Start the kindlast stack
        run: docker compose -f deploy/compose.yaml up -d

      - name: Wait for the seed job to finish
        run: |
          for i in $(seq 1 90); do
            status="$(docker inspect kindlast-seed --format '{{.State.Status}}' 2>/dev/null || echo missing)"
            if [ "$status" = "exited" ]; then
              exit_code="$(docker inspect kindlast-seed --format '{{.State.ExitCode}}')"
              echo "seed exited with ${exit_code}"
              exit "$exit_code"
            fi
            sleep 2
          done
          echo "seed job did not finish in time"
          exit 1

      # Guard: a healthy stack means migrations applied by the job container
      # and Zitadel serving OIDC discovery (the ENT-192 acceptance criteria).
      - name: Verify the stack is reachable
        run: |
          curl --fail --silent --show-error \
            http://localhost:8300/.well-known/openid-configuration > /dev/null
          curl --fail --silent --show-error http://localhost:8000/healthz > /dev/null

      - name: Database isolation tests
        run: bun run test:db

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # The Go suites that need real infrastructure: the interceptor chain
      # against a real Postgres and Redis, and tenancy proved as two users
      # (core-api-surface §13.3). They self-skip when the stack is unreachable,
      # which is right on a laptop and wrong here, so KINDLAST_REQUIRE_STACK
      # turns the skip into a failure. Without it a green run could mean the
      # security boundary was never exercised.
      #
      # `-p 1` is not a performance knob and is not a workaround (ENT-252). Go
      # runs different test PACKAGES in parallel by default, and every package
      # here connects to the one `kindlast` database, so two packages writing
      # the same table are two processes sharing state with no transaction
      # between them. That is what made the corpus drift guard intermittently
      # red: internal/server/interceptor seeds an obligation and deletes it
      # again while internal/store/postgres is counting obligations.
      #
      # ENT-252 also narrowed that guard so it measures only the rows it
      # ingested, which is the half that makes it correct rather than merely
      # serialised. This flag is the other half, and it is here because the
      # next such collision will be between two tables nobody has thought about
      # yet. Serialising is the honest statement that these are integration
      # tests over shared infrastructure rather than unit tests.
      #
      # It does not help the case of two worktrees sharing one compose stack,
      # which is ENT-250 and needs a stack per worktree.
      - name: Go tests that need the stack
        env:
          KINDLAST_REQUIRE_STACK: "1"
        run: |
          for module in apps/core-api libs/chassis; do
            echo "== $module"
            (cd "$module" && go test -p 1 ./...)
          done

      # core-api is reachable only on the compose network today, and this
      # asserts that rather than trusting a missing `ports` stanza nobody
      # reads. It is a check on the current phase, not on the architecture:
      # web, mobile and third parties are all intended clients, and build-order
      # step 7b opens this surface deliberately. When that lands, this
      # assertion is expected to change with it.
      - name: core-api publishes no port, and still answers internally
        run: |
          published="$(docker inspect kindlast-core-api --format '{{json .NetworkSettings.Ports}}')"
          if [ "$published" != "{}" ] && [ "$published" != "null" ]; then
            echo "core-api publishes ports, and must not: $published"
            exit 1
          fi
          docker run --rm --network kindlast_default curlimages/curl:8.11.1 \
            --fail --silent --show-error http://core-api:8080/healthz

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --tail 100

      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose.yaml down -v
