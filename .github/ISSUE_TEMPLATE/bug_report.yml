name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["Bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Do not report security vulnerabilities here.** Use
        [private vulnerability reporting](https://github.com/Entear-OU/kindlast/security/advisories/new)
        instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
      placeholder: I expected the Analyst to create a finding, but the feed stayed empty.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        The single most useful thing you can give us. Be specific enough that
        someone unfamiliar with your setup can follow along.
      placeholder: |
        1. Complete onboarding with a company in the "SaaS" sector
        2. Wait for the narrative sweep, or hit /api/analyst/narrate
        3. Open the dashboard
        4. The feed is empty
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or errors
      description: |
        Console output, server logs, or a stack trace. Redact anything sensitive
        first, particularly API keys and real organisation data.
      render: shell

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running Kindlast?
      options:
        - Local development
        - Self-hosted
        - Hosted (kindlast.com)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The commit SHA, tag, or release you are on.
      placeholder: b504747

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, pnpm version, OS, browser if relevant.
      placeholder: |
        Node 22.13.0
        pnpm 11.1.3
        Ubuntu 24.04
        Firefox 142
