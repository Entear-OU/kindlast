name: Feature request
description: Suggest a capability or an improvement
labels: ["Feature"]
body:
  - type: markdown
    attributes:
      value: |
        Before writing this up, it is worth checking the README for the current
        direction. Proposals that fit the four-agent model tend to land more
        easily than ones that cut across it.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: |
        Describe the situation you are in, not the solution you have in mind.
        The underlying problem is what we can actually evaluate, and it often
        has a better solution than the one that first comes to mind.
      placeholder: |
        As a DPO at a 40-person company, I need to show our auditor which
        obligations we have evidence for, but I can only export the whole
        register at once.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Your proposed solution, if you have one.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Including workarounds you are using today.

  - type: dropdown
    id: contributing
    attributes:
      label: Would you be willing to work on this?
      description: Entirely optional, and a "no" does not weigh against the request.
      options:
        - "Yes, I would like to implement it"
        - "Yes, with guidance"
        - "No, just suggesting"
    validations:
      required: true
