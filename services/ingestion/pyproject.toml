[project]
name = "kindlast-ingestion"
version = "0.1.0"
description = "Kindlast regulatory document ingestion pipeline"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0", # v1+ API with Firecrawl class, scrape(), crawl()
    "unstructured[md]>=0.12.0",
    "openai>=1.12.0",
    "cohere>=5.0.0",
    "qdrant-client>=1.7.0",
    "psycopg2-binary>=2.9.9",
    "structlog>=24.1.0",
    "firecrawl-py>=4.22.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
