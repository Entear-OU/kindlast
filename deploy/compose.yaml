# The Kindlast local stack (ENT-192, core-api-surface §0.4, §14).
#
# One command from a clean checkout:
#
#     docker compose -f deploy/compose.yaml up -d
#
# brings up, in dependency order, all under the single `kindlast` compose
# project:
#
#   postgres-app       pgvector/pg17. THE domain database. Roles are split by
#                      deploy/postgres/init/01-roles.sh before anything else
#                      touches it: kindlast_migrator owns the schema,
#                      kindlast_app (NOSUPERUSER, NOBYPASSRLS) serves requests,
#                      kindlast_vector_ro waits for the chunk tables. See the
#                      init script for why this split is the whole point.
#   migrate            goose job container. Applies db/migrations as
#                      kindlast_migrator and MUST exit zero before anything
#                      that talks to the schema starts. Migrations are a job,
#                      not boot code: N replicas racing the same DDL is the
#                      failure mode this shape prevents (§14.2).
#   postgres-platform  Infrastructure state whose schemas we do not own:
#                      zitadel now, temporal + temporal_visibility at
#                      build-order step 8. The application NEVER connects
#                      here, and nobody hand-writes migrations for it.
#   auth               Zitadel, self-migrating on boot, OIDC discovery at
#                      http://localhost:${KINDLAST_AUTH_PORT:-8300}/.well-known/openid-configuration
#   seed               Dev/test fixtures: two organisations with members in
#                      postgres-app, and the OAuth project + `web` client +
#                      role set in Zitadel. Idempotent; a re-run is a no-op.
#   redis              Sessions (web) and limits/deny-list (core-api) later.
#                      AOF on, noeviction: a cache policy that silently drops
#                      a session or a rate-limit counter is the trap §15.3
#                      exists to prevent.
#   model-init         Fetches the GGUF, verifies its SHA256, exits zero. A job
#                      rather than boot code for the same reason `migrate` is:
#                      the bytes a model serves must be pinned, and a server
#                      that pulls its own weights is the runtime fetch
#                      AGENTS.md forbids. Idempotent; a re-run is a no-op.
#                      IN THE `model` PROFILE, so it is opt-in; see below.
#   model              llama.cpp `llama-server`, OpenAI-compatible on :8080.
#                      Qwen3.5-4B Q4_K_M by default (§26.6). THE STACK NEEDS NO
#                      API KEY: inference is local, which is what lets a
#                      deployment holding a compliance record run with no
#                      outbound internet at all (§18.1). Also in the `model`
#                      profile.
#   edge               Caddy. Terminates the stack's front door; today it
#                      serves a health endpoint and reserves the routes web
#                      and core-api will claim in build-order step 1.
#
# The model is opt-in, because it is gigabytes:
#
#     docker compose -f deploy/compose.yaml --profile model up -d
#
# Its file lives at deploy/models/ on the host, deliberately not in a named
# volume, so `down -v` does not cost a 2.7 GB re-download.
#
# Passwords: every default below is a LOCAL DEVELOPMENT value. Override via
# environment or an env file for anything that leaves a laptop.

name: kindlast

volumes:
  postgres-app-data:
  postgres-platform-data:
  redis-data:
  zitadel-machinekey:

services:
  postgres-app:
    container_name: kindlast-postgres-app
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: ${KINDLAST_PG_SUPER_PASSWORD:-postgres-dev-password}
      KINDLAST_MIGRATOR_PASSWORD: ${KINDLAST_MIGRATOR_PASSWORD:-migrator-dev-password}
      KINDLAST_APP_PASSWORD: ${KINDLAST_APP_PASSWORD:-app-dev-password}
      KINDLAST_AGENT_PASSWORD: ${KINDLAST_AGENT_PASSWORD:-agent-dev-password}
      KINDLAST_BILLING_PASSWORD: ${KINDLAST_BILLING_PASSWORD:-billing-dev-password}
      KINDLAST_INGEST_PASSWORD: ${KINDLAST_INGEST_PASSWORD:-ingest-dev-password}
      KINDLAST_VECTOR_RO_PASSWORD: ${KINDLAST_VECTOR_RO_PASSWORD:-vector-ro-dev-password}
    volumes:
      - postgres-app-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${KINDLAST_PG_APP_PORT:-5433}:5432"
    healthcheck:
      # Two things make this check honest, and both are needed.
      #
      # The database name, because the init scripts create `kindlast` last, so
      # its presence means roles and grants are in place rather than merely
      # "a postmaster answered".
      #
      # `-h 127.0.0.1`, because during initdb the entrypoint runs a temporary
      # server that listens on the unix socket ONLY. A socket-based pg_isready
      # succeeds against that temporary server, the container is marked
      # healthy, the migration job starts, and then the real server restarts
      # and answers "the database system is starting up". Forcing TCP means
      # the check can only pass once the server clients actually use is
      # accepting connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d kindlast"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    container_name: kindlast-migrate
    image: kukymbr/goose-docker:3.24.2
    restart: "no"
    depends_on:
      postgres-app:
        condition: service_healthy
    volumes:
      - ../db/migrations:/migrations:ro
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: host=postgres-app port=5432 user=kindlast_migrator password=${KINDLAST_MIGRATOR_PASSWORD:-migrator-dev-password} dbname=kindlast sslmode=disable
      GOOSE_COMMAND: up

  postgres-platform:
    container_name: kindlast-postgres-platform
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${KINDLAST_PLATFORM_SUPER_PASSWORD:-platform-dev-password}
      ZITADEL_DB_PASSWORD: ${KINDLAST_ZITADEL_DB_PASSWORD:-zitadel-db-dev-password}
    volumes:
      - postgres-platform-data:/var/lib/postgresql/data
      - ./postgres/platform-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Same TCP requirement as postgres-app above: the socket answers during
      # init, the network does not.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d zitadel"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The zitadel image runs as uid 1000 but a fresh named volume is created
  # root-owned; hand it over before auth first writes its PAT there.
  machinekey-init:
    container_name: kindlast-machinekey-init
    image: alpine:3.21
    restart: "no"
    command: ["chown", "-R", "1000:1000", "/machinekey"]
    volumes:
      - zitadel-machinekey:/machinekey

  auth:
    container_name: kindlast-auth
    image: ghcr.io/zitadel/zitadel:v2.71.2
    depends_on:
      postgres-platform:
        condition: service_healthy
      machinekey-init:
        condition: service_completed_successfully
    command: >
      start-from-init
      --masterkey "${KINDLAST_ZITADEL_MASTERKEY:-DevMasterkeyMustBe32CharsLong!!!}"
    environment:
      # Env rather than --tlsMode so the `zitadel ready` healthcheck probes
      # over http too.
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: postgres-platform
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${KINDLAST_ZITADEL_DB_PASSWORD:-zitadel-db-dev-password}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${KINDLAST_PLATFORM_SUPER_PASSWORD:-platform-dev-password}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: ${KINDLAST_AUTH_PORT:-8300}
      ZITADEL_EXTERNALSECURE: "false"
      # First boot provisions an admin human and a machine user whose PAT
      # lands on the shared volume; the seed job uses that PAT to create the
      # project, the web OIDC client and the role set via the API.
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Kindlast
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${KINDLAST_ZITADEL_ADMIN_PASSWORD:-Password1!}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: seed-bot
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Seed Bot
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /machinekey/seed-bot-pat.txt
    volumes:
      - zitadel-machinekey:/machinekey
    ports:
      - "127.0.0.1:${KINDLAST_AUTH_PORT:-8300}:8080"
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 3s
      timeout: 5s
      retries: 40

  seed:
    container_name: kindlast-seed
    image: alpine:3.21
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
    environment:
      PGHOST: postgres-app
      PGDATABASE: kindlast
      PGUSER: kindlast_migrator
      PGPASSWORD: ${KINDLAST_MIGRATOR_PASSWORD:-migrator-dev-password}
      ZITADEL_URL: http://auth:8080
      ZITADEL_HOST_HEADER: "localhost:${KINDLAST_AUTH_PORT:-8300}"
      WEB_REDIRECT_URI: ${KINDLAST_WEB_REDIRECT_URI:-http://localhost:3000/auth/callback}
      # Mail. The credentials are arbitrary and never checked: mailpit below
      # runs with MP_SMTP_AUTH_ACCEPT_ANY. They exist because Zitadel refuses
      # to use a provider that has none, and reports the refusal as
      # SMTPConfig.NotFound; see the note in seed.sh.
      SMTP_HOST: mailpit:1025
      SMTP_SENDER_ADDRESS: noreply@kindlast.localhost
      SMTP_SENDER_NAME: Kindlast
      SMTP_USER: kindlast
      SMTP_PASSWORD: kindlast-dev-password
    volumes:
      - ./seed/seed.sh:/seed.sh:ro
      - ./seed/seed.sql:/seed.sql:ro
      # rw: the seed writes the created web client's credentials back to the
      # shared volume (web-client.json) for the web app to read in dev.
      - zitadel-machinekey:/machinekey
    command: ["/bin/sh", "/seed.sh"]

  # The resource server (ENT-195). Note what is absent: any `ports` stanza.
  #
  # core-api is reachable only on this network, which is an acceptance
  # criterion about the current phase rather than a property of the design.
  #
  # Web, mobile and third parties are all intended clients from the start, so
  # this service is not shaped around `web`. It stays dark because `web` is the
  # only client that exists yet, and an unexposed surface is one fewer thing to
  # defend. Step 7b in the build order opens it deliberately, behind a contract
  # that is stable by then. Until it does, the only exception §1.7 anticipates
  # is `/webhooks/*` routed through `edge`, and there are no webhooks yet.
  #
  # Reaching it by hand, for validation:
  #   docker compose -f deploy/compose.yaml exec core-api /core-api healthcheck
  #   docker run --rm --network kindlast_default curlimages/curl \
  #     -s http://core-api:8080/healthz
  core-api:
    container_name: kindlast-core-api
    build:
      context: ..
      dockerfile: apps/core-api/Dockerfile
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      KINDLAST_CORE_API_LISTEN: ":8080"

      # The issuer as tokens will carry it, which is where a browser reaches
      # Zitadel for the redirect flow.
      KINDLAST_OIDC_ISSUER: http://localhost:${KINDLAST_AUTH_PORT:-8300}
      # Where to actually fetch that configuration from, because no
      # `localhost:8300` exists on this network. The document must still
      # declare the issuer above, so this changes the address, never the trust.
      KINDLAST_OIDC_DISCOVERY_URL: http://auth:8080/.well-known/openid-configuration
      # Zitadel routes by Host: without this the request reaches the wrong
      # virtual server rather than failing cleanly.
      KINDLAST_OIDC_HOST_HEADER: "localhost:${KINDLAST_AUTH_PORT:-8300}"

      # Written by the seed job, because it is Zitadel's project id and so is
      # not known until the project exists.
      KINDLAST_OIDC_AUDIENCE_FILE: /machinekey/core-api-audience.txt

      # Where the caller's granted scopes actually live (ENT-197).
      #
      # Measured rather than assumed: Zitadel emits no `scope` claim and no
      # `scp` claim on an access token, whatever is requested. With
      # accessTokenRoleAssertion enabled on the web application it emits
      # project roles instead, under two claims, and the unversioned one is
      # used here because the other embeds a project id that differs per
      # deployment.
      #
      # The verifier reads the object-keyed shape these carry, so pointing at
      # them is configuration rather than a code change (§18.2).
      # Zitadel names its roles claim after the project the roles belong to,
      # so the real claim is urn:zitadel:iam:org:project:<projectId>:roles.
      # The id is generated by the seed and cannot be baked in here, and
      # core-api already holds it because the audience IS the project id, so
      # {audience} is expanded at load (ENT-221).
      #
      # This was previously written without the id at all, which meant
      # core-api watched a claim that never arrives and every human token
      # read as carrying no scopes.
      KINDLAST_OIDC_SCOPE_CLAIMS: "urn:zitadel:iam:org:project:{audience}:roles"

      # kindlast_app: owns nothing, NOSUPERUSER, NOBYPASSRLS. Connecting as
      # anything else makes every policy in the schema a silent no-op (§14.1).
      KINDLAST_DATABASE_URL: postgres://kindlast_app:${KINDLAST_APP_PASSWORD:-app-dev-password}@postgres-app:5432/kindlast?sslmode=disable
      # The producer pool (ENT-203). Without it SweepService is not served,
      # which is a supported configuration: a deployment that wants no
      # on-demand sweep trigger simply omits this. The role is created by
      # deploy/postgres/init/01-roles.sh and cannot create findings through
      # the application's pool by design.
      # The OAuth client whose tokens carry the human scope set (ENT-221).
      # Written by the seed, because the id is generated by Zitadel and cannot
      # be a literal here. Absent, client-class resolution stays off and every
      # caller is read from granted scopes.
      KINDLAST_HUMAN_CLIENT_ID_FILE: /machinekey/web-client-id.txt
      KINDLAST_AGENT_DATABASE_URL: postgres://kindlast_agent:${KINDLAST_AGENT_PASSWORD:-agent-dev-password}@postgres-app:5432/kindlast?sslmode=disable

      # The billing webhook's pool (ENT-210), on a role that holds grants on
      # exactly two tables and cannot reach a finding.
      #
      # Optional, the same way the agent pool is: without it the webhook is not
      # served at all rather than served and failing. That is billing-optional
      # (§18.1) expressed at the connection layer, and it means a self-hosted
      # stack that never created the role keeps working rather than answering
      # 500 to a provider that will retry for days.
      KINDLAST_BILLING_DATABASE_URL: postgres://kindlast_billing:${KINDLAST_BILLING_PASSWORD:-billing-dev-password}@postgres-app:5432/kindlast?sslmode=disable
      # The corpus write path (ENT-207). Its own role, holding grants on the ten
      # regulatory tables and nothing else, so the process that writes the law
      # cannot reach a customer's findings.
      KINDLAST_INGEST_DATABASE_URL: postgres://kindlast_ingest:${KINDLAST_INGEST_PASSWORD:-ingest-dev-password}@postgres-app:5432/kindlast?sslmode=disable

      # The provider's signing secret (ENT-210).
      #
      # Both this and the DSN above are required before the webhook route is
      # registered at all, so a deployment that leaves either unset has no
      # endpoint rather than one that refuses. The local default is a fixed
      # development value so the route exists on the compose stack and can be
      # exercised; it is not a secret and must not be reused anywhere real.
      #
      # A real deployment sets KINDLAST_BILLING_WEBHOOK_SECRET_FILE and mounts
      # it, because a signing secret in an environment variable is one a
      # `docker inspect` prints.
      KINDLAST_BILLING_WEBHOOK_SECRET: ${KINDLAST_BILLING_WEBHOOK_SECRET:-whsec_local_development_only}

      # Plan gating stays OFF on the bundled stack even though the webhook is
      # wired, and the two are genuinely independent (§18.1). The webhook exists
      # here so it can be tested; gating decides whether anybody is refused
      # anything for being on the free plan, and a local stack that sells
      # nothing should refuse nobody.
      KINDLAST_BILLING_ENABLED: ${KINDLAST_BILLING_ENABLED:-false}
      KINDLAST_REDIS_ADDR: redis:6379

      # Where a browser reaches the console, used to build the invitation link
      # at mint (ENT-219).
      #
      # This is the one public address core-api is told about, and it has to be
      # the browser's view rather than the compose network's: `web:3000` exists
      # only in here, and a link to it in somebody's inbox resolves nowhere.
      #
      # Required for inviting. InviteMember refuses rather than minting an
      # invitation whose link cannot be built, because the raw token exists for
      # one handler and a bad link cannot be repaired afterwards.
      KINDLAST_APP_BASE_URL: http://localhost:${KINDLAST_WEB_PORT:-3000}

      # The dispatcher's mail submission address (ENT-219).
      #
      # Mailpit publishes no SMTP port to the host deliberately, so this only
      # resolves from inside the compose network, which is where core-api runs.
      # Absent, transactional messages queue as `pending` and nothing is lost;
      # core-api warns at boot rather than failing to start.
      KINDLAST_SMTP_ADDR: mailpit:1025
      KINDLAST_EMAIL_FROM: noreply@kindlast.localhost
    volumes:
      - zitadel-machinekey:/machinekey:ro
    healthcheck:
      # The runtime image is distroless, so there is no curl to probe with and
      # the binary probes itself.
      test: ["CMD", "/core-api", "healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Mail, captured rather than sent (ENT-197).
  #
  # Without this, self-service registration cannot complete on a local stack at
  # all: Zitadel sends a verification code, there is nowhere for it to go, and
  # the account sits in USER_STATE_INITIAL forever. Found by registering a user
  # through the browser and getting stuck on exactly that screen.
  #
  # It also carries the invitation links in §20.1, password resets, and the
  # email channel that build-order step 9 begins with, so it earns a container
  # rather than being a workaround for one flow.
  #
  # Nothing here ever reaches a real address, which is the point: a development
  # stack that can email actual people is a stack that eventually does.
  mailpit:
    container_name: kindlast-mailpit
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      # Keep the capture bounded; this is a development mailbox, not an archive.
      MP_MAX_MESSAGES: "500"
    ports:
      # The web UI, for a human reading what the stack sent. SMTP on 1025 stays
      # internal: nothing outside the network should be able to post mail.
      - "127.0.0.1:${KINDLAST_MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    container_name: kindlast-redis
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${KINDLAST_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The model, fetched once and verified, then served (ENT-235, §26.6).
  #
  # WHY A JOB AND NOT A VOLUME THE SERVER FILLS ITSELF
  #
  # `AGENTS.md` says pin everything and fetch nothing at runtime. A server that
  # pulls its own weights on boot is the thing that rule forbids: the bytes it
  # runs depend on what a registry served that morning. So the fetch is a job
  # that verifies a digest and exits zero, the same shape `migrate`,
  # `machinekey-init` and `seed` already use, and the server only ever opens a
  # file that has already been checked.
  #
  # llama.cpp's own convenience path, `llama-server -hf <repo>`, is exactly the
  # runtime pull this avoids. It is fine for evaluating a model and wrong here.
  model-init:
    container_name: kindlast-model-init
    image: curlimages/curl:8.21.0
    # BEHIND A PROFILE, SO A PLAIN `up -d` DOES NOT FETCH GIGABYTES.
    #
    # This looks like it weakens "one command from a clean checkout", and it is
    # worth saying why it does not. ENT-212 already establishes that an
    # instance with no model degrades to a form rather than failing, so a
    # modelless stack is a supported configuration rather than a broken one.
    # What the profile changes is which supported configuration you get by
    # default, and defaulting to the one that does not download 2.7 GB is the
    # right way round for CI, for a developer who wants the database, and for
    # anyone on a metered connection.
    #
    # Found the hard way: without this, the isolation suite's stack boot pulled
    # the model on every CI run, which is minutes of wall clock and bandwidth
    # spent on a service those tests never touch.
    #
    #     docker compose -f deploy/compose.yaml --profile model up -d
    profiles: ["model"]
    # Runs as root, which a job container writing one file to a bind mount can
    # afford and this one needs: the image's own user is uid 100, the mounted
    # host directory belongs to whoever checked the repository out, and the
    # mismatch surfaces as curl exit 23, a write error several layers from its
    # cause.
    user: "0:0"
    volumes:
      # A BIND MOUNT, NOT A NAMED VOLUME, AND THIS IS DELIBERATE.
      #
      # docs/self-hosting.md tells people to tear the stack down with
      # `down -v`. With a named volume that instruction costs a 2.7 GB
      # re-download every single time, and the stack would feel permanently
      # slow for a reason nobody would guess. A host path survives it.
      - ./models:/models
    environment:
      # ONE VARIABLE, BECAUSE THE THREE UNDERNEATH IT ARE A MATCHED TRIPLE.
      #
      # Filename, URL and digest have to move together. Setting one alone is
      # not a partial configuration, it is a wrong one: point the 4B digest at
      # the 2B filename and this job concludes the file on disk is corrupt,
      # deletes a good model, and fetches the other one under the wrong name.
      # That happened once while this was being written, which is why the tier
      # is a single value and the triple is derived rather than typed.
      KINDLAST_MODEL_TIER: ${KINDLAST_MODEL_TIER:-4b}

      # The escape hatch, for a model that is not one of the three tiers. All
      # three must be set together; setting some is refused rather than merged
      # with the tier's values, for the reason above.
      KINDLAST_MODEL_FILE: ${KINDLAST_MODEL_FILE:-}
      KINDLAST_MODEL_URL: ${KINDLAST_MODEL_URL:-}
      KINDLAST_MODEL_SHA256: ${KINDLAST_MODEL_SHA256:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        # Custom model: all three or none.
        n=0
        [ -n "$${KINDLAST_MODEL_FILE}" ]   && n=$$((n+1)) || true
        [ -n "$${KINDLAST_MODEL_URL}" ]    && n=$$((n+1)) || true
        [ -n "$${KINDLAST_MODEL_SHA256}" ] && n=$$((n+1)) || true

        if [ "$$n" -gt 0 ] && [ "$$n" -lt 3 ]; then
          echo "refusing a partial model override: set KINDLAST_MODEL_FILE, KINDLAST_MODEL_URL and KINDLAST_MODEL_SHA256 together, or none of them and use KINDLAST_MODEL_TIER" >&2
          exit 1
        fi

        if [ "$$n" -eq 0 ]; then
          # Digests and revisions read from the Hugging Face API on 2026-08-17,
          # not copied from a document. The URL pins a repository commit rather
          # than `main`, so the bytes cannot change under a redeploy.
          case "$${KINDLAST_MODEL_TIER}" in
            2b)
              KINDLAST_MODEL_FILE=Qwen3.5-2B-Q4_K_M.gguf
              KINDLAST_MODEL_URL=https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/f6d5376be1edb4d416d56da11e5397a961aca8ae/Qwen3.5-2B-Q4_K_M.gguf
              KINDLAST_MODEL_SHA256=aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223
              ;;
            4b)
              KINDLAST_MODEL_FILE=Qwen3.5-4B-Q4_K_M.gguf
              KINDLAST_MODEL_URL=https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/e87f176479d0855a907a41277aca2f8ee7a09523/Qwen3.5-4B-Q4_K_M.gguf
              KINDLAST_MODEL_SHA256=00fe7986ff5f6b463e62455821146049db6f9313603938a70800d1fb69ef11a4
              ;;
            9b)
              KINDLAST_MODEL_FILE=Qwen3.5-9B-Q4_K_M.gguf
              KINDLAST_MODEL_URL=https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf
              KINDLAST_MODEL_SHA256=03b74727a860a56338e042c4420bb3f04b2fec5734175f4cb9fa853daf52b7e8
              ;;
            *)
              echo "unknown KINDLAST_MODEL_TIER '$${KINDLAST_MODEL_TIER}': expected 2b, 4b or 9b" >&2
              exit 1
              ;;
          esac
        fi

        target="/models/$${KINDLAST_MODEL_FILE}"

        if [ -f "$$target" ]; then
          # Already here and correct: exit immediately. This is what makes a
          # second `up -d` instant rather than a re-verify of gigabytes.
          if echo "$${KINDLAST_MODEL_SHA256}  $$target" | sha256sum -c -; then
            ln -sf "$${KINDLAST_MODEL_FILE}" /models/current.gguf
            echo "model present and verified: $$target"
            exit 0
          fi
          echo "model present but FAILED verification, refetching" >&2
          rm -f "$$target"
        fi

        # Airgapped installs put the file here by hand and never reach this
        # line. If you are here with no network, that is the supported path.
        echo "fetching $${KINDLAST_MODEL_FILE} (this is gigabytes; it runs once)"
        curl -fL --retry 3 --retry-delay 2 --no-progress-meter \
          -o "$$target.part" "$${KINDLAST_MODEL_URL}"

        # Verify BEFORE the rename. A half-written file under the real name
        # would pass the `-f` test on the next boot and be served as weights.
        echo "$${KINDLAST_MODEL_SHA256}  $$target.part" | sha256sum -c -
        mv "$$target.part" "$$target"

        # The server loads `current.gguf` and never learns the tier, so
        # switching tiers is this job's business alone. Without the indirection
        # the filename would have to be threaded into the server's command
        # line too, which is the desync this whole block exists to prevent.
        ln -sf "$${KINDLAST_MODEL_FILE}" /models/current.gguf
        echo "model fetched and verified: $$target"

  model:
    container_name: kindlast-model
    # Same profile as `model-init`. Starting a server with no weights would
    # only produce a container that restarts forever.
    profiles: ["model"]
    # Pinned by digest rather than by tag: `:server` moves, and the bytes that
    # serve a customer's compliance record should not change because a tag was
    # repointed. Resolved 2026-08-17 from ghcr.io/ggml-org/llama.cpp:server.
    image: ghcr.io/ggml-org/llama.cpp@sha256:2244d2b223b49912c7e0c31b4a3654e5e62cf19899f1f36ad30e785eac171a31
    depends_on:
      model-init:
        condition: service_completed_successfully
    volumes:
      - ./models:/models:ro
    command:
      # A symlink `model-init` points at whichever tier it just verified. The
      # server therefore has no opinion about which model it is serving, and
      # changing tier is one variable on the job rather than two values that
      # have to agree across two services.
      #
      # THE SERVER MUST BE RESTARTED WHEN THE LINK MOVES. It opens the file
      # once at boot, so re-running `model-init` alone against a running server
      # repoints the link and changes nothing that is being served. A full
      # `up -d` handles it through the `depends_on` below; a tier switch on a
      # live stack needs `up -d --force-recreate model`. Without this note the
      # symptom is an operator who changed the tier, saw the job succeed, and
      # is being answered by the old model with no indication why.
      - --model
      - /models/current.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      # Context is a RAM decision, not a capability one. Qwen3.5 supports
      # 262144 tokens natively, and allocating that much KV cache would want
      # far more memory than the model itself. This is sized for the corpus
      # prefix plus a run, and an operator with headroom raises it.
      - --ctx-size
      - "${KINDLAST_MODEL_CTX:-16384}"
      # NO `--cache-reuse` HERE, AND THAT IS A FINDING RATHER THAN AN OMISSION.
      #
      # §26 wants the corpus as a cached static prompt prefix, so this file
      # originally carried `--cache-reuse 256`. The server disables it: it logs
      # "cache_reuse is not supported by this context, it will be disabled" and
      # starts anyway. Tried with `--kv-unified` as well, on the theory that a
      # unified KV cache was the missing requirement; `kv_unified = 'true'` in
      # the log and the flag is still refused, so it is the model rather than
      # the cache mode. Shipping it would mean a warning on every boot for a
      # behaviour that never happens.
      #
      # The prefix caching §26 actually needs does work, by the simpler exact
      # prefix match a slot does on its own. Measured on a repeat request:
      # `prompt_tokens_details.cached_tokens` came back 38 of 44. So the corpus
      # prefix is not reprocessed per run, which was the requirement; it just
      # is not this flag that delivers it.
      #
      # Chat template handling, needed for the tool and structured-output paths
      # to render the way the model was trained.
      - --jinja
      # THINKING IS OFF, AND IT IS NOT OFF BY DEFAULT.
      #
      # Measured, not assumed. Qwen3.5's small models are documented as having
      # reasoning disabled by default, and this build does the opposite: a
      # plain request came back with `content` empty, `reasoning_content` full
      # of a thinking trace, and `finish_reason: length` because it exhausted
      # the token limit before answering. With reasoning off the same request
      # answered in 41 completion tokens instead of over 200.
      #
      # §26.3's per-run token budget assumes the cheap path, so the cheap path
      # has to be the server's default. A caller that wants thinking can ask
      # for it per request; nothing gets it by accident.
      - --reasoning
      - "off"
      - --parallel
      - "${KINDLAST_MODEL_PARALLEL:-2}"
    healthcheck:
      # `/health` returns 200 only once the weights are loaded, so a dependent
      # service waiting on this is waiting on a model that can actually answer
      # rather than on a process that has started.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      # Generous: first load reads gigabytes off disk, and a cold page cache
      # on a laptop is slower than anything else in this file.
      retries: 60
      start_period: 30s
    ports:
      # Loopback only, like every other published port in this file. The server
      # logs a warning on boot that CORS allows all origins and no API key is
      # set, which is true and worth understanding rather than silencing: a
      # page in a browser on this machine can reach the endpoint. The exposure
      # is compute, not data (the model holds no tenant state and reads no
      # database), and it is the same posture as postgres and redis publishing
      # here, which carry considerably more. A deployment that wants the
      # endpoint closed should drop this mapping: nothing in the stack needs
      # it, because services reach the model over the compose network. It is
      # published for `bun run dev`, the Postman collection, and debugging.
      - "127.0.0.1:${KINDLAST_MODEL_PORT:-8081}:8080"

  edge:
    container_name: kindlast-edge
    image: caddy:2-alpine
    depends_on:
      auth:
        condition: service_healthy
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:${KINDLAST_EDGE_PORT:-8000}:80"
